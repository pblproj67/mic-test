<script>

/* =========================================================
   REF-22 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-23 — ELEMENTS
========================================================= */

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const voiceSelectEl =
  document.getElementById("voiceSelect");

const testVoiceBtn =
  document.getElementById("testVoiceBtn");


const mediaBtn =
  document.getElementById("mediaBtn");

const mediaText =
  document.getElementById("mediaText");

const mediaFile =
  document.getElementById("mediaFile");

const mediaStatus =
  document.getElementById("mediaStatus");

const mediaProgressOuter =
  document.getElementById("mediaProgressOuter");

const mediaProgressInner =
  document.getElementById("mediaProgressInner");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/* =========================================================
   REF-24 — STATE
========================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let manualStop = false;

let liveView = true;

let saving = false;

let reading = false;

let mediaBusy = false;


/*
  PREVIOUS COMPLETED CHROME SESSIONS
*/

let committedText = "";


/*
  CURRENT CHROME SESSION
*/

let sessionFinalText = "";

let sessionInterimText = "";


/*
  TTS
*/

let availableVoices = [];


/*
  DISPLAY
*/

let displayFramePending = false;


/*
  WHISPER

  Nothing is loaded until IMPORT MEDIA
  is actually used.
*/

let whisperPipeline = null;

let transformersModule = null;


/* =========================================================
   REF-25 — DESTINATION
========================================================= */

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/* =========================================================
   REF-26 — NORMALIZE
========================================================= */

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   REF-27 — COLLAPSE PROGRESSIVE CHROME RESULTS

   Example:

   diplomacy
   diplomacy often
   diplomacy often gets
   diplomacy often gets a bad rep

   becomes:

   diplomacy often gets a bad rep
========================================================= */

function collapseProgressiveParts(parts) {

  const cleaned = [];


  for (
    let i = 0;
    i < parts.length;
    i++
  ) {

    const current =
      normalizeText(
        parts[i]
      );


    if (!current) {
      continue;
    }


    if (
      cleaned.length === 0
    ) {

      cleaned.push(
        current
      );

      continue;
    }


    const lastIndex =
      cleaned.length - 1;


    const previous =
      cleaned[lastIndex];


    const previousLower =
      previous.toLowerCase();


    const currentLower =
      current.toLowerCase();


    /*
      SAME
    */

    if (
      previousLower ===
      currentLower
    ) {

      continue;
    }


    /*
      CURRENT IS LONGER VERSION
    */

    if (
      currentLower.startsWith(
        previousLower
      )
    ) {

      cleaned[lastIndex] =
        current;

      continue;
    }


    /*
      PREVIOUS WAS ALREADY LONGER
    */

    if (
      previousLower.startsWith(
        currentLower
      )
    ) {

      continue;
    }


    /*
      GENUINELY NEW PHRASE
    */

    cleaned.push(
      current
    );

  }


  return normalizeText(
    cleaned.join(" ")
  );

}


/* =========================================================
   REF-28 — REBUILD CURRENT CHROME SESSION
========================================================= */

function rebuildCurrentSession(results) {

  const finalParts = [];

  const interimParts = [];


  for (
    let i = 0;
    i < results.length;
    i++
  ) {

    const result =
      results[i];


    if (
      !result ||
      !result[0]
    ) {

      continue;
    }


    const text =
      normalizeText(
        result[0].transcript
      );


    if (!text) {
      continue;
    }


    if (
      result.isFinal
    ) {

      finalParts.push(
        text
      );

    }

    else {

      interimParts.push(
        text
      );

    }

  }


  /*
    REPLACE CURRENT SESSION.

    DO NOT APPEND EVERY EVENT.
  */

  sessionFinalText =
    collapseProgressiveParts(
      finalParts
    );


  sessionInterimText =
    collapseProgressiveParts(
      interimParts
    );

}


/* =========================================================
   REF-29 — COMMIT CHROME SESSION
========================================================= */

function commitCurrentSession() {

  const text =
    normalizeText(
      sessionFinalText
    );


  if (text) {

    committedText +=
      (committedText ? " " : "") +
      text;


    committedText =
      normalizeText(
        committedText
      );

  }


  sessionFinalText =
    "";


  sessionInterimText =
    "";

}


/* =========================================================
   REF-30 — FULL CURRENT TRANSCRIPT
========================================================= */

function getCurrentTranscript() {

  let text =
    normalizeText(
      committedText
    );


  const currentFinal =
    normalizeText(
      sessionFinalText
    );


  const currentInterim =
    normalizeText(
      sessionInterimText
    );


  if (currentFinal) {

    text +=
      (text ? " " : "") +
      currentFinal;

  }


  if (currentInterim) {

    text +=
      (text ? " " : "") +
      currentInterim;

  }


  return normalizeText(
    text
  );

}


/* =========================================================
   REF-31 — DISPLAY REFRESH
========================================================= */

function refreshTranscriptDisplay(
  force = false
) {

  /*
    LIVE VIEW OFF:

    recognition continues,
    screen remains frozen.
  */

  if (
    listening &&
    !liveView &&
    !force
  ) {

    return;

  }


  if (force) {

    displayFramePending =
      false;


    heardEl.value =
      getCurrentTranscript();


    if (
      listening &&
      liveView
    ) {

      heardEl.scrollTop =
        heardEl.scrollHeight;

    }


    return;

  }


  if (displayFramePending) {
    return;
  }


  displayFramePending =
    true;


  requestAnimationFrame(
    function() {

      displayFramePending =
        false;


      if (
        listening &&
        !liveView
      ) {

        return;
      }


      heardEl.value =
        getCurrentTranscript();


      if (
        listening &&
        liveView
      ) {

        heardEl.scrollTop =
          heardEl.scrollHeight;

      }

    }
  );

}


/* =========================================================
   REF-32 — TEXTBOX MODE
========================================================= */

function updateTextboxMode() {

  /*
    STOPPED
  */

  if (!listening) {

    heardEl.readOnly =
      false;


    heardEl.setAttribute(
      "inputmode",
      "text"
    );


    heardEl.classList.remove(
      "listeningLock",
      "liveView",
      "frozenView"
    );


    return;
  }


  /*
    LISTENING

    LOCK KEYBOARD + TEXT SELECTION.
  */

  heardEl.readOnly =
    true;


  heardEl.setAttribute(
    "inputmode",
    "none"
  );


  heardEl.blur();


  heardEl.classList.add(
    "listeningLock"
  );


  if (liveView) {

    heardEl.classList.add(
      "liveView"
    );


    heardEl.classList.remove(
      "frozenView"
    );

  }

  else {

    heardEl.classList.remove(
      "liveView"
    );


    heardEl.classList.add(
      "frozenView"
    );

  }

}


/* =========================================================
   REF-33 — TAP TEXTBOX LIVE/FREEZE
========================================================= */

heardEl.addEventListener(
  "pointerdown",

  function(event) {

    if (!listening) {
      return;
    }


    event.preventDefault();


    heardEl.blur();


    liveView =
      !liveView;


    updateTextboxMode();


    if (liveView) {

      refreshTranscriptDisplay(
        true
      );


      heardEl.scrollTop =
        heardEl.scrollHeight;


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {

      statusEl.textContent =
        "LISTENING — VIEW FROZEN — TAP TEXT TO RESUME";

    }

  }
);


/* =========================================================
   REF-34 — CREATE LIVE SPEECH RECOGNIZER
========================================================= */

function createRecognizer() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;
  }


  /*
    AUTO DETECT is not available for
    Chrome live recognition.
  */

  if (
    languageEl.value === "auto"
  ) {

    resultEl.textContent =
      "Choose Gujarati, Hindi or English for live microphone dictation.";

    return false;
  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/* =========================================================
   REF-35 — LIVE RECOGNITION START
========================================================= */

  recognition.onstart =
    function() {

      recognitionRunning =
        true;

  };


/* =========================================================
   REF-36 — LIVE RECOGNITION RESULT
========================================================= */

  recognition.onresult =
    function(event) {

      rebuildCurrentSession(
        event.results
      );


      refreshTranscriptDisplay();

  };


/* =========================================================
   REF-37 — LIVE RECOGNITION ERROR
========================================================= */

  recognition.onerror =
    function(event) {

      if (
        event.error === "aborted" &&
        manualStop
      ) {

        return;
      }


      if (
        event.error === "no-speech"
      ) {

        return;
      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;


      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed" ||
        event.error === "audio-capture"
      ) {

        manualStop =
          true;


        listening =
          false;


        recognitionRunning =
          false;


        updateMicButton();


        updateTextboxMode();

      }

  };


/* =========================================================
   REF-38 — LIVE RECOGNITION END
========================================================= */

  recognition.onend =
    function() {

      recognitionRunning =
        false;


      /*
        PERMANENTLY STORE FINAL ONLY.
      */

      commitCurrentSession();


      if (
        manualStop ||
        !listening
      ) {

        refreshTranscriptDisplay(
          true
        );


        return;
      }


      /*
        QUICK RESTART.
      */

      setTimeout(

        function() {

          if (
            !listening ||
            manualStop ||
            recognitionRunning
          ) {

            return;
          }


          startRecognitionSession();

        },

        50

      );

  };


  return true;

}


/* =========================================================
   REF-39 — START LIVE SESSION
========================================================= */

function startRecognitionSession() {

  if (
    !listening ||
    recognitionRunning
  ) {

    return;
  }


  if (
    !createRecognizer()
  ) {

    listening =
      false;


    updateMicButton();


    updateTextboxMode();


    return;
  }


  try {

    recognition.start();

  }

  catch(error) {

    console.log(
      "Recognition start:",
      error
    );

  }

}


/* =========================================================
   REF-40 — MIC BUTTON UI
========================================================= */

function updateMicButton() {

  if (listening) {

    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    if (liveView) {

      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {

      statusEl.textContent =
        "LISTENING — VIEW FROZEN";

    }


    languageEl.disabled =
      true;


    mediaBtn.disabled =
      true;

  }

  else {

    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      mediaBusy;


    mediaBtn.disabled =
      mediaBusy;

  }

}


/* =========================================================
   REF-41 — MIC START / STOP
========================================================= */

micBtn.addEventListener(
  "click",

  function() {

    /*
      MEDIA TRANSCRIPTION HAS PRIORITY
    */

    if (mediaBusy) {

      resultEl.textContent =
        "Media transcription is currently running.";

      return;
    }


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    if (!listening) {

      if (
        languageEl.value === "auto"
      ) {

        resultEl.textContent =
          "AUTO DETECT is for imported media. Select a language for live LISTEN.";

        return;
      }


      stopReading();


      committedText =
        "";


      sessionFinalText =
        "";


      sessionInterimText =
        "";


      heardEl.value =
        "";


      heardEl.scrollTop =
        0;


      resultEl.textContent =
        "";


      liveView =
        true;


      manualStop =
        false;


      listening =
        true;


      updateMicButton();


      updateTextboxMode();


      startRecognitionSession();


      return;
    }


    /* -----------------------------------------------------
       STOP
    ----------------------------------------------------- */

    manualStop =
      true;


    listening =
      false;


    updateMicButton();


    updateTextboxMode();


    statusEl.textContent =
      "DICTATION READY";


    try {

      if (recognition) {

        recognition.stop();

      }

    }

    catch(error) {

/* =========================================================
   REF-47 — LOAD WHISPER MODEL
========================================================= */

async function getWhisperPipeline() {

  if (whisperPipeline) {

    return whisperPipeline;
  }


  const module =
    await loadTransformersModule();


  const pipeline =
    module.pipeline;


  const MODEL =
    "onnx-community/whisper-tiny";


  mediaText.textContent =
    "LOADING AI MODEL...";


  setMediaProgress(
    5,
    "First use may take a while..."
  );


  /*
    Try WebGPU first.
  */

  try {

    whisperPipeline =
      await pipeline(
        "automatic-speech-recognition",
        MODEL,
        {
          device: "webgpu",

          progress_callback:
            function(info) {

              if (
                info &&
                typeof info.progress ===
                "number"
              ) {

                const p =
                  5 +
                  (
                    Math.max(
                      0,
                      Math.min(
                        100,
                        info.progress
                      )
                    ) *
                    0.35
                  );


                setMediaProgress(
                  p,
                  "Loading Whisper AI..."
                );

              }

            }
        }
      );


    mediaStatus.textContent =
      "Whisper loaded using WebGPU";


    return whisperPipeline;

  }

  catch(gpuError) {

    console.log(
      "WebGPU unavailable. Falling back.",
      gpuError
    );

  }


  /*
    CPU/WASM FALLBACK
  */

  mediaStatus.textContent =
    "Using compatibility mode...";


  whisperPipeline =
    await pipeline(
      "automatic-speech-recognition",
      MODEL,
      {

        progress_callback:
          function(info) {

            if (
              info &&
              typeof info.progress ===
                "number"
            ) {

              const p =
                5 +
                (
                  Math.max(
                    0,
                    Math.min(
                      100,
                      info.progress
                    )
                  ) *
                  0.35
                );


              setMediaProgress(
                p,
                "Loading Whisper AI..."
              );

            }

          }

      }
    );


  return whisperPipeline;

}


/* =========================================================
   REF-48 — DECODE MEDIA
========================================================= */

async function decodeMediaFile(file) {

  setMediaProgress(
    42,
    "Decoding media audio..."
  );


  const arrayBuffer =
    await file.arrayBuffer();


  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContextClass) {

    throw new Error(
      "Audio decoding is not supported on this browser."
    );

  }


  const context =
    new AudioContextClass();


  let decoded;


  try {

    decoded =
      await context.decodeAudioData(
        arrayBuffer.slice(0)
      );

  }

  catch(error) {

    await context.close();


    throw new Error(
      "This media format could not be decoded. Try MP3, M4A or WAV."
    );

  }


  /*
    CONVERT CHANNELS TO MONO
  */

  let mono;


  if (
    decoded.numberOfChannels === 1
  ) {

    mono =
      new Float32Array(
        decoded.getChannelData(0)
      );

  }

  else {

    mono =
      new Float32Array(
        decoded.length
      );


    for (
      let channel = 0;
      channel < decoded.numberOfChannels;
      channel++
    ) {

      const data =
        decoded.getChannelData(
          channel
        );


      for (
        let i = 0;
        i < decoded.length;
        i++
      ) {

        mono[i] +=
          data[i] /
          decoded.numberOfChannels;

      }

    }

  }


  const sourceRate =
    decoded.sampleRate;


  await context.close();


  setMediaProgress(
    50,
    "Preparing audio..."
  );


  /*
    RESAMPLE TO 16 kHz FOR WHISPER
  */

  if (
    sourceRate === 16000
  ) {

    return mono;

  }


  const targetLength =
    Math.ceil(
      mono.length *
      16000 /
      sourceRate
    );


  const offline =
    new OfflineAudioContext(
      1,
      targetLength,
      16000
    );


  const buffer =
    offline.createBuffer(
      1,
      mono.length,
      sourceRate
    );


  buffer.copyToChannel(
    mono,
    0
  );


  const source =
    offline.createBufferSource();


  source.buffer =
    buffer;


  source.connect(
    offline.destination
  );


  source.start(0);


  const rendered =
    await offline.startRendering();


  return new Float32Array(
    rendered.getChannelData(0)
  );

}

/* =========================================================
   REF-50 — MEDIA FILE SELECTED
========================================================= */

mediaFile.addEventListener(
  "change",

  async function() {

    const file =
      mediaFile.files &&
      mediaFile.files[0];


    if (!file) {

      return;
    }


    if (listening) {

      resultEl.textContent =
        "Stop LISTEN before importing media.";

      return;
    }


    try {

      mediaBusy =
        true;


      mediaBtn.classList.add(
        "busy"
      );


      mediaBtn.disabled =
        true;


      micBtn.disabled =
        true;


      languageEl.disabled =
        true;


      readBtn.disabled =
        true;


      clearBtn.disabled =
        true;


      saveBtn.disabled =
        true;


      mediaText.textContent =
        "PREPARING...";


      resultEl.textContent =
        "";


      statusEl.textContent =
        "MEDIA TRANSCRIPTION";


      setMediaProgress(
        1,
        file.name
      );


      /*
        LOAD WHISPER
      */

      const transcriber =
        await getWhisperPipeline();


      /*
        DECODE AUDIO
      */

      const audio =
        await decodeMediaFile(
          file
        );


      setMediaProgress(
        60,
        "Transcribing locally..."
      );


      mediaText.textContent =
        "TRANSCRIBING...";


      /*
        WHISPER OPTIONS
      */

      const options = {

        task:
          "transcribe",

        chunk_length_s:
          30,

        stride_length_s:
          5

      };


      const whisperLanguage =
        getWhisperLanguage();


      /*
        If AUTO:
        don't send language.
        Whisper determines it.
      */

      if (whisperLanguage) {

        options.language =
          whisperLanguage;

      }


      /*
        PROCESS
      */

      const output =
        await transcriber(
          audio,
          options
        );


      setMediaProgress(
        95,
        "Finishing transcript..."
      );


      const transcript =
        normalizeText(
          output &&
          output.text
            ? output.text
            : ""
        );


      if (!transcript) {

        throw new Error(
          "No speech was detected in this file."
        );

      }


      /*
        MEDIA TRANSCRIPT BECOMES
        CURRENT TEXTBOX CONTENT.
      */

      committedText =
        transcript;


      sessionFinalText =
        "";


      sessionInterimText =
        "";


      heardEl.value =
        transcript;


      heardEl.scrollTop =
        0;


      setMediaProgress(
        100,
        "TRANSCRIPTION COMPLETE"
      );


      mediaText.textContent =
        "IMPORT MEDIA";


      statusEl.textContent =
        "MEDIA TRANSCRIPT READY";


      resultEl.textContent =
        "Edit, READ or SAVE the transcript.";

    }

    catch(error) {

      console.error(
        error
      );


      mediaText.textContent =
        "IMPORT MEDIA";


      mediaStatus.textContent =
        "TRANSCRIPTION FAILED";


      resultEl.textContent =
        error &&
        error.message
          ? error.message
          : "Unable to transcribe media file.";


      mediaProgressInner.style.width =
        "0%";

    }

    finally {

      mediaBusy =
        false;


      mediaBtn.classList.remove(
        "busy"
      );


      mediaBtn.disabled =
        false;


      micBtn.disabled =
        false;


      languageEl.disabled =
        false;


      readBtn.disabled =
        false;


      clearBtn.disabled =
        false;


      saveBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   REF-51 — LOAD DEVICE TTS VOICES
========================================================= */

function loadVoices() {

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;
  }


  availableVoices =
    window.speechSynthesis
      .getVoices();


  const previousSelection =
    voiceSelectEl.value;


  voiceSelectEl.innerHTML =
    "";


  /*
    AUTO has no specific TTS language.
  */

  if (
    languageEl.value === "auto"
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Select language first";


    voiceSelectEl.appendChild(
      option
    );


    return;
  }


  const selectedLanguage =
    languageEl.value.toLowerCase();


  const baseLanguage =
    selectedLanguage.split("-")[0];


  let matchingVoices =
    availableVoices.filter(
      function(voice) {

        const voiceLanguage =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          voiceLanguage === selectedLanguage ||
          voiceLanguage.startsWith(
            baseLanguage + "-"
          )
        );

      }
    );


  if (
    matchingVoices.length === 0
  ) {

    matchingVoices =
      availableVoices;

  }


  if (
    matchingVoices.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Default device voice";


    voiceSelectEl.appendChild(
      option
    );


    return;
  }


  matchingVoices.forEach(
    function(voice) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        availableVoices.indexOf(
          voice
        );


      let label =
        voice.name +
        " — " +
        voice.lang;


      if (voice.default) {

        label +=
          " ★";

      }


      option.textContent =
        label;


      voiceSelectEl.appendChild(
        option
      );

    }
  );


  if (
    previousSelection &&
    [...voiceSelectEl.options]
      .some(
        option =>
          option.value ===
          previousSelection
      )
  ) {

    voiceSelectEl.value =
      previousSelection;

  }

}

/* =========================================================
   REF-53 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {

  const index =
    Number(
      voiceSelectEl.value
    );


  if (
    Number.isNaN(index) ||
    !availableVoices[index]
  ) {

    return null;

  }


  return availableVoices[index];

}

/* =========================================================
   REF-57 — READ / STOP
========================================================= */

readBtn.addEventListener(
  "click",

  function() {

    /*
      STOP
    */

    if (reading) {

      stopReading();


      statusEl.textContent =
        "DICTATION READY";


      resultEl.textContent =
        "";


      return;
    }


    if (
      listening ||
      mediaBusy
    ) {

      return;
    }


    if (
      languageEl.value === "auto"
    ) {

      resultEl.textContent =
        "Select the transcript language before using READ.";

      return;
    }


    const text =
      heardEl.value.trim();


    if (!text) {

      resultEl.textContent =
        "Nothing to read.";

      return;
    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {

      resultEl.textContent =
        "Text-to-speech is not supported.";

      return;
    }


    window.speechSynthesis.cancel();


    /*
      BUTTON CHANGES IMMEDIATELY
    */

    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    resultEl.textContent =
      "";


    setTimeout(
      function() {

        if (!reading) {

          return;
        }


        const utterance =
          new SpeechSynthesisUtterance(
            text
          );


        utterance.lang =
          languageEl.value;


        const selectedVoice =
          getSelectedVoice();


        if (selectedVoice) {

          utterance.voice =
            selectedVoice;

        }


        utterance.rate =
          0.92;


        utterance.pitch =
          1;


        utterance.volume =
          1;


        utterance.onend =
          function() {

            reading =
              false;


            updateReadButton();


            statusEl.textContent =
              "DICTATION READY";

          };


        utterance.onerror =
          function(event) {

            reading =
              false;


            updateReadButton();


            if (
              event.error === "canceled" ||
              event.error === "interrupted"
            ) {

              statusEl.textContent =
                "DICTATION READY";


              return;
            }


            statusEl.textContent =
              "READ FAILED";


            resultEl.textContent =
              "READ ERROR: " +
              event.error;

          };


        try {

          window.speechSynthesis.speak(
            utterance
          );

        }

        catch(error) {

          reading =
            false;


          updateReadButton();


          statusEl.textContent =
            "READ FAILED";


          resultEl.textContent =
            "READ ERROR: " +
            error.message;

        }

      },

      150

    );

  }
);

/* =========================================================
   REF-59 — SAVE
========================================================= */

function saveDictation() {

  if (saving) {

    return;
  }


  const text =
    heardEl.value.trim();


  if (!text) {

    resultEl.textContent =
      "Nothing to save.";

    return;
  }


  if (
    destinationEl.value === "local"
  ) {

    saveLocal(
      text
    );


    return;
  }


  saveGoogleDrive(
    text
  );

}


/* =========================================================
   REF-60 — LOCAL TXT
========================================================= */

function saveLocal(text) {

  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {

    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/* =========================================================
   REF-61 — GOOGLE DRIVE SAVE
========================================================= */

function saveGoogleDrive(text) {

  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {
      method: "POST",
      body: data
    }
  )


  .then(
    function(response) {

      return response.json();

    }
  )


  .then(
    function(data) {

      saving =
        false;


      if (
        data.success
      ) {

        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }

      else {

        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error ||
          "Unknown save error";

      }

    }
  )


  .catch(
    function(error) {

      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}
