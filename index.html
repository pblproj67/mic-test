<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>


<style>

body {

  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;

  max-width: 800px;

  margin: 20px auto;

  padding: 15px;

  text-align: center;

  background: #f5f5f5;

}


h1 {

  font-size: 32px;

}


.control {

  margin: 14px 0;

}


label {

  display: block;

  margin-bottom: 5px;

  font-size: 17px;

  font-weight: bold;

}


select,
input {

  width: 100%;

  max-width: 600px;

  padding: 12px;

  font-size: 18px;

  border:

    1px solid #aaa;

  border-radius: 8px;

  box-sizing: border-box;

}


#driveOptions {

  max-width: 650px;

  margin: auto;

  padding: 15px;

  background: white;

  border-radius: 12px;

}


#micBtn {

  display: block;

  width: 210px;

  height: 210px;

  margin: 25px auto;

  border: none;

  border-radius: 50%;

  background: #16a34a;

  color: white;

  font-size: 82px;

  cursor: pointer;

}


#micBtn.listening {

  background: #dc2626;

}


#status {

  font-size: 24px;

  font-weight: bold;

  margin: 20px;

}


#heard {

  min-height: 220px;

  padding: 20px;

  background: white;

  border:

    2px solid #ccc;

  border-radius: 12px;

  font-size: 24px;

  line-height: 1.5;

  text-align: left;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

}


#result {

  margin-top: 20px;

  font-size: 21px;

  font-weight: bold;

}


.small {

  font-size: 14px;

  color: #666;

}

</style>

</head>


<body>


<h1>Voice Dictation</h1>



<!-- LANGUAGE -->

<div class="control">

<label>
Language
</label>


<select id="language">

  <option value="hi-IN">
    🇮🇳 Hindi / Hinglish
  </option>

  <option value="gu-IN" selected>
    🇮🇳 ગુજરાતી / Gujarati
  </option>

  <option value="en-IN">
    🇮🇳 English (India)
  </option>

  <option value="en-US">
    🇺🇸 English (US)
  </option>

</select>

</div>



<!-- SAVE DESTINATION -->

<div class="control">

<label>
Save Destination
</label>


<select id="destination">

<option value="drive">
Google Drive
</option>

<option value="local">
Local Device
</option>

</select>

</div>



<!-- FILE NAME -->

<div class="control">

<label>
File Name
</label>


<input
  id="fileName"
  value="Voice Dictation Transcripts"
/>

</div>



<!-- GOOGLE DRIVE OPTIONS -->

<div
  id="driveOptions"
  class="control"
>


<label>
Google Drive Format
</label>


<select id="driveFormat">

<option value="gdoc">
Google Doc
</option>

<option value="txt">
TXT File
</option>

</select>



<br><br>


<label>
Google Drive Folder URL
</label>


<input
  id="folder"
  placeholder="Leave blank for My Drive"
/>


<div class="small">

Paste a Google Drive folder URL or folder ID.

</div>

</div>



<!-- MIC -->

<button
  id="micBtn"
  type="button"
>

🎤

</button>



<div id="status">

PRESS GREEN TO START

</div>



<div id="heard">

—

</div>



<div id="result">

—

</div>



<script>

/***********************************************
 BACKEND
***********************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";

/***********************************************
 ELEMENTS
***********************************************/

const micBtn =
  document.getElementById("micBtn");

const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");

const languageEl =
  document.getElementById("language");

const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


/***********************************************
 STATE
***********************************************/

let recognition = null;

let listening = false;

let stopping = false;

let saving = false;

let finalText = "";

let interimText = "";


/***********************************************
 DESTINATION UI
***********************************************/

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  if (
    destinationEl.value ===
    "drive"
  ) {

    driveOptionsEl.style.display =
      "block";

  }

  else {

    driveOptionsEl.style.display =
      "none";

  }

}


updateDestination();


/***********************************************
 DISPLAY TRANSCRIPT
***********************************************/

function showTranscript() {

  let display =
    finalText.trim();


  if (
    interimText.trim()
  ) {

    if (display) {

      display += " ";

    }


    display +=
      interimText.trim();

  }


  heardEl.textContent =
    display ||
    "Listening...";

}


/***********************************************
 CREATE RECOGNIZER
***********************************************/

function createRecognizer() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;



  /*********************************************
   RESULTS
  *********************************************/

  recognition.onresult =
    function(event) {


      let currentInterim =
        "";


      for (

        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++

      ) {


        const result =
          event.results[i];


        const transcript =
          result[0]
            .transcript
            .trim();


        if (!transcript) {

          continue;

        }


        /***************************************
         FINAL
        ***************************************/

        if (
          result.isFinal
        ) {


          if (finalText) {

            finalText += " ";

          }


          finalText +=
            transcript;

        }


        /***************************************
         INTERIM
        ***************************************/

        else {


          if (
            currentInterim
          ) {

            currentInterim +=
              " ";

          }


          currentInterim +=
            transcript;

        }

      }


      /*
        Replace temporary result.
        Never append it permanently.
      */

      interimText =
        currentInterim;


      showTranscript();

    };



  /*********************************************
   ERROR
  *********************************************/

  recognition.onerror =
    function(event) {


      if (
        event.error ===
          "aborted" &&
        stopping
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;

    };



  /*********************************************
   ENDED
  *********************************************/

  recognition.onend =
    function() {


      interimText =
        "";


      /***************************************
       USER STOP
      ***************************************/

      if (stopping) {


        stopping =
          false;


        listening =
          false;


        updateButton();


        showTranscript();


        saveDictation();


        return;

      }


      /***************************************
       CHROME AUTO STOP
      ***************************************/

      if (listening) {


        setTimeout(

          function() {


            if (!listening) {

              return;

            }


            try {


              createRecognizer();


              recognition.start();


            }

            catch(e) {

              console.log(e);

            }

          },

          300

        );

      }

    };


  return true;

}


/***********************************************
 BUTTON UI
***********************************************/

function updateButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    statusEl.textContent =
      "LISTENING — PRESS RED TO STOP";


    languageEl.disabled =
      true;


    destinationEl.disabled =
      true;


    driveFormatEl.disabled =
      true;

  }


  else {


    micBtn.classList.remove(
      "listening"
    );


    statusEl.textContent =
      "PRESS GREEN TO START";


    languageEl.disabled =
      false;


    destinationEl.disabled =
      false;


    driveFormatEl.disabled =
      false;

  }

}


/***********************************************
 MIC BUTTON
***********************************************/

micBtn.addEventListener(

  "click",

  function() {


    /*******************************************
     GREEN → START
    *******************************************/

    if (!listening) {


      finalText =
        "";


      interimText =
        "";


      stopping =
        false;


      heardEl.textContent =
        "Listening...";


      resultEl.textContent =
        "";


      if (
        !createRecognizer()
      ) {

        return;

      }


      try {


        recognition.start();


        listening =
          true;


        updateButton();

      }


      catch(error) {


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }



    /*******************************************
     RED → STOP
    *******************************************/

    stopping =
      true;


    statusEl.textContent =
      "FINISHING...";


    try {


      recognition.stop();


    }


    catch(e) {


      stopping =
        false;


      listening =
        false;


      updateButton();


      saveDictation();

    }

  }

);


/***********************************************
 SAVE
***********************************************/

function saveDictation() {


  if (saving) {

    return;

  }


  /*
    IMPORTANT:
    SAVE FINAL RESULTS ONLY.
  */

  const text =
    finalText.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing heard";


    return;

  }


  heardEl.textContent =
    text;



  /*********************************************
   LOCAL DEVICE
  *********************************************/

  if (
    destinationEl.value ===
    "local"
  ) {


    saveLocal(text);


    return;

  }



  /*********************************************
   GOOGLE DRIVE
  *********************************************/

  saveGoogleDrive(text);

}


/***********************************************
 LOCAL TXT
***********************************************/

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {

    name += ".txt";

  }


  const now =
    new Date();


  const timestamp =
    now.toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },

    1000
  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/***********************************************
 GOOGLE DRIVE
***********************************************/

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {

      method:
        "POST",

      body:
        data

    }
  )


  .then(
    response =>
      response.json()
  )


  .then(
    data => {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }


      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error;

      }

    }
  )


  .catch(
    error => {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}

</script>

</body>

</html>
