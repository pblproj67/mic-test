<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>

<style>

body {

  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;

  max-width: 800px;

  margin: 20px auto;

  padding: 15px;

  text-align: center;

  background: #f5f5f5;

}


h1 {

  font-size: 32px;

}


#language {

  font-size: 20px;

  padding: 10px;

  margin: 10px;

  border-radius: 8px;

}


#micBtn {

  display: block;

  width: 220px;

  height: 220px;

  margin: 25px auto;

  border: none;

  border-radius: 50%;

  background: #16a34a;

  color: white;

  font-size: 85px;

  cursor: pointer;

}


#micBtn.listening {

  background: #dc2626;

}


#status {

  font-size: 25px;

  font-weight: bold;

  margin: 20px;

}


#heard {

  min-height: 250px;

  padding: 20px;

  background: white;

  border: 2px solid #ccc;

  border-radius: 12px;

  font-size: 25px;

  line-height: 1.5;

  text-align: left;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

}


#result {

  margin-top: 20px;

  font-size: 22px;

  font-weight: bold;

}

</style>

</head>


<body>


<h1>Voice Dictation</h1>


<select id="language">

  <option value="hi-IN" selected>
    🇮🇳 Hindi / Hinglish
  </option>

  <option value="en-IN">
    🇮🇳 English (India)
  </option>

  <option value="en-US">
    🇺🇸 English (US)
  </option>

</select>


<button
  id="micBtn"
  type="button"
>
🎤
</button>


<div id="status">
PRESS GREEN TO START
</div>


<div id="heard">
—
</div>


<div id="result">
—
</div>



<script>

/************************************************
 APPS SCRIPT BACKEND
************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/************************************************
 ELEMENTS
************************************************/

const micBtn =
  document.getElementById("micBtn");

const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");

const languageEl =
  document.getElementById("language");


/************************************************
 STATE
************************************************/

let recognition = null;

let listening = false;

let finalText = "";

let interimText = "";

let saving = false;


/************************************************
 CREATE SPEECH RECOGNITION
************************************************/

function initSpeech() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  /*
   Longer dictation
  */

  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event) {


      interimText = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const text =
          event.results[i][0]
            .transcript
            .trim();


        if (!text)
          continue;


        if (event.results[i].isFinal) {


          finalText +=
            (finalText ? " " : "") +
            text;


        }

        else {


          interimText +=
            (interimText ? " " : "") +
            text;

        }

      }


      showTranscript();

    };


  recognition.onerror =
    function(event) {


      if (event.error === "aborted")
        return;


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;

    };


  recognition.onend =
    function() {


      /*
       Chrome sometimes ends recognition.

       If RED button is still active,
       restart it automatically.
      */

      if (listening) {


        setTimeout(
          function() {


            if (listening) {


              try {

                recognition.start();

              }

              catch(e) {}

            }

          },

          300
        );

      }

  };


  return true;

}


/************************************************
 SHOW TRANSCRIPT
************************************************/

function showTranscript() {


  let display =
    finalText;


  if (interimText) {


    display +=
      (display ? " " : "") +
      interimText;

  }


  heardEl.textContent =
    display || "Listening...";

}


/************************************************
 BUTTON DISPLAY
************************************************/

function updateButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    statusEl.textContent =
      "LISTENING — PRESS RED TO STOP";


    languageEl.disabled =
      true;

  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    statusEl.textContent =
      "PRESS GREEN TO START";


    languageEl.disabled =
      false;

  }

}


/************************************************
 MIC BUTTON
************************************************/

micBtn.addEventListener(
  "click",
  function() {


    /********************************************
     START
    ********************************************/

    if (!listening) {


      finalText = "";

      interimText = "";


      heardEl.textContent =
        "Listening...";


      resultEl.textContent =
        "";


      /*
       Create a new recognizer so language
       selection is applied.
      */

      recognition = null;


      if (!initSpeech())
        return;


      try {


        recognition.start();


        listening = true;


        updateButton();


      }

      catch(error) {


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }


    /********************************************
     STOP
    ********************************************/

    listening =
      false;


    updateButton();


    try {


      recognition.stop();


    }

    catch(e) {}


    /*
      Wait briefly for final speech result
    */

    setTimeout(
      saveDictation,
      500
    );

  }
);


/************************************************
 SAVE TO GOOGLE DOC
************************************************/

function saveDictation() {


  if (saving)
    return;


  /*
    Include any last interim words.
  */

  let text =
    finalText.trim();


  const pending =
    interimText.trim();


  if (
    pending &&
    !text.endsWith(pending)
  ) {


    text +=
      (text ? " " : "") +
      pending;

  }


  text =
    text.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing heard";


    return;

  }


  heardEl.textContent =
    text;


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DOC...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  fetch(
    BACKEND_URL,
    {

      method: "POST",

      body: data

    }
  )


  .then(
    response =>
      response.json()
  )


  .then(
    data => {


      saving =
        false;


      if (data.success) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to: " +
          data.documentName;


      }

      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error;

      }

    }
  )


  .catch(
    error => {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}

</script>


</body>

</html>
