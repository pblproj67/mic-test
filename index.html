<script>

/* =========================================================
   REF-17 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-18 — ELEMENTS
========================================================= */

const micBtn =
document.getElementById("micBtn");

const micIcon =
document.getElementById("micIcon");

const micText =
document.getElementById("micText");


const readBtn =
document.getElementById("readBtn");

const readIcon =
document.getElementById("readIcon");

const readText =
document.getElementById("readText");


const heardEl =
document.getElementById("heard");

const statusEl =
document.getElementById("status");

const resultEl =
document.getElementById("result");


const languageEl =
document.getElementById("language");


const voiceSelectEl =
document.getElementById("voiceSelect");

const testVoiceBtn =
document.getElementById("testVoiceBtn");


const destinationEl =
document.getElementById("destination");

const driveOptionsEl =
document.getElementById("driveOptions");

const driveFormatEl =
document.getElementById("driveFormat");

const fileNameEl =
document.getElementById("fileName");

const folderEl =
document.getElementById("folder");


const clearBtn =
document.getElementById("clearBtn");

const saveBtn =
document.getElementById("saveBtn");


const mediaBtn =
document.getElementById("mediaBtn");

const mediaText =
document.getElementById("mediaText");

const mediaFile =
document.getElementById("mediaFile");

const mediaStatus =
document.getElementById("mediaStatus");

const mediaProgressOuter =
document.getElementById("mediaProgressOuter");

const mediaProgressInner =
document.getElementById("mediaProgressInner");


/* =========================================================
   REF-19 — STATE
========================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let manualStop = false;

let liveView = true;

let reading = false;

let saving = false;

let mediaBusy = false;


let committedText = "";

let sessionFinalText = "";

let sessionInterimText = "";


let availableVoices = [];

let displayFramePending = false;


let transformersModule = null;

let whisperPipeline = null;


/* =========================================================
   REF-20 — DESTINATION
========================================================= */

destinationEl.addEventListener(
"change",
updateDestination
);


function updateDestination() {

driveOptionsEl.style.display =
destinationEl.value === "drive"
? "block"
: "none";

}


updateDestination();


/* =========================================================
   REF-21 — NORMALIZE
========================================================= */

function normalizeText(text) {

return String(text || "")
.replace(/\s+/g, " ")
.trim();

}


/* =========================================================
   REF-22 — LIVE MIC DUPLICATION PROTECTION
========================================================= */

function collapseProgressiveParts(parts) {

const cleaned = [];


for (
let i = 0;
i < parts.length;
i++
) {

const current =
normalizeText(parts[i]);


if (!current) {
continue;
}


if (!cleaned.length) {

cleaned.push(current);

continue;

}


const index =
cleaned.length - 1;


const previous =
cleaned[index];


const a =
previous.toLowerCase();

const b =
current.toLowerCase();


if (a === b) {
continue;
}


if (b.startsWith(a)) {

cleaned[index] =
current;

continue;

}


if (a.startsWith(b)) {
continue;
}


cleaned.push(current);

}


return normalizeText(
cleaned.join(" ")
);

}


/* =========================================================
   REF-23 — REBUILD LIVE SESSION
========================================================= */

function rebuildCurrentSession(results) {

const finals = [];

const interims = [];


for (
let i = 0;
i < results.length;
i++
) {

const result =
results[i];


if (
!result ||
!result[0]
) {
continue;
}


const text =
normalizeText(
result[0].transcript
);


if (!text) {
continue;
}


if (result.isFinal) {

finals.push(text);

}

else {

interims.push(text);

}

}


sessionFinalText =
collapseProgressiveParts(
finals
);


sessionInterimText =
collapseProgressiveParts(
interims
);

}


/* =========================================================
   REF-24 — COMMIT LIVE SESSION
========================================================= */

function commitCurrentSession() {

const text =
normalizeText(
sessionFinalText
);


if (text) {

committedText +=
(committedText ? " " : "") +
text;


committedText =
normalizeText(
committedText
);

}


sessionFinalText = "";

sessionInterimText = "";

}


/* =========================================================
   REF-25 — CURRENT TRANSCRIPT
========================================================= */

function getCurrentTranscript() {

let text =
normalizeText(
committedText
);


const confirmed =
normalizeText(
sessionFinalText
);


const temporary =
normalizeText(
sessionInterimText
);


if (confirmed) {

text +=
(text ? " " : "") +
confirmed;

}


if (temporary) {

text +=
(text ? " " : "") +
temporary;

}


return normalizeText(text);

}


/* =========================================================
   REF-26 — DISPLAY
========================================================= */

function refreshTranscriptDisplay(
force = false
) {

if (
listening &&
!liveView &&
!force
) {
return;
}


if (force) {

displayFramePending = false;

heardEl.value =
getCurrentTranscript();


if (
listening &&
liveView
) {

heardEl.scrollTop =
heardEl.scrollHeight;

}

return;

}


if (displayFramePending) {
return;
}


displayFramePending = true;


requestAnimationFrame(
function() {

displayFramePending = false;


if (
listening &&
!liveView
) {
return;
}


heardEl.value =
getCurrentTranscript();


if (
listening &&
liveView
) {

heardEl.scrollTop =
heardEl.scrollHeight;

}

}
);

}


/* =========================================================
   REF-27 — TEXTBOX LOCK
========================================================= */

function updateTextboxMode() {

if (!listening) {

heardEl.readOnly = false;

heardEl.setAttribute(
"inputmode",
"text"
);

heardEl.classList.remove(
"listeningLock",
"liveView",
"frozenView"
);

return;

}


heardEl.readOnly = true;

heardEl.setAttribute(
"inputmode",
"none"
);

heardEl.blur();


heardEl.classList.add(
"listeningLock"
);


if (liveView) {

heardEl.classList.add(
"liveView"
);

heardEl.classList.remove(
"frozenView"
);

}

else {

heardEl.classList.remove(
"liveView"
);

heardEl.classList.add(
"frozenView"
);

}

}


/* =========================================================
   REF-28 — TAP TEXTBOX LIVE / FREEZE
========================================================= */

heardEl.addEventListener(
"pointerdown",
function(event) {

if (!listening) {
return;
}


event.preventDefault();

heardEl.blur();


liveView =
!liveView;


updateTextboxMode();


if (liveView) {

refreshTranscriptDisplay(true);

heardEl.scrollTop =
heardEl.scrollHeight;


statusEl.textContent =
"LISTENING — LIVE VIEW";

}

else {

statusEl.textContent =
"LISTENING — VIEW FROZEN";

}

}
);


/* =========================================================
   REF-29 — LIVE RECOGNIZER
========================================================= */

function createRecognizer() {

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SR) {

alert(
"Speech recognition requires Chrome or Edge."
);

return false;

}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select a language for live microphone recognition.";

return false;

}


recognition =
new SR();


recognition.lang =
languageEl.value;


recognition.continuous =
true;


recognition.interimResults =
true;


/*
  Keep ONE alternative.

  This is intentionally kept light.
*/

recognition.maxAlternatives =
1;


recognition.onstart =
function() {

recognitionRunning =
true;

};


recognition.onresult =
function(event) {

rebuildCurrentSession(
event.results
);

refreshTranscriptDisplay();

};


recognition.onerror =
function(event) {

if (
event.error === "aborted" &&
manualStop
) {
return;
}


if (
event.error === "no-speech"
) {
return;
}


resultEl.textContent =
"MIC ERROR: " +
event.error;

};


recognition.onend =
function() {

recognitionRunning =
false;


commitCurrentSession();


if (
manualStop ||
!listening
) {

refreshTranscriptDisplay(true);

return;

}


setTimeout(
function() {

if (
listening &&
!manualStop &&
!recognitionRunning
) {

startRecognitionSession();

}

},
50
);

};


return true;

}


/* =========================================================
   REF-30 — START LIVE SESSION
========================================================= */

function startRecognitionSession() {

if (
!listening ||
recognitionRunning
) {
return;
}


if (!createRecognizer()) {

listening = false;

updateMicButton();

updateTextboxMode();

return;

}


try {

recognition.start();

}

catch(error) {

console.log(error);

}

}


/* =========================================================
   REF-31 — MIC UI
========================================================= */

function updateMicButton() {

if (listening) {

micBtn.classList.add(
"listening"
);

micIcon.textContent =
"■";

micText.textContent =
"STOP LISTENING";

languageEl.disabled =
true;

mediaBtn.disabled =
true;


statusEl.textContent =
liveView
? "LISTENING — LIVE VIEW"
: "LISTENING — VIEW FROZEN";

}

else {

micBtn.classList.remove(
"listening"
);

micIcon.textContent =
"🎙";

micText.textContent =
"LISTEN";

languageEl.disabled =
mediaBusy;

mediaBtn.disabled =
mediaBusy;

}

}


/* =========================================================
   REF-32 — MIC START / STOP
========================================================= */

micBtn.addEventListener(
"click",
function() {

if (mediaBusy) {
return;
}


if (!listening) {

if (
languageEl.value === "auto"
) {

resultEl.textContent =
"AUTO DETECT is for media. Select a language for LISTEN.";

return;

}


stopReading();


committedText = "";

sessionFinalText = "";

sessionInterimText = "";

heardEl.value = "";


liveView = true;

manualStop = false;

listening = true;


updateMicButton();

updateTextboxMode();

startRecognitionSession();

return;

}


/*
  STOP
*/

manualStop = true;

listening = false;


updateMicButton();

updateTextboxMode();


statusEl.textContent =
"DICTATION READY";


try {

if (recognition) {
recognition.stop();
}

}

catch(error) {

commitCurrentSession();

refreshTranscriptDisplay(true);

}

}
);


/* =========================================================
   REF-33 — MANUAL EDIT
========================================================= */

heardEl.addEventListener(
"input",
function() {

if (!listening) {

committedText =
heardEl.value;

sessionFinalText = "";

sessionInterimText = "";

}

}
);


/* =========================================================
   REF-34 — MEDIA LANGUAGE
========================================================= */

function getWhisperLanguage() {

switch (
languageEl.value
) {

case "gu-IN":
return "gujarati";

case "hi-IN":
return "hindi";

case "en-IN":
case "en-US":
return "english";

default:
return null;

}

}


/* =========================================================
   REF-35 — MEDIA PROGRESS
========================================================= */

function setMediaProgress(
percent,
message
) {

const p =
Math.max(
0,
Math.min(
100,
Number(percent)
)
);


mediaProgressOuter.style.display =
"block";


mediaProgressInner.style.width =
p + "%";


if (message) {

mediaStatus.textContent =
message;

}

}


/* =========================================================
   REF-36 — LOAD TRANSFORMERS.JS
========================================================= */

async function loadTransformers() {

if (transformersModule) {
return transformersModule;
}


setMediaProgress(
2,
"Loading transcription engine..."
);


transformersModule =
await import(
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1"
);


return transformersModule;

}


/* =========================================================
   REF-37 — WHISPER BASE MULTILINGUAL
========================================================= */

async function getWhisper() {

if (whisperPipeline) {
return whisperPipeline;
}


const module =
await loadTransformers();


mediaText.textContent =
"LOADING AI MODEL...";


setMediaProgress(
4,
"Loading Whisper Base multilingual..."
);


const MODEL =
"onnx-community/whisper-base";


/*
  FIRST TRY WEBGPU
*/

try {

whisperPipeline =
await module.pipeline(
"automatic-speech-recognition",
MODEL,
{

device: "webgpu",

progress_callback:
function(info) {

if (
info &&
typeof info.progress === "number"
) {

const p =
4 +
(
Math.min(
100,
info.progress
) *
0.20
);


setMediaProgress(
p,
"Loading Whisper Base..."
);

}

}

}
);


mediaStatus.textContent =
"Whisper Base — WebGPU";


return whisperPipeline;

}

catch(error) {

console.log(
"WebGPU fallback:",
error
);

}


/*
  WASM / CPU FALLBACK
*/

setMediaProgress(
5,
"WebGPU unavailable — loading compatibility mode..."
);


whisperPipeline =
await module.pipeline(
"automatic-speech-recognition",
MODEL,
{

progress_callback:
function(info) {

if (
info &&
typeof info.progress === "number"
) {

const p =
5 +
(
Math.min(
100,
info.progress
) *
0.20
);


setMediaProgress(
p,
"Loading Whisper Base..."
);

}

}

}
);


return whisperPipeline;

}


/* =========================================================
   REF-38 — DECODE + RESAMPLE MEDIA

   Output:
   Float32Array
   Mono
   16000 Hz
========================================================= */

async function decodeMedia(file) {

setMediaProgress(
25,
"Decoding audio..."
);


const data =
await file.arrayBuffer();


const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;


if (!AudioContextClass) {

throw new Error(
"Audio decoding unavailable."
);

}


const context =
new AudioContextClass();


let decoded;


try {

decoded =
await context.decodeAudioData(
data.slice(0)
);

}

catch(error) {

await context.close();

throw new Error(
"Could not decode this media. Try MP3, M4A or WAV."
);

}


/*
  MIX CHANNELS TO MONO
*/

const mono =
new Float32Array(
decoded.length
);


for (
let channel = 0;
channel < decoded.numberOfChannels;
channel++
) {

const source =
decoded.getChannelData(
channel
);


for (
let i = 0;
i < decoded.length;
i++
) {

mono[i] +=
source[i] /
decoded.numberOfChannels;

}

}


const originalRate =
decoded.sampleRate;


await context.close();


/*
  ALREADY 16 kHz
*/

if (
originalRate === 16000
) {

return mono;

}


/*
  RESAMPLE
*/

setMediaProgress(
30,
"Converting audio to 16 kHz..."
);


const outputLength =
Math.ceil(
mono.length *
16000 /
originalRate
);


const offline =
new OfflineAudioContext(
1,
outputLength,
16000
);


const buffer =
offline.createBuffer(
1,
mono.length,
originalRate
);


buffer.copyToChannel(
mono,
0
);


const source =
offline.createBufferSource();


source.buffer =
buffer;

source.connect(
offline.destination
);

source.start();


const rendered =
await offline.startRendering();


return new Float32Array(
rendered.getChannelData(0)
);

}


/* =========================================================
   REF-39 — REPETITION / HALLUCINATION CHECK

   This DOES NOT attempt to "fix" normal speech.

   It rejects obviously pathological Whisper output such as:

   Shakti Shakti Shakti Shakti...
   पाप पाप पाप पाप...
========================================================= */

function looksHallucinated(text) {

const clean =
normalizeText(text);


if (!clean) {
return true;
}


const words =
clean.split(/\s+/);


if (
words.length < 8
) {

return false;

}


/*
  Count identical words.
*/

const counts =
new Map();


let largest =
0;


for (
const rawWord of words
) {

const word =
rawWord
.toLowerCase()
.replace(/[.,!?;:"'()[\]{}]/g, "");


if (!word) {
continue;
}


const count =
(counts.get(word) || 0) + 1;


counts.set(
word,
count
);


if (
count > largest
) {

largest =
count;

}

}


/*
  If one word represents more than
  55% of a reasonably long chunk,
  something is clearly wrong.
*/

if (
words.length >= 20 &&
largest / words.length > 0.55
) {

return true;

}


/*
  Detect long consecutive repetitions.
*/

let consecutive = 1;

let previous = "";


for (
const rawWord of words
) {

const word =
rawWord
.toLowerCase()
.replace(/[.,!?;:"'()[\]{}]/g, "");


if (
word &&
word === previous
) {

consecutive++;

if (
consecutive >= 8
) {

return true;

}

}

else {

consecutive = 1;

}


previous =
word;

}


return false;

}


/* =========================================================
   REF-40 — TRANSCRIBE ONE 30 SECOND CHUNK
========================================================= */

async function transcribeChunk(
transcriber,
audio,
language
) {

const options = {

task:
"transcribe",

return_timestamps:
false

};


/*
  AUTO DETECT:

  language is simply omitted.
*/

if (language) {

options.language =
language;

}


const result =
await transcriber(
audio,
options
);


return normalizeText(
result &&
result.text
? result.text
: ""
);

}


/* =========================================================
   REF-41 — MEDIA BUTTON
========================================================= */

mediaBtn.addEventListener(
"click",
function() {

if (
listening ||
mediaBusy
) {

return;

}


stopReading();


mediaFile.value =
"";


mediaFile.click();

}
);


/* =========================================================
   REF-42 — MEDIA FILE SELECTED

   V2 ENGINE

   30 SECOND INDEPENDENT CHUNKS
========================================================= */

mediaFile.addEventListener(
"change",
async function() {

const file =
mediaFile.files &&
mediaFile.files[0];


if (!file) {
return;
}


try {

/* -----------------------------
   LOCK UI
----------------------------- */

mediaBusy = true;


mediaBtn.classList.add(
"busy"
);


mediaBtn.disabled = true;

micBtn.disabled = true;

languageEl.disabled = true;

readBtn.disabled = true;

clearBtn.disabled = true;

saveBtn.disabled = true;


mediaText.textContent =
"PREPARING...";


resultEl.textContent = "";


statusEl.textContent =
"MEDIA TRANSCRIPTION";


setMediaProgress(
1,
file.name
);


/* -----------------------------
   LOAD WHISPER
----------------------------- */

const transcriber =
await getWhisper();


/* -----------------------------
   DECODE AUDIO
----------------------------- */

const audio =
await decodeMedia(
file
);


/* -----------------------------
   30 SECOND CHUNKS

   16,000 samples/sec × 30 sec
----------------------------- */

const SAMPLE_RATE =
16000;


const CHUNK_SECONDS =
30;


const CHUNK_SIZE =
SAMPLE_RATE *
CHUNK_SECONDS;


const totalChunks =
Math.ceil(
audio.length /
CHUNK_SIZE
);


const language =
getWhisperLanguage();


let transcriptParts = [];


/*
  Clear textbox so completed chunks
  can appear progressively.
*/

committedText = "";

sessionFinalText = "";

sessionInterimText = "";

heardEl.value = "";


/* -----------------------------
   PROCESS CHUNKS
----------------------------- */

for (
let chunkIndex = 0;
chunkIndex < totalChunks;
chunkIndex++
) {

const start =
chunkIndex *
CHUNK_SIZE;


const end =
Math.min(
start + CHUNK_SIZE,
audio.length
);


const chunk =
audio.slice(
start,
end
);


const chunkNumber =
chunkIndex + 1;


const percent =
35 +
(
chunkNumber /
totalChunks
) *
60;


mediaText.textContent =
"TRANSCRIBING " +
chunkNumber +
"/" +
totalChunks;


setMediaProgress(
percent,
"Processing part " +
chunkNumber +
" of " +
totalChunks
);


/*
  Let browser paint UI before
  heavy inference begins.
*/

await new Promise(
resolve =>
setTimeout(
resolve,
20
)
);


let chunkText =
await transcribeChunk(
transcriber,
chunk,
language
);


/* -----------------------------
   HALLUCINATION GUARD
----------------------------- */

if (
looksHallucinated(
chunkText
)
) {

console.warn(
"Rejected suspicious chunk:",
chunkNumber,
chunkText
);


mediaStatus.textContent =
"Retrying part " +
chunkNumber +
"..." ;


await new Promise(
resolve =>
setTimeout(
resolve,
20
)
);


/*
  Retry once.

  Same original clean audio chunk.
*/

chunkText =
await transcribeChunk(
transcriber,
chunk,
language
);


/*
  If still pathological,
  don't dump garbage into transcript.
*/

if (
looksHallucinated(
chunkText
)
) {

console.warn(
"Skipped hallucinated chunk:",
chunkNumber
);


chunkText = "";

}

}


/* -----------------------------
   ACCEPT CHUNK
----------------------------- */

if (chunkText) {

transcriptParts.push(
chunkText
);


committedText =
normalizeText(
transcriptParts.join(" ")
);


heardEl.value =
committedText;


/*
  Automatically show latest
  completed chunk.
*/

heardEl.scrollTop =
heardEl.scrollHeight;

}

}


/* -----------------------------
   COMPLETE
----------------------------- */

committedText =
normalizeText(
transcriptParts.join(" ")
);


heardEl.value =
committedText;


if (!committedText) {

throw new Error(
"No reliable speech could be transcribed."
);

}


setMediaProgress(
100,
"TRANSCRIPTION COMPLETE"
);


mediaText.textContent =
"IMPORT MEDIA";


statusEl.textContent =
"MEDIA TRANSCRIPT READY";


resultEl.textContent =
totalChunks +
" audio part" +
(totalChunks === 1 ? "" : "s") +
" processed. Edit, READ or SAVE.";

}


/* =========================================================
   REF-43 — MEDIA ERROR
========================================================= */

catch(error) {

console.error(error);


mediaText.textContent =
"IMPORT MEDIA";


mediaStatus.textContent =
"TRANSCRIPTION FAILED";


resultEl.textContent =
error &&
error.message
? error.message
: "Media transcription failed.";


mediaProgressInner.style.width =
"0%";

}


/* =========================================================
   REF-44 — UNLOCK UI
========================================================= */

finally {

mediaBusy = false;


mediaBtn.classList.remove(
"busy"
);


mediaBtn.disabled = false;

micBtn.disabled = false;

languageEl.disabled = false;

readBtn.disabled = false;

clearBtn.disabled = false;

saveBtn.disabled = false;

}

}
);


/* =========================================================
   REF-45 — VOICES
========================================================= */

function loadVoices() {

if (
!("speechSynthesis" in window)
) {
return;
}


availableVoices =
window.speechSynthesis
.getVoices();


voiceSelectEl.innerHTML =
"";


if (
languageEl.value === "auto"
) {

const option =
document.createElement(
"option"
);


option.value = "";

option.textContent =
"Select transcript language";


voiceSelectEl.appendChild(
option
);


return;

}


const selected =
languageEl.value
.toLowerCase();


const base =
selected.split("-")[0];


let matches =
availableVoices.filter(
voice => {

const lang =
String(
voice.lang || ""
)
.toLowerCase();


return (
lang === selected ||
lang.startsWith(
base + "-"
)
);

}
);


if (!matches.length) {

matches =
availableVoices;

}


matches.forEach(
voice => {

const option =
document.createElement(
"option"
);


option.value =
availableVoices.indexOf(
voice
);


option.textContent =
voice.name +
" — " +
voice.lang;


voiceSelectEl.appendChild(
option
);

}
);

}


loadVoices();


if (
"speechSynthesis" in window
) {

window.speechSynthesis.onvoiceschanged =
loadVoices;

}


languageEl.addEventListener(
"change",
loadVoices
);


/* =========================================================
   REF-46 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {

const index =
Number(
voiceSelectEl.value
);


if (
Number.isNaN(index) ||
!availableVoices[index]
) {

return null;

}


return availableVoices[index];

}


/* =========================================================
   REF-47 — TEST VOICE
========================================================= */

testVoiceBtn.addEventListener(
"click",
function() {

if (
listening ||
mediaBusy
) {
return;
}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select a language first.";

return;

}


window.speechSynthesis.cancel();


let sample =
"Hello. This is a sample of this voice.";


if (
languageEl.value === "hi-IN"
) {

sample =
"नमस्ते। यह आवाज़ का एक नमूना है।";

}


if (
languageEl.value === "gu-IN"
) {

sample =
"નમસ્તે. આ અવાજનો નમૂનો છે.";

}


const speech =
new SpeechSynthesisUtterance(
sample
);


speech.lang =
languageEl.value;


const voice =
getSelectedVoice();


if (voice) {

speech.voice =
voice;

}


speech.rate =
0.95;


window.speechSynthesis.speak(
speech
);

}
);


/* =========================================================
   REF-48 — READ UI
========================================================= */

function updateReadButton() {

if (reading) {

readBtn.classList.add(
"reading"
);

readIcon.textContent =
"■";

readText.textContent =
"STOP READING";

}

else {

readBtn.classList.remove(
"reading"
);

readIcon.textContent =
"▶";

readText.textContent =
"READ";

}

}


/* =========================================================
   REF-49 — STOP READ
========================================================= */

function stopReading() {

if (
"speechSynthesis" in window
) {

window.speechSynthesis.cancel();

}


reading = false;

updateReadButton();

}


/* =========================================================
   REF-50 — READ
========================================================= */

readBtn.addEventListener(
"click",
function() {

if (reading) {

stopReading();

statusEl.textContent =
"DICTATION READY";

return;

}


if (
listening ||
mediaBusy
) {
return;
}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select the transcript language before READ.";

return;

}


const text =
heardEl.value.trim();


if (!text) {

resultEl.textContent =
"Nothing to read.";

return;

}


window.speechSynthesis.cancel();


reading = true;

updateReadButton();


statusEl.textContent =
"READING...";


setTimeout(
function() {

if (!reading) {
return;
}


const speech =
new SpeechSynthesisUtterance(
text
);


speech.lang =
languageEl.value;


const voice =
getSelectedVoice();


if (voice) {

speech.voice =
voice;

}


speech.rate =
0.92;


speech.onend =
function() {

reading = false;

updateReadButton();

statusEl.textContent =
"DICTATION READY";

};


speech.onerror =
function(event) {

reading = false;

updateReadButton();


if (
event.error === "canceled" ||
event.error === "interrupted"
) {

statusEl.textContent =
"DICTATION READY";

return;

}


statusEl.textContent =
"READ FAILED";


resultEl.textContent =
"READ ERROR: " +
event.error;

};


window.speechSynthesis.speak(
speech
);

},
150
);

}
);


/* =========================================================
   REF-51 — CLEAR
========================================================= */

clearBtn.addEventListener(
"click",
function() {

if (
listening ||
mediaBusy
) {
return;
}


stopReading();


committedText = "";

sessionFinalText = "";

sessionInterimText = "";

heardEl.value = "";


statusEl.textContent =
"PRESS BLUE TO LISTEN";


resultEl.textContent =
"Text cleared";

}
);


/* =========================================================
   REF-52 — SAVE
========================================================= */

saveBtn.addEventListener(
"click",
function() {

if (
listening ||
mediaBusy
) {
return;
}


stopReading();


const text =
heardEl.value.trim();


if (!text) {

resultEl.textContent =
"Nothing to save.";

return;

}


if (
destinationEl.value === "local"
) {

saveLocal(text);

}

else {

saveGoogleDrive(text);

}

}
);


/* =========================================================
   REF-53 — LOCAL SAVE
========================================================= */

function saveLocal(text) {

let name =
fileNameEl.value.trim() ||
"Voice Dictation";


if (
!name.toLowerCase()
.endsWith(".txt")
) {

name += ".txt";

}


const contents =
new Date().toLocaleString() +
"\n\n" +
text +
"\n";


const blob =
new Blob(
[contents],
{
type:
"text/plain;charset=utf-8"
}
);


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
"a"
);


a.href =
url;

a.download =
name;


document.body.appendChild(
a
);


a.click();

a.remove();


setTimeout(
() =>
URL.revokeObjectURL(url),
1000
);


statusEl.textContent =
"SAVED LOCALLY";


resultEl.textContent =
"Downloaded: " +
name;

}


/* =========================================================
   REF-54 — GOOGLE DRIVE SAVE
========================================================= */

function saveGoogleDrive(text) {

if (saving) {
return;
}


saving = true;


statusEl.textContent =
"SAVING TO GOOGLE DRIVE...";


const data =
new URLSearchParams();


data.append(
"text",
text
);


data.append(
"format",
driveFormatEl.value
);


data.append(
"fileName",
fileNameEl.value.trim()
);


data.append(
"folder",
folderEl.value.trim()
);


fetch(
BACKEND_URL,
{
method: "POST",
body: data
}
)

.then(
response =>
response.json()
)

.then(
data => {

saving = false;


if (data.success) {

statusEl.textContent =
"SAVED";


resultEl.textContent =
"Saved to Google Drive: " +
data.fileName;

}

else {

statusEl.textContent =
"SAVE ERROR";


resultEl.textContent =
data.error ||
"Unknown save error";

}

}
)

.catch(
error => {

saving = false;


statusEl.textContent =
"CONNECTION ERROR";


resultEl.textContent =
error.message;

}
);

}


/* =========================================================
   REF-55 — INITIALIZE
========================================================= */

updateMicButton();

updateReadButton();

updateTextboxMode();

</script>
