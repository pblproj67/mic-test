<script type="module">

/* =========================================================
   REF-M02 — LOCAL WHISPER MODULE
========================================================= */

import {
  pipeline,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";


/* =========================================================
   REF-M03 — SETTINGS
========================================================= */

env.allowLocalModels = false;

const MODEL =
  "Xenova/whisper-tiny";

let whisper = null;

let whisperLoading = false;


/* =========================================================
   REF-M04 — ELEMENTS
========================================================= */

const mediaBtn =
  document.getElementById("mediaBtn");

const mediaFile =
  document.getElementById("mediaFile");

const mediaText =
  document.getElementById("mediaText");

const mediaStatus =
  document.getElementById("mediaStatus");


/* =========================================================
   REF-M05 — SELECT FILE
========================================================= */

mediaBtn.addEventListener(
  "click",
  function() {

    if (whisperLoading) {
      return;
    }

    mediaFile.value = "";

    mediaFile.click();
  }
);


/* =========================================================
   REF-M06 — FILE SELECTED
========================================================= */

mediaFile.addEventListener(
  "change",
  async function() {

    const file =
      mediaFile.files[0];

    if (!file) {
      return;
    }


    /*
      Do not interfere with live microphone.
    */

    if (
      typeof listening !== "undefined" &&
      listening
    ) {

      mediaStatus.textContent =
        "Stop LISTEN before importing media.";

      return;
    }


    try {

      mediaBtn.disabled =
        true;

      mediaText.textContent =
        "PREPARING...";

      mediaStatus.textContent =
        file.name;


      /* ===================================================
         REF-M07 — LOAD WHISPER
      =================================================== */

      if (!whisper) {

        whisperLoading =
          true;

        mediaText.textContent =
          "LOADING AI...";

        mediaStatus.textContent =
          "First use downloads the Whisper model.";


        /*
          First try WebGPU.
        */

        try {

          whisper =
            await pipeline(
              "automatic-speech-recognition",
              MODEL,
              {
                device: "webgpu",
                dtype: "q4"
              }
            );

        }

        catch (gpuError) {

          console.log(
            "WebGPU unavailable; using CPU/WASM.",
            gpuError
          );


          mediaStatus.textContent =
            "Using CPU mode...";


          whisper =
            await pipeline(
              "automatic-speech-recognition",
              MODEL,
              {
                dtype: "q8"
              }
            );
        }


        whisperLoading =
          false;
      }


      /* ===================================================
         REF-M08 — DECODE MEDIA
      =================================================== */

      mediaText.textContent =
        "DECODING...";

      mediaStatus.textContent =
        "Preparing audio...";


      const arrayBuffer =
        await file.arrayBuffer();


      const audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      const decoded =
        await audioContext.decodeAudioData(
          arrayBuffer
        );


      /* ===================================================
         REF-M09 — CONVERT TO MONO
      =================================================== */

      let mono;


      if (
        decoded.numberOfChannels === 1
      ) {

        mono =
          decoded.getChannelData(0);

      }

      else {

        mono =
          new Float32Array(
            decoded.length
          );


        for (
          let channel = 0;
          channel < decoded.numberOfChannels;
          channel++
        ) {

          const data =
            decoded.getChannelData(
              channel
            );


          for (
            let i = 0;
            i < decoded.length;
            i++
          ) {

            mono[i] +=
              data[i] /
              decoded.numberOfChannels;
          }
        }
      }


      /* ===================================================
         REF-M10 — RESAMPLE TO 16 kHz
      =================================================== */

      let audio16k;


      if (
        decoded.sampleRate === 16000
      ) {

        audio16k =
          mono;

      }

      else {

        const targetLength =
          Math.ceil(
            mono.length *
            16000 /
            decoded.sampleRate
          );


        const offline =
          new OfflineAudioContext(
            1,
            targetLength,
            16000
          );


        const buffer =
          offline.createBuffer(
            1,
            mono.length,
            decoded.sampleRate
          );


        buffer.copyToChannel(
          mono,
          0
        );


        const source =
          offline.createBufferSource();


        source.buffer =
          buffer;


        source.connect(
          offline.destination
        );


        source.start();


        const rendered =
          await offline.startRendering();


        audio16k =
          rendered.getChannelData(0);
      }


      await audioContext.close();


      /* ===================================================
         REF-M11 — TRANSCRIBE
      =================================================== */

      mediaText.textContent =
        "TRANSCRIBING...";

      mediaStatus.textContent =
        "Whisper is processing locally...";


      const selectedLanguage =
        document.getElementById(
          "language"
        ).value;


      let whisperLanguage =
        null;


      if (
        selectedLanguage === "en-IN" ||
        selectedLanguage === "en-US"
      ) {

        whisperLanguage =
          "english";

      }

      else if (
        selectedLanguage === "hi-IN"
      ) {

        whisperLanguage =
          "hindi";

      }

      else if (
        selectedLanguage === "gu-IN"
      ) {

        whisperLanguage =
          "gujarati";

      }


      const options = {

        task:
          "transcribe",

        chunk_length_s:
          30,

        stride_length_s:
          5
      };


      if (whisperLanguage) {

        options.language =
          whisperLanguage;
      }


      const output =
        await whisper(
          audio16k,
          options
        );


      /* ===================================================
         REF-M12 — PUT RESULT INTO OUR TEXTBOX
      =================================================== */

      const transcript =
        String(
          output.text || ""
        ).trim();


      if (!transcript) {

        throw new Error(
          "Whisper returned no transcription."
        );
      }


      /*
        Use existing application state.
      */

      committedText =
        transcript;

      sessionFinalText =
        "";

      sessionInterimText =
        "";


      heardEl.value =
        transcript;


      heardEl.scrollTop =
        0;


      mediaText.textContent =
        "IMPORT MEDIA";


      mediaStatus.textContent =
        "TRANSCRIPTION COMPLETE";


      statusEl.textContent =
        "MEDIA TRANSCRIPT READY";


      resultEl.textContent =
        "You can edit, READ or SAVE the transcript.";


    }

    catch (error) {

      console.error(error);


      whisperLoading =
        false;


      mediaText.textContent =
        "IMPORT MEDIA";


      mediaStatus.textContent =
        "TRANSCRIPTION FAILED";


      resultEl.textContent =
        error.message ||
        "Unable to transcribe this media file.";

    }

    finally {

      mediaBtn.disabled =
        false;
    }

  }
);

</script>
