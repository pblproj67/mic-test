<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 14px;
  background: #000;
  color: #fff;
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 10px 0 18px;
}

.control {
  margin: 12px 0;
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 16px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  color: #fff;
  background: #181818;
  border: 1px solid #444;
  border-radius: 12px;
}

#driveOptions {
  padding: 14px;
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
}


/* ================================
   LARGE MAIN BUTTONS
================================ */

.mainButton {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;

  width: 100%;
  height: 68px;

  margin: 15px 0;

  border: none;
  border-radius: 16px;

  color: #fff;

  font-size: 23px;
  font-weight: 700;

  cursor: pointer;

  touch-action: manipulation;
}


/* BLUE READY STATE */

#micBtn,
#readBtn {
  background: #0866ff;
}


/* RED ACTIVE STATE */

#micBtn.listening,
#readBtn.reading {
  background: #d71920;
}


/* ICON */

.buttonIcon {
  font-size: 28px;
}


/* STATUS */

#status {
  margin: 12px 0;
  font-size: 19px;
  font-weight: bold;
}


/* TRANSCRIPT */

#heard {
  width: 100%;
  min-height: 260px;

  padding: 16px;

  color: #fff;
  background: #101010;

  border: 2px solid #333;
  border-radius: 14px;

  font-size: 22px;
  line-height: 1.5;

  resize: vertical;
}


/* CLEAR + SAVE */

.smallButtons {
  display: flex;
  gap: 10px;
  margin: 14px 0;
}

.smallButton {
  flex: 1;

  min-height: 52px;

  border: 1px solid #444;
  border-radius: 13px;

  background: #222;
  color: #fff;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#saveBtn {
  background: #16803a;
  border-color: #16803a;
}

#clearBtn {
  background: #333;
}


/* RESULT */

#result {
  margin: 15px 0 30px;
  font-size: 17px;
  font-weight: bold;
}

.small {
  margin-top: 6px;
  font-size: 13px;
  color: #aaa;
}

</style>

</head>


<body>


<h1>Voice Dictation</h1>


<!-- LANGUAGE -->

<div class="control">

<label>Language</label>

<select id="language">

  <option value="gu-IN" selected>
    🇮🇳 ગુજરાતી / Gujarati
  </option>

  <option value="hi-IN">
    🇮🇳 Hindi / Hinglish
  </option>

  <option value="en-IN">
    🇮🇳 English (India)
  </option>

  <option value="en-US">
    🇺🇸 English (US)
  </option>

</select>

</div>


<!-- READ VOICE -->

<div class="control">

<label>Read Voice</label>

<select id="voiceGender">

  <option value="female">
    👩 Female
  </option>

  <option value="male">
    👨 Male
  </option>

</select>

</div>


<!-- SAVE DESTINATION -->

<div class="control">

<label>Save Destination</label>

<select id="destination">

  <option value="drive">
    Google Drive
  </option>

  <option value="local">
    Local Device
  </option>

</select>

</div>


<!-- FILE NAME -->

<div class="control">

<label>File Name</label>

<input
  id="fileName"
  value="Voice Dictation Transcripts"
>

</div>


<!-- GOOGLE DRIVE -->

<div id="driveOptions">

<label>Google Drive Format</label>

<select id="driveFormat">

  <option value="gdoc">
    Google Doc
  </option>

  <option value="txt">
    TXT File
  </option>

</select>


<br><br>


<label>Google Drive Folder URL</label>

<input
  id="folder"
  placeholder="Leave blank for My Drive"
>

<div class="small">
Paste Google Drive folder URL or folder ID.
</div>

</div>


<!-- LISTEN BUTTON -->

<button
  id="micBtn"
  class="mainButton"
  type="button"
>

<span
  id="micIcon"
  class="buttonIcon"
>
🎙
</span>

<span id="micText">
LISTEN
</span>

</button>


<div id="status">
PRESS BLUE TO LISTEN
</div>


<!-- TRANSCRIPT -->

<textarea
  id="heard"
  placeholder="Your transcription will appear here..."
></textarea>


<!-- READ BUTTON -->

<button
  id="readBtn"
  class="mainButton"
  type="button"
>

<span
  id="readIcon"
  class="buttonIcon"
>
▶
</span>

<span id="readText">
READ
</span>

</button>


<!-- CLEAR + SAVE -->

<div class="smallButtons">

<button
  id="clearBtn"
  class="smallButton"
  type="button"
>
CLEAR
</button>


<button
  id="saveBtn"
  class="smallButton"
  type="button"
>
💾 SAVE
</button>

</div>


<div id="result">
—
</div>



<script>

/*************************************************
 BACKEND
*************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/*************************************************
 ELEMENTS
*************************************************/

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");

const voiceGenderEl =
  document.getElementById("voiceGender");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/*************************************************
 STATE
*************************************************/

let recognition = null;

let listening = false;

let stopping = false;

let saving = false;

let reading = false;


let finalText = "";

let interimText = "";

let lastFinalRaw = "";

let availableVoices = [];


/*************************************************
 DESTINATION
*************************************************/

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/*************************************************
 NORMALIZE TEXT
*************************************************/

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/*************************************************
 DUPLICATE PROTECTION
*************************************************/

function commitFinalTranscript(newText) {

  newText =
    normalizeText(newText);


  if (!newText) {
    return;
  }


  /*
    Exact duplicate
  */

  if (
    newText === lastFinalRaw
  ) {

    return;

  }


  /*
    Chrome expanded the previous phrase.

    Example:

    તો પછી

    becomes:

    તો પછી એન્જોય કરો

    Add ONLY:
    એન્જોય કરો
  */

  if (
    lastFinalRaw &&
    newText.startsWith(lastFinalRaw)
  ) {


    const extra =
      normalizeText(
        newText.slice(
          lastFinalRaw.length
        )
      );


    if (extra) {

      finalText +=
        (finalText ? " " : "") +
        extra;

    }


    lastFinalRaw =
      newText;


    return;

  }


  /*
    Ignore shorter duplicate version.
  */

  if (
    lastFinalRaw &&
    lastFinalRaw.startsWith(newText)
  ) {

    return;

  }


  /*
    New phrase.
  */

  finalText +=
    (finalText ? " " : "") +
    newText;


  lastFinalRaw =
    newText;

}


/*************************************************
 SHOW TRANSCRIPT
*************************************************/

function showTranscript() {

  let display =
    normalizeText(finalText);


  const temp =
    normalizeText(interimText);


  if (temp) {

    display +=
      (display ? " " : "") +
      temp;

  }


  heardEl.value =
    display;

}


/*************************************************
 CREATE SPEECH RECOGNITION
*************************************************/

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/*************************************************
 SPEECH RESULT
*************************************************/

  recognition.onresult =
    function(event) {


      let currentInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const result =
          event.results[i];


        if (
          !result ||
          !result[0]
        ) {

          continue;

        }


        const transcript =
          normalizeText(
            result[0].transcript
          );


        if (!transcript) {

          continue;

        }


        if (
          result.isFinal
        ) {


          commitFinalTranscript(
            transcript
          );

        }


        else {


          if (
            currentInterim
          ) {

            currentInterim +=
              " ";

          }


          currentInterim +=
            transcript;

        }

      }


      interimText =
        currentInterim;


      showTranscript();

    };


/*************************************************
 SPEECH ERROR
*************************************************/

  recognition.onerror =
    function(event) {


      if (
        event.error === "aborted" &&
        stopping
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;

    };


/*************************************************
 RECOGNITION ENDED
*************************************************/

  recognition.onend =
    function() {


      interimText =
        "";


      /*
        User pressed STOP
      */

      if (
        stopping
      ) {


        stopping =
          false;


        listening =
          false;


        updateMicButton();


        showTranscript();


        statusEl.textContent =
          "DICTATION READY";


        return;

      }


      /*
        Chrome automatically stopped.

        Restart automatically.
      */

      if (
        listening
      ) {


        setTimeout(

          function() {


            if (!listening) {
              return;
            }


            try {


              lastFinalRaw =
                "";


              createRecognizer();


              recognition.start();

            }


            catch(error) {

              console.log(
                "Restart error:",
                error
              );

            }

          },

          300

        );

      }

  };


  return true;

}


/*************************************************
 MIC BUTTON APPEARANCE
*************************************************/

function updateMicButton() {


  if (
    listening
  ) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    statusEl.textContent =
      "LISTENING...";


    languageEl.disabled =
      true;

  }


  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;

  }

}


/*************************************************
 MIC BUTTON
*************************************************/

micBtn.addEventListener(
  "click",
  function() {


    /*********************************************
     START LISTENING
    *********************************************/

    if (
      !listening
    ) {


      /*
        Stop reading first.
      */

      stopReading();


      finalText =
        "";


      interimText =
        "";


      lastFinalRaw =
        "";


      stopping =
        false;


      heardEl.value =
        "";


      resultEl.textContent =
        "";


      if (
        !createRecognizer()
      ) {

        return;

      }


      try {


        recognition.start();


        listening =
          true;


        updateMicButton();

      }


      catch(error) {


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }


    /*********************************************
     STOP LISTENING
    *********************************************/

    stopping =
      true;


    statusEl.textContent =
      "FINISHING...";


    try {


      recognition.stop();

    }


    catch(error) {


      stopping =
        false;


      listening =
        false;


      updateMicButton();


      statusEl.textContent =
        "DICTATION READY";

    }

  }
);


/*************************************************
 MANUAL TEXT EDIT
*************************************************/

heardEl.addEventListener(
  "input",
  function() {


    if (
      !listening
    ) {


      finalText =
        heardEl.value;


      lastFinalRaw =
        "";

    }

  }
);


/*************************************************
 CLEAR
*************************************************/

clearBtn.addEventListener(
  "click",
  function() {


    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before clearing.";


      return;

    }


    stopReading();


    finalText =
      "";


    interimText =
      "";


    lastFinalRaw =
      "";


    heardEl.value =
      "";


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/*************************************************
 LOAD READ-BACK VOICES
*************************************************/

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();

}


loadVoices();


if (
  "speechSynthesis"
  in window
) {


  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/*************************************************
 FIND VOICE
*************************************************/

function findVoice(
  language,
  gender
) {


  const lang =
    language.toLowerCase();


  const baseLang =
    lang.split("-")[0];


  let matches =
    availableVoices.filter(
      function(voice) {


        const vLang =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          vLang === lang ||
          vLang.startsWith(
            baseLang + "-"
          )
        );

      }
    );


  if (
    matches.length === 0
  ) {

    return null;

  }


  /*
    Browsers do not provide an official
    male/female property.

    We try common voice names.
  */

  const femaleHints = [

    "female",
    "woman",
    "zira",
    "heera",
    "kalpana",
    "swara"

  ];


  const maleHints = [

    "male",
    "man",
    "david",
    "ravi",
    "hemant"

  ];


  const hints =
    gender === "male"
      ? maleHints
      : femaleHints;


  for (
    const voice of matches
  ) {


    const name =
      String(
        voice.name || ""
      ).toLowerCase();


    if (
      hints.some(
        hint =>
          name.includes(
            hint
          )
      )
    ) {

      return voice;

    }

  }


  /*
    If no gender-specific voice can
    be identified, use the first
    matching language voice.
  */

  return matches[0];

}


/*************************************************
 READ BUTTON APPEARANCE
*************************************************/

function updateReadButton() {


  if (
    reading
  ) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }


  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/*************************************************
 STOP READING
*************************************************/

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {


    window.speechSynthesis.cancel();

  }


  reading =
    false;


  updateReadButton();

}


/*************************************************
 READ / STOP READ TOGGLE
*************************************************/

readBtn.addEventListener(
  "click",
  function() {


    /*********************************************
     STOP READING
    *********************************************/

    if (
      reading
    ) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    /*********************************************
     DON'T READ WHILE LISTENING
    *********************************************/

    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    /*********************************************
     GET TEXT
    *********************************************/

    const text =
      heardEl.value.trim();


    if (
      !text
    ) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    loadVoices();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      findVoice(
        languageEl.value,
        voiceGenderEl.value
      );


    if (
      selectedVoice
    ) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading =
          false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

    };


    utterance.onerror =
      function(event) {


        reading =
          false;


        updateReadButton();


        /*
          Ignore normal cancellation.
        */

        if (
          event.error !==
          "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

    };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/*************************************************
 SAVE
*************************************************/

saveBtn.addEventListener(
  "click",
  function() {


    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/*************************************************
 SAVE DICTATION
*************************************************/

function saveDictation() {


  if (
    saving
  ) {

    return;

  }


  /*
    Save exactly what is currently
    inside the editable text box.
  */

  const text =
    heardEl.value.trim();


  if (
    !text
  ) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value ===
    "local"
  ) {


    saveLocal(
      text
    );


    return;

  }


  saveGoogleDrive(
    text
  );

}


/*************************************************
 LOCAL TXT
*************************************************/

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {


    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(
      a
    );


  a.click();


  a.remove();


  setTimeout(
    function() {


      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/*************************************************
 GOOGLE DRIVE
*************************************************/

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {

      method:
        "POST",

      body:
        data

    }
  )


  .then(
    response =>
      response.json()
  )


  .then(
    data => {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }


      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error;

      }

    }
  )


  .catch(
    error => {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}


/*************************************************
 INITIAL BUTTON STATES
*************************************************/

updateMicButton();

updateReadButton();

</script>

</body>

</html>
