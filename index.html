<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>

<style>

/* =========================================================
   REF-01 — GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body,
button,
label,
select,
option,
input,
h1,
div,
span {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}


/* =========================================================
   REF-02 — PAGE
========================================================= */

body {
  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;

  max-width: 800px;

  margin: 0 auto;

  padding: 14px;

  background: #000;
  color: #fff;

  text-align: center;
}

h1 {
  margin: 10px 0 18px;
  font-size: 28px;
}


/* =========================================================
   REF-03 — CONTROLS
========================================================= */

.control {
  margin: 12px 0;
}

label {
  display: block;

  margin-bottom: 6px;

  font-size: 16px;
  font-weight: bold;
}

select,
input {
  width: 100%;

  padding: 12px;

  font-size: 17px;

  color: #fff;
  background: #181818;

  border: 1px solid #444;
  border-radius: 12px;
}


/* =========================================================
   REF-04 — VOICE SELECTOR
========================================================= */

.voiceRow {
  display: flex;
  gap: 8px;
}

#voiceSelect {
  flex: 1;
  min-width: 0;
}

#testVoiceBtn {
  width: 82px;

  border: none;
  border-radius: 12px;

  background: #333;
  color: #fff;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   REF-05 — DRIVE
========================================================= */

#driveOptions {
  padding: 14px;

  background: #111;

  border: 1px solid #333;
  border-radius: 14px;
}


/* =========================================================
   REF-06 — MAIN BUTTONS
========================================================= */

.mainButton {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 14px;

  width: 100%;
  height: 66px;

  margin: 15px 0;

  border: none;
  border-radius: 16px;

  color: #fff;

  font-size: 23px;
  font-weight: 700;

  cursor: pointer;

  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#micBtn,
#readBtn {
  background: #0866ff;
}

#micBtn.listening,
#readBtn.reading {
  background: #d71920;
}

.buttonIcon {
  font-size: 28px;
}


/* =========================================================
   REF-07 — STATUS
========================================================= */

#status {
  min-height: 25px;

  margin: 10px 0 14px;

  font-size: 19px;
  font-weight: bold;
}


/* =========================================================
   REF-08 — TEXTBOX
========================================================= */

#heard {
  width: 100%;

  height: 320px;
  min-height: 260px;

  padding: 16px;

  color: #fff;
  background: #101010;

  border: 2px solid #333;
  border-radius: 14px;

  font-size: 22px;
  line-height: 1.5;

  overflow-y: scroll;

  resize: none;

  -webkit-user-select: text;
  user-select: text;

  -webkit-touch-callout: default;
}


/* LOCK TEXTBOX WHILE LISTENING */

#heard.listeningLock {
  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;

  caret-color: transparent;

  cursor: pointer;
}


/* LIVE VIEW */

#heard.liveView {
  border-color: #16803a;
}


/* FROZEN VIEW */

#heard.frozenView {
  border-color: #f59e0b;
}


/* =========================================================
   REF-09 — CLEAR / SAVE
========================================================= */

.smallButtons {
  display: flex;
  gap: 10px;

  margin: 14px 0;
}

.smallButton {
  flex: 1;

  min-height: 52px;

  border: 1px solid #444;
  border-radius: 13px;

  color: #fff;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#clearBtn {
  background: #333;
}

#saveBtn {
  background: #16803a;
  border-color: #16803a;
}


/* =========================================================
   REF-10 — RESULT
========================================================= */

#result {
  min-height: 24px;

  margin: 15px 0 30px;

  font-size: 17px;
  font-weight: bold;
}

.small {
  margin-top: 6px;

  font-size: 13px;
  color: #aaa;
}

</style>

</head>


<body>


<h1>Voice Dictation</h1>


<!-- =====================================================
     REF-11 — LANGUAGE
===================================================== -->

TEST

===================================================== -->

<div class="control">

     REF-14 — FILE NAME

>

<!-- =====================================================
     REF-15 — GOOGLE DRIVE
===================================================== -->

<div id="driveOptions">

<label>Google Drive Format</label>

<select id="driveFormat">

  <option value="gdoc">

  </option>

Paste Google Drive folder URL or folder ID.

<!-- =====================================================
     REF-16 — LISTEN BUTTON
===================================================== -->

<button
  id="micBtn"
  class="mainButton"

<span
  id="micIcon"
  class="buttonIcon"
>
🎙
</span>

</span>

PRESS BLUE TO LISTEN
</div>


<!-- =====================================================
     REF-17 — DICTATION TEXTBOX
===================================================== -->

<textarea
  id="heard"
  placeholder="Your transcription will appear here..."
></textarea>


<!-- =====================================================
     REF-18 — READ BUTTON
===================================================== -->

<button
  id="readBtn"
  class="mainButton"
  type="button"
>

<span
  id="readIcon"
  class="buttonIcon"
>
▶
</span>

<span id="readText">
READ
</span>

</button>


<!-- =====================================================
     REF-19 — CLEAR / SAVE
===================================================== -->

<div class="smallButtons">

<button
  id="clearBtn"
  class="smallButton"
  type="button"
>
CLEAR
</button>

<button
  id="saveBtn"
  class="smallButton"
  type="button"
>
💾 SAVE
</button>

</div>


<div id="result">
—
</div>



<script>

/* =========================================================
   REF-20 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-21 — ELEMENTS
========================================================= */

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const voiceSelectEl =
  document.getElementById("voiceSelect");

const testVoiceBtn =
  document.getElementById("testVoiceBtn");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/* =========================================================
   REF-22 — STATE
========================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let manualStop = false;


/*
  LIVE VIEW

  true  = textbox updates and scrolls
  false = textbox display remains frozen

  Recognition continues either way.
*/

let liveView = true;


let saving = false;

let reading = false;


/*
  Confirmed final transcript.
*/

let finalText = "";


/*
  Current temporary Chrome hypothesis.
*/

let interimText = "";


/*
  Available TTS voices.
*/

let availableVoices = [];


/* =========================================================
   REF-23 — DESTINATION
========================================================= */

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/* =========================================================
   REF-24 — NORMALIZE
========================================================= */

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   REF-25 — CURRENT DISPLAY TEXT
========================================================= */

function getDisplayText() {

  let text =
    normalizeText(finalText);


  const temp =
    normalizeText(interimText);


  if (temp) {

    text +=
      (text ? " " : "") +
      temp;

  }


  return normalizeText(text);

}


/* =========================================================
   REF-26 — REFRESH TEXTBOX
========================================================= */

function refreshTranscriptDisplay(
  force = false
) {


  /*
    FROZEN VIEW:
    recognition continues,
    textbox does not change.
  */

  if (
    listening &&
    !liveView &&
    !force
  ) {

    return;

  }


  heardEl.value =
    getDisplayText();


  /*
    LIVE VIEW:
    keep newest text visible.
  */

  if (
    listening &&
    liveView
  ) {


    heardEl.scrollTop =
      heardEl.scrollHeight;

  }

}


/* =========================================================
   REF-27 — TEXTBOX MODE
========================================================= */

function updateTextboxMode() {


  /*
    NOT LISTENING:
    normal edit/select/copy/paste.
  */

  if (!listening) {


    heardEl.readOnly =
      false;


    heardEl.classList.remove(
      "listeningLock",
      "liveView",
      "frozenView"
    );


    return;

  }


  /*
    LISTENING:
    prevent keyboard and selection.
  */

  heardEl.readOnly =
    true;


  heardEl.classList.add(
    "listeningLock"
  );


  if (liveView) {


    heardEl.classList.add(
      "liveView"
    );


    heardEl.classList.remove(
      "frozenView"
    );

  }

  else {


    heardEl.classList.remove(
      "liveView"
    );


    heardEl.classList.add(
      "frozenView"
    );

  }

}


/* =========================================================
   REF-28 — BLOCK MOBILE KEYBOARD WHILE LISTENING
========================================================= */

heardEl.addEventListener(
  "pointerdown",

  function(event) {


    if (!listening) {
      return;
    }


    event.preventDefault();


    heardEl.blur();

  }
);


heardEl.addEventListener(
  "touchstart",

  function(event) {


    if (!listening) {
      return;
    }


    event.preventDefault();


    heardEl.blur();

  },

  {
    passive: false
  }
);


/* =========================================================
   REF-29 — TAP TEXTBOX: LIVE / FREEZE
========================================================= */

heardEl.addEventListener(
  "click",

  function(event) {


    if (!listening) {
      return;
    }


    event.preventDefault();


    heardEl.blur();


    liveView =
      !liveView;


    updateTextboxMode();


    if (liveView) {


      /*
        Catch up immediately.
      */

      refreshTranscriptDisplay(true);


      heardEl.scrollTop =
        heardEl.scrollHeight;


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN — TAP TEXT TO RESUME";

    }

  }
);


/* =========================================================
   REF-30 — CREATE RECOGNIZER

   SIMPLE RELIABILITY MODEL:

   FINAL   -> permanent
   INTERIM -> display only
========================================================= */

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {


    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );


    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/* =========================================================
   REF-31 — RECOGNITION START
========================================================= */

  recognition.onstart =
    function() {


      recognitionRunning =
        true;

  };


/* =========================================================
   REF-32 — RECOGNITION RESULT

   IMPORTANT:

   Chrome may repeatedly revise interim text:

   diplomacy
   diplomacy often
   diplomacy often gets
   diplomacy often gets a bad rep

   Those are replacements, NOT new text.

   We append ONLY isFinal results.
========================================================= */

  recognition.onresult =
    function(event) {


      let newInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const result =
          event.results[i];


        if (
          !result ||
          !result[0]
        ) {

          continue;

        }


        const text =
          normalizeText(
            result[0].transcript
          );


        if (!text) {
          continue;
        }


        /*
          FINAL RESULT:
          permanently append ONCE.
        */

        if (
          result.isFinal
        ) {


          finalText +=
            (finalText ? " " : "") +
            text;

        }


        /*
          INTERIM RESULT:
          replace current temporary hypothesis.
        */

        else {


          newInterim +=
            (newInterim ? " " : "") +
            text;

        }

      }


      /*
        REPLACE interim completely.
      */

      interimText =
        normalizeText(
          newInterim
        );


      refreshTranscriptDisplay();

  };


/* =========================================================
   REF-33 — RECOGNITION ERROR
========================================================= */

  recognition.onerror =
    function(event) {


      /*
        Manual stop may generate aborted.
      */

      if (
        event.error === "aborted" &&
        manualStop
      ) {

        return;

      }


      /*
        no-speech is not fatal.
      */

      if (
        event.error === "no-speech"
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;


      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed" ||
        event.error === "audio-capture"
      ) {


        manualStop =
          true;


        listening =
          false;


        recognitionRunning =
          false;


        updateMicButton();


        updateTextboxMode();

      }

  };


/* =========================================================
   REF-34 — RECOGNITION END

   - discard interim
   - preserve finalText
   - restart quickly if user is still listening
========================================================= */

  recognition.onend =
    function() {


      recognitionRunning =
        false;


      /*
        Interim was never confirmed.
        Do not permanently append it.
      */

      interimText =
        "";


      /*
        USER STOPPED
      */

      if (
        manualStop ||
        !listening
      ) {


        refreshTranscriptDisplay(true);


        return;

      }


      /*
        Chrome stopped automatically.

        Restart quickly.
      */

      setTimeout(

        function() {


          if (
            !listening ||
            manualStop ||
            recognitionRunning
          ) {

            return;

          }


          startRecognitionSession();

        },

        50

      );

  };


  return true;

}


/* =========================================================
   REF-35 — START RECOGNITION SESSION
========================================================= */

function startRecognitionSession() {


  if (
    !listening ||
    recognitionRunning
  ) {

    return;

  }


  if (
    !createRecognizer()
  ) {


    listening =
      false;


    updateMicButton();


    updateTextboxMode();


    return;

  }


  try {


    recognition.start();

  }


  catch(error) {


    console.log(
      "Recognition start:",
      error
    );

  }

}


/* =========================================================
   REF-36 — MIC BUTTON UI
========================================================= */

function updateMicButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    if (liveView) {


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN";

    }


    languageEl.disabled =
      true;

  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;

  }

}


/* =========================================================
   REF-37 — MIC START / STOP
========================================================= */

micBtn.addEventListener(
  "click",

  function() {


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    if (!listening) {


      /*
        Stop speaker playback.
      */

      stopReading();


      /*
        Fresh dictation.
      */

      finalText =
        "";


      interimText =
        "";


      heardEl.value =
        "";


      heardEl.scrollTop =
        0;


      resultEl.textContent =
        "";


      /*
        LIVE VIEW defaults ON.
      */

      liveView =
        true;


      manualStop =
        false;


      listening =
        true;


      updateMicButton();


      updateTextboxMode();


      startRecognitionSession();


      return;

    }


    /* -----------------------------------------------------
       STOP
    ----------------------------------------------------- */


    /*
      Prevent any restart immediately.
    */

    manualStop =
      true;


    listening =
      false;


    /*
      Button changes RED -> BLUE immediately.
    */

    updateMicButton();


    /*
      Re-enable textbox editing.
    */

    updateTextboxMode();


    /*
      Do not append interim.
    */

    interimText =
      "";


    /*
      Show full confirmed transcript,
      even if view was frozen.
    */

    refreshTranscriptDisplay(true);


    statusEl.textContent =
      "DICTATION READY";


    try {


      if (recognition) {


        recognition.stop();

      }

    }


    catch(error) {


      console.log(
        "Stop recognition:",
        error
      );

    }

  }
);


/* =========================================================
   REF-38 — MANUAL TEXT EDIT
========================================================= */

heardEl.addEventListener(
  "input",

  function() {


    if (!listening) {


      finalText =
        heardEl.value;


      interimText =
        "";

    }

  }
);


/* =========================================================
   REF-39 — CLEAR
========================================================= */

clearBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before clearing.";


      return;

    }


    stopReading();


    finalText =
      "";


    interimText =
      "";


    heardEl.value =
      "";


    heardEl.scrollTop =
      0;


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/* =========================================================
   REF-40 — LOAD DEVICE TTS VOICES
========================================================= */

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();


  const previousSelection =
    voiceSelectEl.value;


  voiceSelectEl.innerHTML =
    "";


  const selectedLanguage =
    languageEl.value.toLowerCase();


  const baseLanguage =
    selectedLanguage.split("-")[0];


  let matchingVoices =
    availableVoices.filter(
      function(voice) {


        const voiceLanguage =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          voiceLanguage === selectedLanguage ||
          voiceLanguage.startsWith(
            baseLanguage + "-"
          )
        );

      }
    );


  if (
    matchingVoices.length === 0
  ) {


    matchingVoices =
      availableVoices;

  }


  if (
    matchingVoices.length === 0
  ) {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Default device voice";


    voiceSelectEl.appendChild(
      option
    );


    return;

  }


  matchingVoices.forEach(
    function(voice) {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        availableVoices.indexOf(
          voice
        );


      let label =
        voice.name +
        " — " +
        voice.lang;


      if (
        voice.default
      ) {


        label +=
          " ★";

      }


      option.textContent =
        label;


      voiceSelectEl.appendChild(
        option
      );

    }
  );


  if (
    previousSelection &&
    [...voiceSelectEl.options]
      .some(
        option =>
          option.value ===
          previousSelection
      )
  ) {


    voiceSelectEl.value =
      previousSelection;

  }

}


/* =========================================================
   REF-41 — VOICE LOAD
========================================================= */

loadVoices();


if (
  "speechSynthesis"
  in window
) {


  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


languageEl.addEventListener(
  "change",
  loadVoices
);


/* =========================================================
   REF-42 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {


  const index =
    Number(
      voiceSelectEl.value
    );


  if (
    Number.isNaN(index) ||
    !availableVoices[index]
  ) {


    return null;

  }


  return availableVoices[index];

}


/* =========================================================
   REF-43 — TEST VOICE
========================================================= */

testVoiceBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before testing voice.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const language =
      languageEl.value;


    let sample =
      "Hello. This is a sample of this voice.";


    if (
      language === "gu-IN"
    ) {


      sample =
        "નમસ્તે. આ અવાજનો નમૂનો છે.";

    }


    else if (
      language === "hi-IN"
    ) {


      sample =
        "नमस्ते। यह आवाज़ का एक नमूना है।";

    }


    else if (
      language === "en-IN"
    ) {


      sample =
        "Hello. This is a sample of the selected voice.";

    }


    const utterance =
      new SpeechSynthesisUtterance(
        sample
      );


    utterance.lang =
      language;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-44 — READ BUTTON UI
========================================================= */

function updateReadButton() {


  if (reading) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }

  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/* =========================================================
   REF-45 — STOP READING
========================================================= */

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {


    window.speechSynthesis.cancel();

  }


  reading =
    false;


  updateReadButton();

}


/* =========================================================
   REF-46 — READ
========================================================= */

readBtn.addEventListener(
  "click",

  function() {


    /*
      STOP READING
    */

    if (reading) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    /*
      MIC HAS PRIORITY
    */

    if (listening) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    const text =
      heardEl.value.trim();


    if (!text) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading =
          false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

    };


    utterance.onerror =
      function(event) {


        reading =
          false;


        updateReadButton();


        if (
          event.error !== "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

    };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-47 — SAVE BUTTON
========================================================= */

saveBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/* =========================================================
   REF-48 — SAVE
========================================================= */

function saveDictation() {


  if (saving) {
    return;
  }


  const text =
    heardEl.value.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value ===
    "local"
  ) {


    saveLocal(text);


    return;

  }


  saveGoogleDrive(text);

}


/* =========================================================
   REF-49 — LOCAL TXT
========================================================= */

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {


    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function() {


      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/* =========================================================
   REF-50 — GOOGLE DRIVE
========================================================= */

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {
      method: "POST",
      body: data
    }
  )


  .then(
    function(response) {


      return response.json();

    }
  )


  .then(
    function(data) {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }

      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error ||
          "Unknown save error";

      }

    }
  )


  .catch(
    function(error) {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}


/* =========================================================
   REF-51 — INITIAL STATE
========================================================= */

updateMicButton();

updateReadButton();

updateTextboxMode();

</script>
