<script>

/*************************************************
 BACKEND
*************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/*************************************************
 ELEMENTS
*************************************************/

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const normalModeBtn =
  document.getElementById("normalModeBtn");

const farModeBtn =
  document.getElementById("farModeBtn");

const farStatus =
  document.getElementById("farStatus");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");

const voiceGenderEl =
  document.getElementById("voiceGender");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/*************************************************
 STATE
*************************************************/

let recognition = null;

let listening = false;

let stopping = false;

let saving = false;

let reading = false;

let micMode = "normal";

let farMicStream = null;


let finalText = "";

let interimText = "";

let lastFinalRaw = "";

let availableVoices = [];


/*************************************************
 DESTINATION
*************************************************/

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/*************************************************
 NORMAL / FAR MIC
*************************************************/

normalModeBtn.addEventListener(
  "click",
  async function() {

    if (listening) {
      resultEl.textContent =
        "Stop listening before changing microphone mode.";
      return;
    }

    micMode = "normal";

    stopFarMicStream();

    normalModeBtn.classList.add("active");
    farModeBtn.classList.remove("active");

    farStatus.textContent =
      "Normal microphone mode";

  }
);


farModeBtn.addEventListener(
  "click",
  async function() {

    if (listening) {
      resultEl.textContent =
        "Stop listening before changing microphone mode.";
      return;
    }

    micMode = "far";

    normalModeBtn.classList.remove("active");
    farModeBtn.classList.add("active");

    farStatus.textContent =
      "Preparing far microphone...";

    await prepareFarMic();

  }
);


/*************************************************
 PREPARE FAR MIC
*************************************************/

async function prepareFarMic() {

  /*
    IMPORTANT:

    Chrome SpeechRecognition does not let us
    directly feed this audio stream into the
    recognizer.

    These constraints request stronger
    microphone processing from the browser /
    operating system where supported.
  */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    farStatus.textContent =
      "Far microphone processing not supported on this device.";

    return false;

  }


  stopFarMicStream();


  try {

    farMicStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          autoGainControl: true,

          noiseSuppression: true,

          echoCancellation: true

        }

      });


    const tracks =
      farMicStream.getAudioTracks();


    if (tracks.length > 0) {

      const track =
        tracks[0];


      const settings =
        track.getSettings
          ? track.getSettings()
          : {};


      let enabled = [];


      if (
        settings.autoGainControl === true
      ) {

        enabled.push("Auto Gain");

      }


      if (
        settings.noiseSuppression === true
      ) {

        enabled.push("Noise Reduction");

      }


      if (
        settings.echoCancellation === true
      ) {

        enabled.push("Echo Control");

      }


      if (
        enabled.length
      ) {

        farStatus.textContent =
          "📡 FAR MIC ACTIVE — " +
          enabled.join(" + ");

      }

      else {

        farStatus.textContent =
          "📡 FAR MIC ACTIVE";

      }

    }

    else {

      farStatus.textContent =
        "📡 FAR MIC ACTIVE";

    }


    return true;

  }


  catch(error) {

    farMicStream =
      null;


    farStatus.textContent =
      "Far mic error: " +
      error.message;


    resultEl.textContent =
      "Could not activate Far Mic.";


    return false;

  }

}


/*************************************************
 STOP FAR MIC STREAM
*************************************************/

function stopFarMicStream() {

  if (!farMicStream) {
    return;
  }


  farMicStream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  farMicStream =
    null;

}


/*************************************************
 NORMALIZE
*************************************************/

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/*************************************************
 DUPLICATE PROTECTION
*************************************************/

function commitFinalTranscript(newText) {

  newText =
    normalizeText(newText);


  if (!newText) {
    return;
  }


  if (
    newText === lastFinalRaw
  ) {

    return;

  }


  /*
    Progressive Chrome result.

    Add only new ending.
  */

  if (
    lastFinalRaw &&
    newText.startsWith(lastFinalRaw)
  ) {


    const extra =
      normalizeText(
        newText.slice(
          lastFinalRaw.length
        )
      );


    if (extra) {

      finalText +=
        (finalText ? " " : "") +
        extra;

    }


    lastFinalRaw =
      newText;


    return;

  }


  /*
    Ignore shorter duplicate.
  */

  if (
    lastFinalRaw &&
    lastFinalRaw.startsWith(newText)
  ) {

    return;

  }


  /*
    New phrase.
  */

  finalText +=
    (finalText ? " " : "") +
    newText;


  lastFinalRaw =
    newText;

}


/*************************************************
 SHOW TRANSCRIPT
*************************************************/

function showTranscript() {

  let display =
    normalizeText(finalText);


  const temp =
    normalizeText(interimText);


  if (temp) {

    display +=
      (display ? " " : "") +
      temp;

  }


  heardEl.value =
    display;

}


/*************************************************
 CREATE RECOGNIZER
*************************************************/

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/*************************************************
 RESULT
*************************************************/

  recognition.onresult =
    function(event) {


      let currentInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const result =
          event.results[i];


        if (
          !result ||
          !result[0]
        ) {

          continue;

        }


        const transcript =
          normalizeText(
            result[0].transcript
          );


        if (!transcript) {
          continue;
        }


        if (
          result.isFinal
        ) {

          commitFinalTranscript(
            transcript
          );

        }

        else {

          if (currentInterim) {

            currentInterim += " ";

          }


          currentInterim +=
            transcript;

        }

      }


      interimText =
        currentInterim;


      showTranscript();

    };


/*************************************************
 ERROR
*************************************************/

  recognition.onerror =
    function(event) {


      if (
        event.error === "aborted" &&
        stopping
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;

    };


/*************************************************
 RECOGNITION ENDED
*************************************************/

  recognition.onend =
    function() {


      interimText = "";


      /*
        USER STOP
      */

      if (stopping) {


        stopping = false;

        listening = false;


        updateMicButton();

        showTranscript();


        statusEl.textContent =
          "DICTATION READY";


        return;

      }


      /*
        CHROME AUTO RESTART
      */

      if (listening) {


        setTimeout(

          function() {


            if (!listening) {
              return;
            }


            try {


              lastFinalRaw = "";


              createRecognizer();


              recognition.start();

            }


            catch(error) {

              console.log(
                "Restart error:",
                error
              );

            }

          },

          300

        );

      }

  };


  return true;

}


/*************************************************
 MIC BUTTON DISPLAY
*************************************************/

function updateMicButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    statusEl.textContent =
      micMode === "far"
        ? "📡 FAR MIC LISTENING..."
        : "LISTENING...";


    languageEl.disabled =
      true;


    normalModeBtn.disabled =
      true;


    farModeBtn.disabled =
      true;

  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;


    normalModeBtn.disabled =
      false;


    farModeBtn.disabled =
      false;

  }

}


/*************************************************
 MIC BUTTON
*************************************************/

micBtn.addEventListener(
  "click",

  async function() {


    /*********************************************
     START
    *********************************************/

    if (!listening) {


      stopReading();


      finalText = "";

      interimText = "";

      lastFinalRaw = "";

      stopping = false;


      heardEl.value = "";

      resultEl.textContent = "";


      /*
        Prepare enhanced microphone
        processing before recognition.
      */

      if (
        micMode === "far"
      ) {


        const ok =
          await prepareFarMic();


        if (!ok) {

          resultEl.textContent =
            "Far Mic could not be activated. You can switch to NORMAL.";

          return;

        }

      }

      else {

        stopFarMicStream();

      }


      if (
        !createRecognizer()
      ) {

        return;

      }


      try {


        recognition.start();


        listening = true;


        updateMicButton();

      }


      catch(error) {


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }


    /*********************************************
     STOP
    *********************************************/

    stopping = true;


    statusEl.textContent =
      "FINISHING...";


    try {

      recognition.stop();

    }


    catch(error) {


      stopping = false;

      listening = false;


      updateMicButton();


      statusEl.textContent =
        "DICTATION READY";

    }

  }
);


/*************************************************
 MANUAL EDIT
*************************************************/

heardEl.addEventListener(
  "input",
  function() {


    if (!listening) {


      finalText =
        heardEl.value;


      lastFinalRaw =
        "";

    }

  }
);


/*************************************************
 CLEAR
*************************************************/

clearBtn.addEventListener(
  "click",
  function() {


    if (listening) {

      resultEl.textContent =
        "Stop listening before clearing.";

      return;

    }


    stopReading();


    finalText = "";

    interimText = "";

    lastFinalRaw = "";


    heardEl.value = "";


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/*************************************************
 TEXT TO SPEECH VOICES
*************************************************/

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();

}


loadVoices();


if (
  "speechSynthesis"
  in window
) {

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/*************************************************
 FIND VOICE
*************************************************/

function findVoice(
  language,
  gender
) {


  const lang =
    language.toLowerCase();


  const baseLang =
    lang.split("-")[0];


  let matches =
    availableVoices.filter(
      function(voice) {


        const vLang =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          vLang === lang ||
          vLang.startsWith(
            baseLang + "-"
          )
        );

      }
    );


  if (
    matches.length === 0
  ) {

    return null;

  }


  const femaleHints = [
    "female",
    "woman",
    "zira",
    "heera",
    "kalpana",
    "swara"
  ];


  const maleHints = [
    "male",
    "man",
    "david",
    "ravi",
    "hemant"
  ];


  const hints =
    gender === "male"
      ? maleHints
      : femaleHints;


  for (
    const voice of matches
  ) {


    const name =
      String(
        voice.name || ""
      ).toLowerCase();


    if (
      hints.some(
        hint =>
          name.includes(hint)
      )
    ) {

      return voice;

    }

  }


  return matches[0];

}


/*************************************************
 READ BUTTON DISPLAY
*************************************************/

function updateReadButton() {


  if (reading) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }

  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/*************************************************
 STOP READING
*************************************************/

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {

    window.speechSynthesis.cancel();

  }


  reading = false;


  updateReadButton();

}


/*************************************************
 READ BUTTON
*************************************************/

readBtn.addEventListener(
  "click",
  function() {


    /*
      STOP
    */

    if (reading) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    if (listening) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    const text =
      heardEl.value.trim();


    if (!text) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    loadVoices();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      findVoice(
        languageEl.value,
        voiceGenderEl.value
      );


    if (selectedVoice) {

      utterance.voice =
        selectedVoice;

    }


    utterance.rate = 1;

    utterance.pitch = 1;

    utterance.volume = 1;


    reading = true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading = false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

      };


    utterance.onerror =
      function(event) {


        reading = false;


        updateReadButton();


        if (
          event.error !== "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

      };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/*************************************************
 SAVE
*************************************************/

saveBtn.addEventListener(
  "click",
  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/*************************************************
 SAVE DICTATION
*************************************************/

function saveDictation() {


  if (saving) {
    return;
  }


  const text =
    heardEl.value.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value === "local"
  ) {


    saveLocal(text);


    return;

  }


  saveGoogleDrive(text);

}


/*************************************************
 LOCAL TXT
*************************************************/

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {

    name += ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download = name;


  document.body.appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(url);

    },
    1000
  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/*************************************************
 GOOGLE DRIVE
*************************************************/

function saveGoogleDrive(text) {


  saving = true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {

      method: "POST",

      body: data

    }
  )


  .then(
    response =>
      response.json()
  )


  .then(
    data => {


      saving = false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }

      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error;

      }

    }
  )


  .catch(
    error => {


      saving = false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}
