<script>

/* =========================================================
   REF-17 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-18 — ELEMENTS
========================================================= */

const micBtn =
document.getElementById("micBtn");

const micIcon =
document.getElementById("micIcon");

const micText =
document.getElementById("micText");


const readBtn =
document.getElementById("readBtn");

const readIcon =
document.getElementById("readIcon");

const readText =
document.getElementById("readText");


const heardEl =
document.getElementById("heard");

const statusEl =
document.getElementById("status");

const resultEl =
document.getElementById("result");


const languageEl =
document.getElementById("language");


const voiceSelectEl =
document.getElementById("voiceSelect");

const testVoiceBtn =
document.getElementById("testVoiceBtn");


const destinationEl =
document.getElementById("destination");

const driveOptionsEl =
document.getElementById("driveOptions");

const driveFormatEl =
document.getElementById("driveFormat");

const fileNameEl =
document.getElementById("fileName");

const folderEl =
document.getElementById("folder");


const clearBtn =
document.getElementById("clearBtn");

const saveBtn =
document.getElementById("saveBtn");


const mediaBtn =
document.getElementById("mediaBtn");

const mediaText =
document.getElementById("mediaText");

const mediaFile =
document.getElementById("mediaFile");

const mediaStatus =
document.getElementById("mediaStatus");

const mediaProgressOuter =
document.getElementById("mediaProgressOuter");

const mediaProgressInner =
document.getElementById("mediaProgressInner");


/* =========================================================
   REF-19 — STATE
========================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let manualStop = false;

let liveView = true;

let reading = false;

let saving = false;

let mediaBusy = false;


let committedText = "";

let sessionFinalText = "";

let sessionInterimText = "";


let availableVoices = [];

let displayFramePending = false;


let transformersModule = null;

let whisperPipeline = null;


/* =========================================================
   REF-20 — DESTINATION
========================================================= */

destinationEl.addEventListener(
"change",
updateDestination
);


function updateDestination() {

driveOptionsEl.style.display =
destinationEl.value === "drive"
? "block"
: "none";

}


updateDestination();


/* =========================================================
   REF-21 — NORMALIZE
========================================================= */

function normalizeText(text) {

return String(text || "")
.replace(/\s+/g, " ")
.trim();

}


/* =========================================================
   REF-22 — LIVE DUPLICATION FIX
========================================================= */

function collapseProgressiveParts(parts) {

const cleaned = [];


for (
let i = 0;
i < parts.length;
i++
) {

const current =
normalizeText(
parts[i]
);


if (!current) {
continue;
}


if (
cleaned.length === 0
) {

cleaned.push(
current
);

continue;

}


const last =
cleaned.length - 1;


const previous =
cleaned[last];


const a =
previous.toLowerCase();

const b =
current.toLowerCase();


if (a === b) {
continue;
}


if (
b.startsWith(a)
) {

cleaned[last] =
current;

continue;

}


if (
a.startsWith(b)
) {

continue;

}


cleaned.push(
current
);

}


return normalizeText(
cleaned.join(" ")
);

}


/* =========================================================
   REF-23 — LIVE SESSION
========================================================= */

function rebuildCurrentSession(results) {

const finals = [];

const interims = [];


for (
let i = 0;
i < results.length;
i++
) {

const result =
results[i];


if (
!result ||
!result[0]
) {
continue;
}


const text =
normalizeText(
result[0].transcript
);


if (!text) {
continue;
}


if (
result.isFinal
) {

finals.push(
text
);

}

else {

interims.push(
text
);

}

}


sessionFinalText =
collapseProgressiveParts(
finals
);


sessionInterimText =
collapseProgressiveParts(
interims
);

}


/* =========================================================
   REF-24 — COMMIT LIVE SESSION
========================================================= */

function commitCurrentSession() {

const text =
normalizeText(
sessionFinalText
);


if (text) {

committedText +=
(committedText ? " " : "") +
text;


committedText =
normalizeText(
committedText
);

}


sessionFinalText = "";

sessionInterimText = "";

}


/* =========================================================
   REF-25 — CURRENT TEXT
========================================================= */

function getCurrentTranscript() {

let text =
normalizeText(
committedText
);


const finalNow =
normalizeText(
sessionFinalText
);


const interimNow =
normalizeText(
sessionInterimText
);


if (finalNow) {

text +=
(text ? " " : "") +
finalNow;

}


if (interimNow) {

text +=
(text ? " " : "") +
interimNow;

}


return normalizeText(
text
);

}


/* =========================================================
   REF-26 — DISPLAY
========================================================= */

function refreshTranscriptDisplay(
force = false
) {

if (
listening &&
!liveView &&
!force
) {
return;
}


if (force) {

displayFramePending = false;


heardEl.value =
getCurrentTranscript();


if (
listening &&
liveView
) {

heardEl.scrollTop =
heardEl.scrollHeight;

}


return;

}


if (displayFramePending) {
return;
}


displayFramePending = true;


requestAnimationFrame(
function() {

displayFramePending = false;


if (
listening &&
!liveView
) {
return;
}


heardEl.value =
getCurrentTranscript();


if (
listening &&
liveView
) {

heardEl.scrollTop =
heardEl.scrollHeight;

}

}
);

}


/* =========================================================
   REF-27 — TEXTBOX MODE
========================================================= */

function updateTextboxMode() {

if (!listening) {

heardEl.readOnly = false;


heardEl.setAttribute(
"inputmode",
"text"
);


heardEl.classList.remove(
"listeningLock",
"liveView",
"frozenView"
);


return;

}


heardEl.readOnly = true;


heardEl.setAttribute(
"inputmode",
"none"
);


heardEl.blur();


heardEl.classList.add(
"listeningLock"
);


if (liveView) {

heardEl.classList.add(
"liveView"
);


heardEl.classList.remove(
"frozenView"
);

}

else {

heardEl.classList.remove(
"liveView"
);


heardEl.classList.add(
"frozenView"
);

}

}


/* =========================================================
   REF-28 — LIVE/FREEZE TAP
========================================================= */

heardEl.addEventListener(
"pointerdown",

function(event) {

if (!listening) {
return;
}


event.preventDefault();

heardEl.blur();


liveView =
!liveView;


updateTextboxMode();


if (liveView) {

refreshTranscriptDisplay(
true
);


heardEl.scrollTop =
heardEl.scrollHeight;


statusEl.textContent =
"LISTENING — LIVE VIEW";

}

else {

statusEl.textContent =
"LISTENING — VIEW FROZEN";

}

}
);


/* =========================================================
   REF-29 — LIVE SPEECH RECOGNITION
========================================================= */

function createRecognizer() {

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SR) {

alert(
"Use Chrome or Edge for live speech recognition."
);

return false;

}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select a language for live microphone recognition.";

return false;

}


recognition =
new SR();


recognition.lang =
languageEl.value;


recognition.continuous =
true;


recognition.interimResults =
true;


recognition.maxAlternatives =
1;


recognition.onstart =
function() {

recognitionRunning =
true;

};


recognition.onresult =
function(event) {

rebuildCurrentSession(
event.results
);


refreshTranscriptDisplay();

};


recognition.onerror =
function(event) {

if (
event.error === "aborted" &&
manualStop
) {

return;

}


if (
event.error === "no-speech"
) {

return;

}


resultEl.textContent =
"MIC ERROR: " +
event.error;

};


recognition.onend =
function() {

recognitionRunning =
false;


commitCurrentSession();


if (
manualStop ||
!listening
) {

refreshTranscriptDisplay(
true
);


return;

}


setTimeout(

function() {

if (
listening &&
!manualStop &&
!recognitionRunning
) {

startRecognitionSession();

}

},

50
);

};


return true;

}


/* =========================================================
   REF-30 — START LIVE SESSION
========================================================= */

function startRecognitionSession() {

if (
!listening ||
recognitionRunning
) {

return;

}


if (
!createRecognizer()
) {

listening = false;


updateMicButton();


updateTextboxMode();


return;

}


try {

recognition.start();

}

catch(error) {

console.log(error);

}

}


/* =========================================================
   REF-31 — MIC UI
========================================================= */

function updateMicButton() {

if (listening) {

micBtn.classList.add(
"listening"
);


micIcon.textContent =
"■";


micText.textContent =
"STOP LISTENING";


languageEl.disabled =
true;


mediaBtn.disabled =
true;


statusEl.textContent =
liveView
? "LISTENING — LIVE VIEW"
: "LISTENING — VIEW FROZEN";

}

else {

micBtn.classList.remove(
"listening"
);


micIcon.textContent =
"🎙";


micText.textContent =
"LISTEN";


languageEl.disabled =
mediaBusy;


mediaBtn.disabled =
mediaBusy;

}

}


/* =========================================================
   REF-32 — MIC START / STOP
========================================================= */

micBtn.addEventListener(
"click",

function() {

if (mediaBusy) {
return;
}


if (!listening) {

if (
languageEl.value === "auto"
) {

resultEl.textContent =
"AUTO DETECT is for imported media.";

return;

}


stopReading();


committedText = "";

sessionFinalText = "";

sessionInterimText = "";


heardEl.value = "";


heardEl.scrollTop = 0;


liveView = true;

manualStop = false;

listening = true;


updateMicButton();


updateTextboxMode();


startRecognitionSession();


return;

}


manualStop = true;

listening = false;


updateMicButton();


updateTextboxMode();


statusEl.textContent =
"DICTATION READY";


try {

if (recognition) {

recognition.stop();

}

}

catch(error) {

commitCurrentSession();


refreshTranscriptDisplay(
true
);

}

}
);


/* =========================================================
   REF-33 — MANUAL EDIT
========================================================= */

heardEl.addEventListener(
"input",

function() {

if (!listening) {

committedText =
heardEl.value;


sessionFinalText = "";

sessionInterimText = "";

}

}
);


/* =========================================================
   REF-34 — WHISPER LANGUAGE
========================================================= */

function getWhisperLanguage() {

switch (
languageEl.value
) {

case "gu-IN":
return "gujarati";

case "hi-IN":
return "hindi";

case "en-IN":
case "en-US":
return "english";

default:
return null;

}

}


/* =========================================================
   REF-35 — MEDIA PROGRESS
========================================================= */

function setMediaProgress(
percent,
message
) {

const p =
Math.max(
0,
Math.min(
100,
Number(percent || 0)
)
);


mediaProgressOuter.style.display =
"block";


mediaProgressInner.style.width =
p + "%";


if (message) {

mediaStatus.textContent =
message;

}

}


/* =========================================================
   REF-36 — LOAD TRANSFORMERS.JS
========================================================= */

async function loadTransformers() {

if (transformersModule) {

return transformersModule;

}


setMediaProgress(
2,
"Loading Transformers.js..."
);


transformersModule =
await import(
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1"
);


return transformersModule;

}


/* =========================================================
   REF-37 — LOAD WHISPER BASE
========================================================= */

async function getWhisper() {

if (whisperPipeline) {

return whisperPipeline;

}


const module =
await loadTransformers();


mediaText.textContent =
"LOADING AI MODEL...";


setMediaProgress(
4,
"Loading Whisper Base..."
);


const MODEL =
"onnx-community/whisper-base";


/*
  Try WebGPU first.
*/

try {

whisperPipeline =
await module.pipeline(

"automatic-speech-recognition",

MODEL,

{
  device: "webgpu",

  progress_callback:
    function(info) {

      if (
        info &&
        typeof info.progress ===
        "number"
      ) {

        const p =
          4 +
          (
            Math.min(
              100,
              info.progress
            ) *
            0.20
          );


        setMediaProgress(
          p,
          "Loading Whisper Base..."
        );

      }

    }
}

);


mediaStatus.textContent =
"Whisper Base — WebGPU";


return whisperPipeline;

}

catch(error) {

console.log(
"WebGPU unavailable, using fallback.",
error
);

}


/*
  WASM / CPU fallback.
*/

whisperPipeline =
await module.pipeline(

"automatic-speech-recognition",

MODEL,

{
  progress_callback:
    function(info) {

      if (
        info &&
        typeof info.progress ===
        "number"
      ) {

        const p =
          4 +
          (
            Math.min(
              100,
              info.progress
            ) *
            0.20
          );


        setMediaProgress(
          p,
          "Loading Whisper Base..."
        );

      }

    }
}

);


mediaStatus.textContent =
"Whisper Base — Compatibility mode";


return whisperPipeline;

}


/* =========================================================
   REF-38 — TRUE 16 kHz MONO DECODING

   This produces one continuous Float32Array.
========================================================= */

async function decodeMediaTo16kMono(file) {

setMediaProgress(
25,
"Decoding media..."
);


const arrayBuffer =
await file.arrayBuffer();


const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;


if (!AudioContextClass) {

throw new Error(
"Audio decoding is unavailable in this browser."
);

}


/*
  Decode original audio.
*/

const decodeContext =
new AudioContextClass();


let decoded;


try {

decoded =
await decodeContext.decodeAudioData(
arrayBuffer.slice(0)
);

}

catch(error) {

await decodeContext.close();


throw new Error(
"Unable to decode this media. Try MP3, M4A or WAV."
);

}


/*
  Create mono buffer at ORIGINAL rate.
*/

const mono =
new Float32Array(
decoded.length
);


for (
let channel = 0;
channel < decoded.numberOfChannels;
channel++
) {

const channelData =
decoded.getChannelData(
channel
);


for (
let i = 0;
i < decoded.length;
i++
) {

mono[i] +=
channelData[i] /
decoded.numberOfChannels;

}

}


const originalRate =
decoded.sampleRate;


await decodeContext.close();


/*
  Already exactly 16kHz.
*/

if (
originalRate === 16000
) {

return mono;

}


setMediaProgress(
30,
"Resampling to 16 kHz mono..."
);


/*
  Native browser resampling.

  ONE continuous audio stream,
  not manual transcription chunks.
*/

const outputLength =
Math.ceil(
mono.length *
16000 /
originalRate
);


const offline =
new OfflineAudioContext(
1,
outputLength,
16000
);


const sourceBuffer =
offline.createBuffer(
1,
mono.length,
originalRate
);


sourceBuffer.copyToChannel(
mono,
0
);


const source =
offline.createBufferSource();


source.buffer =
sourceBuffer;


source.connect(
offline.destination
);


source.start(0);


const rendered =
await offline.startRendering();


return new Float32Array(
rendered.getChannelData(0)
);

}


/* =========================================================
   REF-39 — IMPORT MEDIA BUTTON
========================================================= */

mediaBtn.addEventListener(
"click",

function() {

if (
listening ||
mediaBusy
) {

return;

}


stopReading();


mediaFile.value =
"";


mediaFile.click();

}
);


/* =========================================================
   REF-40 — MEDIA V3

   KEY DIFFERENCE:

   We send ONE continuous 16kHz mono stream
   to Transformers.js.

   Transformers.js handles:
   30 sec chunks
   5 sec stride overlap
========================================================= */

mediaFile.addEventListener(
"change",

async function() {

const file =
mediaFile.files &&
mediaFile.files[0];


if (!file) {

return;

}


try {

/* -------------------------------
   LOCK UI
-------------------------------- */

mediaBusy = true;


mediaBtn.classList.add(
"busy"
);


mediaBtn.disabled = true;

micBtn.disabled = true;

languageEl.disabled = true;

readBtn.disabled = true;

clearBtn.disabled = true;

saveBtn.disabled = true;


mediaText.textContent =
"PREPARING...";


statusEl.textContent =
"MEDIA TRANSCRIPTION";


resultEl.textContent =
"";


setMediaProgress(
1,
file.name
);


/* -------------------------------
   LOAD MODEL
-------------------------------- */

const transcriber =
await getWhisper();


/* -------------------------------
   DECODE + RESAMPLE
-------------------------------- */

const audio16k =
await decodeMediaTo16kMono(
file
);


setMediaProgress(
40,
"Transcribing..."
);


mediaText.textContent =
"TRANSCRIBING...";


/* -------------------------------
   WHISPER OPTIONS
-------------------------------- */

const options = {

task:
"transcribe",

chunk_length_s:
30,

stride_length_s:
5,

return_timestamps:
true

};


const forcedLanguage =
getWhisperLanguage();


/*
  When AUTO is selected,
  language is omitted completely.
*/

if (forcedLanguage) {

options.language =
forcedLanguage;

}


/* -------------------------------
   ONE PIPELINE CALL

   Transformers.js now manages
   chunk overlap internally.
-------------------------------- */

const result =
await transcriber(
audio16k,
options
);


/* -------------------------------
   FINAL RESULT
-------------------------------- */

setMediaProgress(
95,
"Finishing transcript..."
);


const transcript =
normalizeText(
result &&
result.text
? result.text
: ""
);


if (!transcript) {

throw new Error(
"No speech was detected."
);

}


/*
  Put transcript into normal app state.
*/

committedText =
transcript;


sessionFinalText =
"";


sessionInterimText =
"";


heardEl.value =
transcript;


heardEl.scrollTop =
0;


setMediaProgress(
100,
"TRANSCRIPTION COMPLETE"
);


mediaText.textContent =
"IMPORT MEDIA";


statusEl.textContent =
"MEDIA TRANSCRIPT READY";


resultEl.textContent =
"Edit, READ or SAVE the transcript.";

}


/* =========================================================
   REF-41 — MEDIA ERROR
========================================================= */

catch(error) {

console.error(
error
);


mediaText.textContent =
"IMPORT MEDIA";


mediaStatus.textContent =
"TRANSCRIPTION FAILED";


resultEl.textContent =
error &&
error.message
? error.message
: "Media transcription failed.";


mediaProgressInner.style.width =
"0%";

}


/* =========================================================
   REF-42 — UNLOCK UI
========================================================= */

finally {

mediaBusy = false;


mediaBtn.classList.remove(
"busy"
);


mediaBtn.disabled = false;

micBtn.disabled = false;

languageEl.disabled = false;

readBtn.disabled = false;

clearBtn.disabled = false;

saveBtn.disabled = false;

}

}
);


/* =========================================================
   REF-43 — VOICES
========================================================= */

function loadVoices() {

if (
!("speechSynthesis" in window)
) {

return;

}


availableVoices =
window.speechSynthesis
.getVoices();


voiceSelectEl.innerHTML =
"";


if (
languageEl.value === "auto"
) {

const option =
document.createElement(
"option"
);


option.value =
"";


option.textContent =
"Select transcript language";


voiceSelectEl.appendChild(
option
);


return;

}


const selected =
languageEl.value
.toLowerCase();


const base =
selected.split("-")[0];


let matches =
availableVoices.filter(

voice => {

const lang =
String(
voice.lang || ""
)
.toLowerCase();


return (
lang === selected ||
lang.startsWith(
base + "-"
)
);

}

);


if (!matches.length) {

matches =
availableVoices;

}


matches.forEach(

voice => {

const option =
document.createElement(
"option"
);


option.value =
availableVoices.indexOf(
voice
);


option.textContent =
voice.name +
" — " +
voice.lang;


voiceSelectEl.appendChild(
option
);

}

);

}


loadVoices();


if (
"speechSynthesis" in window
) {

window.speechSynthesis.onvoiceschanged =
loadVoices;

}


languageEl.addEventListener(
"change",
loadVoices
);


/* =========================================================
   REF-44 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {

const index =
Number(
voiceSelectEl.value
);


if (
Number.isNaN(index) ||
!availableVoices[index]
) {

return null;

}


return availableVoices[index];

}


/* =========================================================
   REF-45 — TEST VOICE
========================================================= */

testVoiceBtn.addEventListener(
"click",

function() {

if (
listening ||
mediaBusy
) {

return;

}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select a language first.";

return;

}


window.speechSynthesis.cancel();


let sample =
"Hello. This is a sample of this voice.";


if (
languageEl.value === "hi-IN"
) {

sample =
"नमस्ते। यह आवाज़ का एक नमूना है।";

}


if (
languageEl.value === "gu-IN"
) {

sample =
"નમસ્તે. આ અવાજનો નમૂનો છે.";

}


const speech =
new SpeechSynthesisUtterance(
sample
);


speech.lang =
languageEl.value;


const voice =
getSelectedVoice();


if (voice) {

speech.voice =
voice;

}


speech.rate =
0.95;


window.speechSynthesis.speak(
speech
);

}
);


/* =========================================================
   REF-46 — READ UI
========================================================= */

function updateReadButton() {

if (reading) {

readBtn.classList.add(
"reading"
);


readIcon.textContent =
"■";


readText.textContent =
"STOP READING";

}

else {

readBtn.classList.remove(
"reading"
);


readIcon.textContent =
"▶";


readText.textContent =
"READ";

}

}


/* =========================================================
   REF-47 — STOP READ
========================================================= */

function stopReading() {

if (
"speechSynthesis" in window
) {

window.speechSynthesis.cancel();

}


reading = false;


updateReadButton();

}


/* =========================================================
   REF-48 — READ
========================================================= */

readBtn.addEventListener(
"click",

function() {

if (reading) {

stopReading();


statusEl.textContent =
"DICTATION READY";


return;

}


if (
listening ||
mediaBusy
) {

return;

}


if (
languageEl.value === "auto"
) {

resultEl.textContent =
"Select transcript language before READ.";


return;

}


const text =
heardEl.value.trim();


if (!text) {

resultEl.textContent =
"Nothing to read.";


return;

}


window.speechSynthesis.cancel();


reading = true;


updateReadButton();


statusEl.textContent =
"READING...";


setTimeout(

function() {

if (!reading) {

return;

}


const speech =
new SpeechSynthesisUtterance(
text
);


speech.lang =
languageEl.value;


const voice =
getSelectedVoice();


if (voice) {

speech.voice =
voice;

}


speech.rate =
0.92;


speech.onend =
function() {

reading = false;


updateReadButton();


statusEl.textContent =
"DICTATION READY";

};


speech.onerror =
function(event) {

reading = false;


updateReadButton();


if (
event.error === "canceled" ||
event.error === "interrupted"
) {

statusEl.textContent =
"DICTATION READY";


return;

}


statusEl.textContent =
"READ FAILED";


resultEl.textContent =
"READ ERROR: " +
event.error;

};


window.speechSynthesis.speak(
speech
);

},

150
);

}
);


/* =========================================================
   REF-49 — CLEAR
========================================================= */

clearBtn.addEventListener(
"click",

function() {

if (
listening ||
mediaBusy
) {

return;

}


stopReading();


committedText = "";

sessionFinalText = "";

sessionInterimText = "";


heardEl.value = "";


heardEl.scrollTop = 0;


statusEl.textContent =
"PRESS BLUE TO LISTEN";


resultEl.textContent =
"Text cleared";

}
);


/* =========================================================
   REF-50 — SAVE
========================================================= */

saveBtn.addEventListener(
"click",

function() {

if (
listening ||
mediaBusy
) {

return;

}


stopReading();


const text =
heardEl.value.trim();


if (!text) {

resultEl.textContent =
"Nothing to save.";


return;

}


if (
destinationEl.value === "local"
) {

saveLocal(
text
);

}

else {

saveGoogleDrive(
text
);

}

}
);


/* =========================================================
   REF-51 — LOCAL SAVE
========================================================= */

function saveLocal(text) {

let name =
fileNameEl.value.trim() ||
"Voice Dictation";


if (
!name
.toLowerCase()
.endsWith(".txt")
) {

name += ".txt";

}


const contents =
new Date().toLocaleString() +
"\n\n" +
text +
"\n";


const blob =
new Blob(

[contents],

{
type:
"text/plain;charset=utf-8"
}

);


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
"a"
);


a.href =
url;


a.download =
name;


document.body.appendChild(
a
);


a.click();


a.remove();


setTimeout(

() =>
URL.revokeObjectURL(
url
),

1000
);


statusEl.textContent =
"SAVED LOCALLY";


resultEl.textContent =
"Downloaded: " +
name;

}


/* =========================================================
   REF-52 — GOOGLE DRIVE
========================================================= */

function saveGoogleDrive(text) {

if (saving) {

return;

}


saving = true;


statusEl.textContent =
"SAVING TO GOOGLE DRIVE...";


const data =
new URLSearchParams();


data.append(
"text",
text
);


data.append(
"format",
driveFormatEl.value
);


data.append(
"fileName",
fileNameEl.value.trim()
);


data.append(
"folder",
folderEl.value.trim()
);


fetch(

BACKEND_URL,

{
method:
"POST",

body:
data
}

)

.then(

response =>
response.json()

)

.then(

data => {

saving = false;


if (
data.success
) {

statusEl.textContent =
"SAVED";


resultEl.textContent =
"Saved to Google Drive: " +
data.fileName;

}

else {

statusEl.textContent =
"SAVE ERROR";


resultEl.textContent =
data.error ||
"Unknown save error";

}

}

)

.catch(

error => {

saving = false;


statusEl.textContent =
"CONNECTION ERROR";


resultEl.textContent =
error.message;

}

);

}


/* =========================================================
   REF-53 — INITIALIZE
========================================================= */

updateMicButton();

updateReadButton();

updateTextboxMode();

</script>
