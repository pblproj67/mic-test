<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>

<style>

body {
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  max-width: 800px;
  margin: 20px auto;
  padding: 15px;
  text-align: center;

  background: #000;
  color: #fff;
}

h1 {
  font-size: 32px;
}

.control {
  margin: 14px 0;
}

label {
  display: block;
  margin-bottom: 5px;
  font-size: 17px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  max-width: 600px;
  padding: 12px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
  box-sizing: border-box;
}

#driveOptions {
  max-width: 650px;
  margin: auto;
  padding: 15px;

  background: #111;
  color: #fff;

  border: 1px solid #333;
  border-radius: 12px;
}

#micBtn {
  display: block;
  width: 210px;
  height: 210px;
  margin: 25px auto;
  border: none;
  border-radius: 50%;

  background: #0066ff;

  color: white;
  font-size: 82px;
  cursor: pointer;

  box-shadow: 0 0 25px rgba(0,102,255,0.65);
}

#micBtn.listening {
  background: #dc2626;
  box-shadow: 0 0 30px rgba(220,38,38,0.8);
}

#status {
  font-size: 24px;
  font-weight: bold;
  margin: 20px;
}

/*
  TEXT BOX

  Changed from DIV to textarea so you can
  manually edit the transcription before
  reading or saving it.
*/

#heard {
  width: 100%;
  min-height: 250px;
  padding: 20px;

  background: #111;
  color: #fff;

  border: 2px solid #444;
  border-radius: 12px;

  font-size: 24px;
  line-height: 1.5;
  text-align: left;
  box-sizing: border-box;
  resize: vertical;
}

.actionRow {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0;
}

.actionBtn {
  font-size: 18px;
  font-weight: bold;
  padding: 13px 20px;
  border: 1px solid #aaa;
  border-radius: 10px;
  background: white;
  cursor: pointer;
}

#clearBtn {
  background: #fff;
}

#readBtn {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

#stopReadBtn {
  background: #555;
  color: white;
  border-color: #555;
}

#result {
  margin-top: 20px;
  font-size: 21px;
  font-weight: bold;
}

.small {
  font-size: 14px;
  color: #666;
}

</style>
</head>


<body>

<h1>Voice Dictation</h1>


<!-- LANGUAGE -->

<div class="control">

<label>Dictation / Reading Language</label>

<select id="language">

  <option value="gu-IN" selected>
    🇮🇳 ગુજરાતી / Gujarati
  </option>

  <option value="hi-IN">
    🇮🇳 Hindi / Hinglish
  </option>

  <option value="en-IN">
    🇮🇳 English (India)
  </option>

  <option value="en-US">
    🇺🇸 English (US)
  </option>

</select>

</div>


<!-- VOICE -->

<div class="control">

<label>Read Back Voice</label>

<select id="voiceGender">

  <option value="female">
    👩 Female
  </option>

  <option value="male">
    👨 Male
  </option>

</select>

<div class="small">
  Available voices depend on your phone/computer.
</div>

</div>


<!-- SAVE DESTINATION -->

<div class="control">

<label>Save Destination</label>

<select id="destination">

  <option value="drive">
    Google Drive
  </option>

  <option value="local">
    Local Device
  </option>

</select>

</div>


<!-- FILE NAME -->

<div class="control">

<label>File Name</label>

<input
  id="fileName"
  value="Voice Dictation Transcripts"
>

</div>


<!-- DRIVE OPTIONS -->

<div id="driveOptions" class="control">

<label>Google Drive Format</label>

<select id="driveFormat">

  <option value="gdoc">
    Google Doc
  </option>

  <option value="txt">
    TXT File
  </option>

</select>

<br><br>

<label>Google Drive Folder URL</label>

<input
  id="folder"
  placeholder="Leave blank for My Drive"
>

<div class="small">
  Paste Google Drive folder URL or folder ID.
</div>

</div>


<!-- MICROPHONE -->

<button id="micBtn" type="button">
🎤
</button>


<div id="status">
PRESS GREEN TO START
</div>


<!-- EDITABLE TRANSCRIPTION -->

<textarea
  id="heard"
  placeholder="Your transcription will appear here..."
></textarea>


<!-- TEXT CONTROLS -->

<div class="actionRow">

<button
  id="clearBtn"
  class="actionBtn"
  type="button"
>
🗑️ CLEAR
</button>

<button
  id="readBtn"
  class="actionBtn"
  type="button"
>
🔊 READ
</button>

<button
  id="stopReadBtn"
  class="actionBtn"
  type="button"
>
⏹ STOP READING
</button>

</div>


<div id="result">
—
</div>


<script>

/*************************************************
 BACKEND
*************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/*************************************************
 ELEMENTS
*************************************************/

const micBtn =
  document.getElementById("micBtn");

const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");

const languageEl =
  document.getElementById("language");

const voiceGenderEl =
  document.getElementById("voiceGender");

const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");

const clearBtn =
  document.getElementById("clearBtn");

const readBtn =
  document.getElementById("readBtn");

const stopReadBtn =
  document.getElementById("stopReadBtn");


/*************************************************
 STATE
*************************************************/

let recognition = null;

let listening = false;

let stopping = false;

let saving = false;

let finalText = "";

let interimText = "";

let lastFinalRaw = "";

let availableVoices = [];


/*************************************************
 DESTINATION
*************************************************/

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/*************************************************
 NORMALIZE
*************************************************/

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/*************************************************
 FINAL SPEECH / DUPLICATE PROTECTION
*************************************************/

function commitFinalTranscript(newText) {

  newText =
    normalizeText(newText);


  if (!newText) return;


  /*
    Exact duplicate
  */

  if (
    newText === lastFinalRaw
  ) {

    return;

  }


  /*
    Chrome expanded previous phrase.

    Add ONLY the new ending.
  */

  if (
    lastFinalRaw &&
    newText.startsWith(lastFinalRaw)
  ) {

    const extra =
      normalizeText(
        newText.slice(
          lastFinalRaw.length
        )
      );


    if (extra) {

      finalText +=
        (finalText ? " " : "") +
        extra;

    }


    lastFinalRaw =
      newText;


    return;

  }


  /*
    Chrome returned shorter version
    of previous phrase.
  */

  if (
    lastFinalRaw &&
    lastFinalRaw.startsWith(newText)
  ) {

    return;

  }


  /*
    New phrase
  */

  finalText +=
    (finalText ? " " : "") +
    newText;


  lastFinalRaw =
    newText;

}


/*************************************************
 SHOW TRANSCRIPT
*************************************************/

function showTranscript() {

  let display =
    normalizeText(finalText);


  const temp =
    normalizeText(interimText);


  if (temp) {

    display +=
      (display ? " " : "") +
      temp;

  }


  heardEl.value =
    display;

}


/*************************************************
 SPEECH RECOGNITION
*************************************************/

function createRecognizer() {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {

    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );

    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/*************************************************
 RESULTS
*************************************************/

  recognition.onresult =
    function(event) {


      let currentInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const result =
          event.results[i];


        if (
          !result ||
          !result[0]
        ) {

          continue;

        }


        const transcript =
          normalizeText(
            result[0].transcript
          );


        if (!transcript) {

          continue;

        }


        if (
          result.isFinal
        ) {

          commitFinalTranscript(
            transcript
          );

        }


        else {

          if (
            currentInterim
          ) {

            currentInterim +=
              " ";

          }


          currentInterim +=
            transcript;

        }

      }


      interimText =
        currentInterim;


      showTranscript();

    };


/*************************************************
 ERROR
*************************************************/

  recognition.onerror =
    function(event) {


      if (
        event.error === "aborted" &&
        stopping
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;

    };


/*************************************************
 RECOGNITION ENDED
*************************************************/

  recognition.onend =
    function() {


      interimText =
        "";


      /*
        User pressed RED
      */

      if (
        stopping
      ) {


        stopping =
          false;


        listening =
          false;


        updateButton();


        showTranscript();


        /*
          We DO NOT automatically save here.

          This gives you time to:
          EDIT
          READ
          CLEAR
          VERIFY

          Then press SAVE using the button
          created below.
        */

        statusEl.textContent =
          "DICTATION READY";


        return;

      }


      /*
        Chrome automatically stopped.

        Restart recognition.
      */

      if (
        listening
      ) {


        setTimeout(

          function() {


            if (!listening) {
              return;
            }


            try {


              lastFinalRaw =
                "";


              createRecognizer();


              recognition.start();

            }


            catch(error) {

              console.log(
                "Restart error:",
                error
              );

            }

          },

          300

        );

      }

  };


  return true;

}


/*************************************************
 MIC BUTTON DISPLAY
*************************************************/

function updateButton() {

  if (
    listening
  ) {


    micBtn.classList.add(
      "listening"
    );


    statusEl.textContent =
      "LISTENING — PRESS RED TO STOP";


    languageEl.disabled =
      true;


  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    languageEl.disabled =
      false;

  }

}


/*************************************************
 MIC BUTTON
*************************************************/

micBtn.addEventListener(
  "click",
  function() {


    /*
      START
    */

    if (
      !listening
    ) {


      /*
        Stop read-back if currently speaking.
      */

      window.speechSynthesis.cancel();


      finalText =
        "";


      interimText =
        "";


      lastFinalRaw =
        "";


      stopping =
        false;


      heardEl.value =
        "";


      resultEl.textContent =
        "";


      if (
        !createRecognizer()
      ) {

        return;

      }


      try {


        recognition.start();


        listening =
          true;


        updateButton();

      }


      catch(error) {


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }


    /*
      STOP
    */

    stopping =
      true;


    statusEl.textContent =
      "FINISHING...";


    try {

      recognition.stop();

    }


    catch(error) {


      stopping =
        false;


      listening =
        false;


      updateButton();


      statusEl.textContent =
        "DICTATION READY";

    }

  }
);


/*************************************************
 CLEAR BUTTON
*************************************************/

clearBtn.addEventListener(
  "click",
  function() {


    /*
      Don't clear while recording.
    */

    if (
      listening
    ) {

      resultEl.textContent =
        "Stop dictation before clearing.";

      return;

    }


    window.speechSynthesis.cancel();


    finalText =
      "";


    interimText =
      "";


    lastFinalRaw =
      "";


    heardEl.value =
      "";


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS GREEN TO START";

  }
);


/*************************************************
 KEEP FINAL TEXT SYNCED WITH MANUAL EDITS
*************************************************/

heardEl.addEventListener(
  "input",
  function() {

    if (
      !listening
    ) {

      finalText =
        heardEl.value;

      lastFinalRaw =
        "";

    }

  }
);


/*************************************************
 TEXT TO SPEECH VOICES
*************************************************/

function loadVoices() {

  availableVoices =
    window.speechSynthesis
      .getVoices();

}


loadVoices();


if (
  "speechSynthesis" in window
) {

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/*************************************************
 FIND BEST VOICE
*************************************************/

function findVoice(
  language,
  gender
) {

  const lang =
    language.toLowerCase();


  const baseLang =
    lang.split("-")[0];


  /*
    First find voices matching
    selected language.
  */

  let matches =
    availableVoices.filter(
      voice => {

        const vLang =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          vLang === lang ||
          vLang.startsWith(
            baseLang + "-"
          )
        );

      }
    );


  /*
    If device has no exact voice,
    let browser choose default.
  */

  if (
    matches.length === 0
  ) {

    return null;

  }


  /*
    Browser voice objects unfortunately
    don't provide a standard gender field.

    These names help identify many common
    Microsoft/Google/Android voices.
  */

  const femaleHints = [
    "female",
    "woman",
    "zira",
    "heera",
    "kalpana",
    "swara",
    "google हिन्दी",
    "google ગુજરાતી"
  ];


  const maleHints = [
    "male",
    "man",
    "david",
    "ravi",
    "hemant"
  ];


  const hints =
    gender === "male"
      ? maleHints
      : femaleHints;


  for (
    const voice of matches
  ) {


    const name =
      String(
        voice.name || ""
      ).toLowerCase();


    if (
      hints.some(
        hint =>
          name.includes(
            hint.toLowerCase()
          )
      )
    ) {

      return voice;

    }

  }


  /*
    No identifiable gender match.

    Use first compatible voice.
  */

  return matches[0];

}


/*************************************************
 READ BUTTON
*************************************************/

readBtn.addEventListener(
  "click",
  function() {


    if (
      listening
    ) {

      resultEl.textContent =
        "Stop dictation before reading.";

      return;

    }


    const text =
      heardEl.value.trim();


    if (
      !text
    ) {

      resultEl.textContent =
        "Nothing to read.";

      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {

      resultEl.textContent =
        "Text-to-speech is not supported.";

      return;

    }


    /*
      Stop previous reading.
    */

    window.speechSynthesis.cancel();


    loadVoices();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      findVoice(
        languageEl.value,
        voiceGenderEl.value
      );


    if (
      selectedVoice
    ) {

      utterance.voice =
        selectedVoice;

    }


    /*
      Natural defaults
    */

    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    utterance.onstart =
      function() {

        statusEl.textContent =
          "🔊 READING...";

    };


    utterance.onend =
      function() {

        statusEl.textContent =
          "DICTATION READY";

    };


    utterance.onerror =
      function(event) {

        resultEl.textContent =
          "READ ERROR: " +
          event.error;

    };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/*************************************************
 STOP READING
*************************************************/

stopReadBtn.addEventListener(
  "click",
  function() {


    window.speechSynthesis.cancel();


    statusEl.textContent =
      heardEl.value.trim()
        ? "DICTATION READY"
        : "PRESS GREEN TO START";

  }
);


/*************************************************
 ADD SAVE BUTTON
*************************************************/

const saveBtn =
  document.createElement(
    "button"
  );


saveBtn.type =
  "button";


saveBtn.className =
  "actionBtn";


saveBtn.textContent =
  "💾 SAVE";


document
  .querySelector(".actionRow")
  .appendChild(saveBtn);


/*************************************************
 SAVE BUTTON
*************************************************/

saveBtn.addEventListener(
  "click",
  function() {


    if (
      listening
    ) {

      resultEl.textContent =
        "Stop dictation before saving.";

      return;

    }


    window.speechSynthesis.cancel();


    saveDictation();

  }
);


/*************************************************
 SAVE DICTATION
*************************************************/

function saveDictation() {


  if (
    saving
  ) {

    return;

  }


  /*
    IMPORTANT:

    Save what is ACTUALLY in the textbox.

    This means you can manually correct
    words before saving.
  */

  const text =
    heardEl.value.trim();


  if (
    !text
  ) {

    resultEl.textContent =
      "Nothing to save.";

    return;

  }


  if (
    destinationEl.value ===
    "local"
  ) {

    saveLocal(
      text
    );

    return;

  }


  saveGoogleDrive(
    text
  );

}


/*************************************************
 LOCAL TXT
*************************************************/

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {

    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(
      a
    );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/*************************************************
 GOOGLE DRIVE SAVE
*************************************************/

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {
      method: "POST",
      body: data
    }
  )


  .then(
    response =>
      response.json()
  )


  .then(
    data => {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }


      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error;

      }

    }
  )


  .catch(
    error => {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}

</script>

</body>
</html>
