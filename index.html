#heard {

/*
  While listening:

#heard.listeningLock {

/* LIVE VIEW */

}


/* =========================================================
   REF-10 — RESULT
========================================================= */

#result {

  min-height: 24px;

}

}

>

</span>

</span>

     REF-19 — CLEAR / SAVE
===================================================== -->

CLEAR

—
</div>



<script>

/* =========================================================
   REF-20 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-21 — ELEMENTS
========================================================= */

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const voiceSelectEl =
  document.getElementById("voiceSelect");

const testVoiceBtn =
  document.getElementById("testVoiceBtn");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/* =========================================================
   REF-22 — STATE
========================================================= */

let recognition = null;

let listening = false;

let recognitionRunning = false;

let manualStop = false;


/*
  LIVE VIEW

  true:
  textbox follows newest dictation

  false:
  textbox stays frozen,
  recognition continues internally.
*/

let liveView = true;


let saving = false;

let reading = false;


/*
  Everything permanently completed
  in PREVIOUS Chrome recognition sessions.
*/

let committedText = "";


/*
  Current Chrome recognition session
  FINAL text.

  IMPORTANT:
  This gets REPLACED, not repeatedly appended.
*/

let sessionFinalText = "";


/*
  Current unfinished Chrome hypothesis.

  DISPLAY ONLY.
*/

let sessionInterimText = "";


let availableVoices = [];


/*
  Prevent unnecessary DOM updates.
*/

let displayFramePending = false;


/* =========================================================
   REF-23 — DESTINATION
========================================================= */

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/* =========================================================
   REF-24 — NORMALIZE TEXT
========================================================= */

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   REF-25 — COLLAPSE PROGRESSIVE RESULTS

   Chrome on this phone can produce:

   diplomacy

   diplomacy often

   diplomacy often gets

   diplomacy often gets a bad rep

   Those are different versions of the
   SAME phrase.

   Keep only the longest current version.
========================================================= */

function collapseProgressiveParts(parts) {

  const cleaned = [];


  for (
    let i = 0;
    i < parts.length;
    i++
  ) {


    const current =
      normalizeText(
        parts[i]
      );


    if (!current) {
      continue;
    }


    /*
      First phrase.
    */

    if (
      cleaned.length === 0
    ) {


      cleaned.push(
        current
      );


      continue;

    }


    const lastIndex =
      cleaned.length - 1;


    const previous =
      cleaned[lastIndex];


    const currentLower =
      current.toLowerCase();


    const previousLower =
      previous.toLowerCase();


    /*
      Exact duplicate.
    */

    if (
      currentLower ===
      previousLower
    ) {

      continue;

    }


    /*
      Current result is a longer version
      of previous result.

      REPLACE previous.
    */

    if (
      currentLower.startsWith(
        previousLower
      )
    ) {


      cleaned[lastIndex] =
        current;


      continue;

    }


    /*
      Current result is shorter than
      what Chrome already supplied.

      Ignore it.
    */

    if (
      previousLower.startsWith(
        currentLower
      )
    ) {

      continue;

    }


    /*
      Genuinely separate phrase.
    */

    cleaned.push(
      current
    );

  }


  return normalizeText(
    cleaned.join(" ")
  );

}


/* =========================================================
   REF-26 — REBUILD CURRENT CHROME SESSION

   This is the core duplication fix.

   Every recognition event rebuilds the
   entire CURRENT session from event.results.

   Nothing is appended event-by-event.
========================================================= */

function rebuildCurrentSession(results) {


  const finalParts = [];

  const interimParts = [];


  for (
    let i = 0;
    i < results.length;
    i++
  ) {


    const result =
      results[i];


    if (
      !result ||
      !result[0]
    ) {

      continue;

    }


    const text =
      normalizeText(
        result[0].transcript
      );


    if (!text) {
      continue;
    }


    if (
      result.isFinal
    ) {


      finalParts.push(
        text
      );

    }

    else {


      interimParts.push(
        text
      );

    }

  }


  /*
    FINAL:

    collapse progressive duplicates
    and REPLACE current session final text.
  */

  sessionFinalText =
    collapseProgressiveParts(
      finalParts
    );


  /*
    INTERIM:

    normally Chrome provides one changing
    hypothesis, but collapse it too.
  */

  sessionInterimText =
    collapseProgressiveParts(
      interimParts
    );

}


/* =========================================================
   REF-27 — PERMANENT SESSION COMMIT
========================================================= */

function commitCurrentSession() {


  const text =
    normalizeText(
      sessionFinalText
    );


  if (text) {


    committedText +=
      (committedText ? " " : "") +
      text;


    committedText =
      normalizeText(
        committedText
      );

  }


  /*
    Interim is intentionally discarded.

    It was not confirmed.
  */

  sessionFinalText =
    "";


  sessionInterimText =
    "";

}


/* =========================================================
   REF-28 — CURRENT COMPLETE DISPLAY TEXT
========================================================= */

function getCurrentTranscript() {


  let text =
    normalizeText(
      committedText
    );


  const currentFinal =
    normalizeText(
      sessionFinalText
    );


  const currentInterim =
    normalizeText(
      sessionInterimText
    );


  if (currentFinal) {


    text +=
      (text ? " " : "") +
      currentFinal;

  }


  if (currentInterim) {


    text +=
      (text ? " " : "") +
      currentInterim;

  }


  return normalizeText(
    text
  );

}


/* =========================================================
   REF-29 — DISPLAY REFRESH

   requestAnimationFrame keeps recognition
   processing separate from DOM rendering.
========================================================= */

function refreshTranscriptDisplay(
  force = false
) {


  if (
    listening &&
    !liveView &&
    !force
  ) {

    return;

  }


  if (
    displayFramePending &&
    !force
  ) {

    return;

  }


  if (force) {


    displayFramePending =
      false;


    heardEl.value =
      getCurrentTranscript();


    if (
      listening &&
      liveView
    ) {


      heardEl.scrollTop =
        heardEl.scrollHeight;

    }


    return;

  }


  displayFramePending =
    true;


  requestAnimationFrame(
    function() {


      displayFramePending =
        false;


      if (
        listening &&
        !liveView
      ) {

        return;

      }


      heardEl.value =
        getCurrentTranscript();


      if (
        listening &&
        liveView
      ) {


        heardEl.scrollTop =
          heardEl.scrollHeight;

      }

    }
  );

}


/* =========================================================
   REF-30 — TEXTBOX MODE
========================================================= */

function updateTextboxMode() {


  /*
    STOPPED:
    normal edit/select/copy/paste.
  */

  if (!listening) {


    heardEl.readOnly =
      false;


    /*
      Restore mobile keyboard
      for manual editing.
    */

    heardEl.setAttribute(
      "inputmode",
      "text"
    );


    heardEl.classList.remove(
      "listeningLock",
      "liveView",
      "frozenView"
    );


    return;

  }


  /*
    LISTENING:
    no editing,
    no keyboard,
    no selection.
  */

  heardEl.readOnly =
    true;


  heardEl.setAttribute(
    "inputmode",
    "none"
  );


  heardEl.blur();


  heardEl.classList.add(
    "listeningLock"
  );


  if (liveView) {


    heardEl.classList.add(
      "liveView"
    );


    heardEl.classList.remove(
      "frozenView"
    );

  }

  else {


    heardEl.classList.remove(
      "liveView"
    );


    heardEl.classList.add(
      "frozenView"
    );

  }

}


/* =========================================================
   REF-31 — TAP TEXTBOX LIVE/FREEZE

   pointerdown is used directly.

   This both:
   1. prevents Android keyboard
   2. toggles LIVE/FROZEN

   No click/touchstart double handling.
========================================================= */

heardEl.addEventListener(
  "pointerdown",

  function(event) {


    if (!listening) {
      return;
    }


    event.preventDefault();


    heardEl.blur();


    liveView =
      !liveView;


    updateTextboxMode();


    if (liveView) {


      /*
        Immediately show everything accumulated
        while screen was frozen.
      */

      refreshTranscriptDisplay(true);


      heardEl.scrollTop =
        heardEl.scrollHeight;


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN — TAP TEXT TO RESUME";

    }

  }
);


/* =========================================================
   REF-32 — CREATE SPEECH RECOGNIZER
========================================================= */

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {


    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );


    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/* =========================================================
   REF-33 — RECOGNITION START
========================================================= */

  recognition.onstart =
    function() {


      recognitionRunning =
        true;

  };


/* =========================================================
   REF-34 — RECOGNITION RESULT

   VERY IMPORTANT:

   Do NOT append results here.

   Rebuild the CURRENT recognition session
   from Chrome's complete event.results list.
========================================================= */

  recognition.onresult =
    function(event) {


      rebuildCurrentSession(
        event.results
      );


      refreshTranscriptDisplay();

  };


/* =========================================================
   REF-35 — RECOGNITION ERROR
========================================================= */

  recognition.onerror =
    function(event) {


      /*
        Ignore normal abort from STOP.
      */

      if (
        event.error === "aborted" &&
        manualStop
      ) {

        return;

      }


      /*
        Silence is not fatal.
      */

      if (
        event.error === "no-speech"
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;


      /*
        Fatal microphone errors.
      */

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed" ||
        event.error === "audio-capture"
      ) {


        manualStop =
          true;


        listening =
          false;


        recognitionRunning =
          false;


        updateMicButton();


        updateTextboxMode();

      }

  };


/* =========================================================
   REF-36 — RECOGNITION END

   Only confirmed FINAL session text
   becomes permanent.

   Interim is discarded.

   Then restart quickly if user is
   still listening.
========================================================= */

  recognition.onend =
    function() {


      recognitionRunning =
        false;


      /*
        Permanently store this completed
        recognition session.
      */

      commitCurrentSession();


      /*
        USER PRESSED STOP
      */

      if (
        manualStop ||
        !listening
      ) {


        refreshTranscriptDisplay(true);


        return;

      }


      /*
        Chrome ended automatically.

        Start another lightweight session.
      */

      setTimeout(

        function() {


          if (
            !listening ||
            manualStop ||
            recognitionRunning
          ) {

            return;

          }


          startRecognitionSession();

        },

        50

      );

  };


  return true;

}


/* =========================================================
   REF-37 — START RECOGNITION SESSION
========================================================= */

function startRecognitionSession() {


  if (
    !listening ||
    recognitionRunning
  ) {

    return;

  }


  if (
    !createRecognizer()
  ) {


    listening =
      false;


    updateMicButton();


    updateTextboxMode();


    return;

  }


  try {


    recognition.start();

  }


  catch(error) {


    console.log(
      "Recognition start:",
      error
    );

  }

}


/* =========================================================
   REF-38 — MIC BUTTON UI
========================================================= */

function updateMicButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    if (liveView) {


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN";

    }


    languageEl.disabled =
      true;

  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;

  }

}


/* =========================================================
   REF-39 — MIC START / STOP
========================================================= */

micBtn.addEventListener(
  "click",

  function() {


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    if (!listening) {


      /*
        Stop speaker playback first.
      */

      stopReading();


      /*
        Completely fresh dictation.
      */

      committedText =
        "";


      sessionFinalText =
        "";


      sessionInterimText =
        "";


      heardEl.value =
        "";


      heardEl.scrollTop =
        0;


      resultEl.textContent =
        "";


      /*
        Default LIVE VIEW = ON.
      */

      liveView =
        true;


      manualStop =
        false;


      listening =
        true;


      updateMicButton();


      updateTextboxMode();


      startRecognitionSession();


      return;

    }


    /* -----------------------------------------------------
       STOP
    ----------------------------------------------------- */


    /*
      Immediately stop any automatic
      recognition restart.
    */

    manualStop =
      true;


    listening =
      false;


    /*
      UI turns BLUE immediately.
    */

    updateMicButton();


    /*
      Restore normal textbox editing.
    */

    updateTextboxMode();


    /*
      Ask Chrome to finalize current phrase.

      Do NOT manually commit interim here.
    */

    try {


      if (recognition) {


        recognition.stop();

      }

    }


    catch(error) {


      /*
        If Chrome already stopped,
        preserve current confirmed session.
      */

      commitCurrentSession();


      refreshTranscriptDisplay(true);

    }


    statusEl.textContent =
      "DICTATION READY";

  }
);


/* =========================================================
   REF-40 — MANUAL TEXT EDIT
========================================================= */

heardEl.addEventListener(
  "input",

  function() {


    if (!listening) {


      /*
        Once user manually edits,
        textbox becomes the new permanent text.
      */

      committedText =
        heardEl.value;


      sessionFinalText =
        "";


      sessionInterimText =
        "";

    }

  }
);


/* =========================================================
   REF-41 — CLEAR
========================================================= */

clearBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before clearing.";


      return;

    }


    stopReading();


    committedText =
      "";


    sessionFinalText =
      "";


    sessionInterimText =
      "";


    heardEl.value =
      "";


    heardEl.scrollTop =
      0;


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/* =========================================================
   REF-42 — LOAD DEVICE TTS VOICES

   READ ONLY.

   Does not touch microphone.
========================================================= */

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();


  const previousSelection =
    voiceSelectEl.value;


  voiceSelectEl.innerHTML =
    "";


  const selectedLanguage =
    languageEl.value.toLowerCase();


  const baseLanguage =
    selectedLanguage.split("-")[0];


  let matchingVoices =
    availableVoices.filter(
      function(voice) {


        const voiceLanguage =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          voiceLanguage === selectedLanguage ||
          voiceLanguage.startsWith(
            baseLanguage + "-"
          )
        );

      }
    );


  /*
    If no matching language voice,
    display all voices.
  */

  if (
    matchingVoices.length === 0
  ) {


    matchingVoices =
      availableVoices;

  }


  /*
    Browser may initially return no voices.
  */

  if (
    matchingVoices.length === 0
  ) {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Default device voice";


    voiceSelectEl.appendChild(
      option
    );


    return;

  }


  matchingVoices.forEach(
    function(voice) {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        availableVoices.indexOf(
          voice
        );


      let label =
        voice.name +
        " — " +
        voice.lang;


      if (
        voice.default
      ) {


        label +=
          " ★";

      }


      option.textContent =
        label;


      voiceSelectEl.appendChild(
        option
      );

    }
  );


  if (
    previousSelection &&
    [...voiceSelectEl.options]
      .some(
        option =>
          option.value ===
          previousSelection
      )
  ) {


    voiceSelectEl.value =
      previousSelection;

  }

}


/* =========================================================
   REF-43 — VOICE INITIALIZATION
========================================================= */

loadVoices();


if (
  "speechSynthesis"
  in window
) {


  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


languageEl.addEventListener(
  "change",
  loadVoices
);


/* =========================================================
   REF-44 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {


  const index =
    Number(
      voiceSelectEl.value
    );


  if (
    Number.isNaN(index) ||
    !availableVoices[index]
  ) {


    return null;

  }


  return availableVoices[index];

}


/* =========================================================
   REF-45 — TEST VOICE
========================================================= */

testVoiceBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before testing voice.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const language =
      languageEl.value;


    let sample =
      "Hello. This is a sample of this voice.";


    if (
      language === "gu-IN"
    ) {


      sample =
        "નમસ્તે. આ અવાજનો નમૂનો છે.";

    }


    else if (
      language === "hi-IN"
    ) {


      sample =
        "नमस्ते। यह आवाज़ का एक नमूना है।";

    }


    else if (
      language === "en-IN"
    ) {


      sample =
        "Hello. This is a sample of the selected voice.";

    }


    const utterance =
      new SpeechSynthesisUtterance(
        sample
      );


    utterance.lang =
      language;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-46 — READ BUTTON UI
========================================================= */

function updateReadButton() {


  if (reading) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }

  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/* =========================================================
   REF-47 — STOP READING
========================================================= */

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {


    window.speechSynthesis.cancel();

  }


  reading =
    false;


  updateReadButton();

}


/* =========================================================
   REF-48 — READ
========================================================= */

readBtn.addEventListener(
  "click",

  function() {


    /*
      STOP READING
    */

    if (reading) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    /*
      Microphone always has priority.
    */

    if (listening) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    const text =
      heardEl.value.trim();


    if (!text) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading =
          false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

    };


    utterance.onerror =
      function(event) {


        reading =
          false;


        updateReadButton();


        if (
          event.error !== "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

    };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-49 — SAVE BUTTON
========================================================= */

saveBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/* =========================================================
   REF-50 — SAVE
========================================================= */

function saveDictation() {


  if (saving) {
    return;
  }


  const text =
    heardEl.value.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value === "local"
  ) {


    saveLocal(
      text
    );


    return;

  }


  saveGoogleDrive(
    text
  );

}


/* =========================================================
   REF-51 — LOCAL TXT
========================================================= */

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {


    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(
      a
    );


  a.click();


  a.remove();


  setTimeout(
    function() {


      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/* =========================================================
   REF-52 — GOOGLE DRIVE
========================================================= */

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {

      method: "POST",

      body: data

    }
  )


  .then(
    function(response) {


      return response.json();

    }
  )


  .then(
    function(data) {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }

      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error ||
          "Unknown save error";

      }

    }
  )


  .catch(
    function(error) {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}


/* =========================================================
   REF-53 — INITIAL STATE
========================================================= */

updateMicButton();

updateReadButton();

updateTextboxMode();

</script>
