<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Voice Dictation</title>

<style>

* {
  box-sizing: border-box;
}


/* =========================================
   PREVENT UI TEXT SELECTION
   ONLY DICTATION BOX CAN BE SELECTED
========================================= */

body,
button,
label,
select,
option,
input,
h1,
div,
span {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}


/* DICTATION TEXT REMAINS SELECTABLE */

#heard {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}


/* =========================================
   PAGE
========================================= */

body {
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 14px;

  background: #000;
  color: #fff;

  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 10px 0 18px;
}


/* =========================================
   FORM CONTROLS
========================================= */

.control {
  margin: 12px 0;
}

label {
  display: block;
  margin-bottom: 6px;

  font-size: 16px;
  font-weight: bold;
}

select,
input {
  width: 100%;

  padding: 12px;

  font-size: 17px;

  color: #fff;
  background: #181818;

  border: 1px solid #444;
  border-radius: 12px;
}


/* =========================================
   GOOGLE DRIVE
========================================= */

#driveOptions {
  padding: 14px;

  background: #111;

  border: 1px solid #333;
  border-radius: 14px;
}


/* =========================================
   MAIN BUTTONS
========================================= */

.mainButton {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 14px;

  width: 100%;
  height: 66px;

  margin: 15px 0;

  border: none;
  border-radius: 16px;

  color: #fff;

  font-size: 23px;
  font-weight: 700;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}


/* READY = BLUE */

#micBtn,
#readBtn {
  background: #0866ff;
}


/* ACTIVE = RED */

#micBtn.listening,
#readBtn.reading {
  background: #d71920;
}


.buttonIcon {
  font-size: 28px;
}


/* =========================================
   STATUS
========================================= */

#status {
  margin: 10px 0 14px;

  min-height: 25px;

  font-size: 19px;
  font-weight: bold;
}


/* =========================================
   DICTATION TEXTBOX
========================================= */

#heard {
  width: 100%;
  min-height: 260px;

  padding: 16px;

  color: #fff;
  background: #101010;

  border: 2px solid #333;
  border-radius: 14px;

  font-size: 22px;
  line-height: 1.5;

  resize: vertical;

  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}


/* =========================================
   CLEAR + SAVE
========================================= */

.smallButtons {
  display: flex;

  gap: 10px;

  margin: 14px 0;
}

.smallButton {
  flex: 1;

  min-height: 52px;

  border: 1px solid #444;
  border-radius: 13px;

  color: #fff;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}


#clearBtn {
  background: #333;
}


#saveBtn {
  background: #16803a;
  border-color: #16803a;
}


/* =========================================
   RESULT
========================================= */

#result {
  margin: 15px 0 30px;

  min-height: 24px;

  font-size: 17px;
  font-weight: bold;
}


.small {
  margin-top: 6px;

  font-size: 13px;

  color: #aaa;
}

</style>

</head>


<body>


<h1>Voice Dictation</h1>

Language

Read Voice

     SAVE DESTINATION

<div class="control">

Save Destination
</label>

<!-- =========================================

========================================= -->

<div class="control">

<label>
File Name
</label>

<input
  id="fileName"

>

<!-- =========================================
     GOOGLE DRIVE OPTIONS
========================================= -->

<div id="driveOptions">

<label>
Google Drive Format
</label>

<select id="driveFormat">

  <option value="gdoc">
    Google Doc
  </option>

  <option value="txt">
    TXT File
  </option>

</select>


<br><br>


<label>
Google Drive Folder URL
</label>

<input
  id="folder"
  placeholder="Leave blank for My Drive"
>


<div class="small">
Paste Google Drive folder URL or folder ID.
</div>

</div>


<!-- =========================================
     LISTEN BUTTON
========================================= -->

<button
  id="micBtn"
  class="mainButton"
  type="button"
>

<span
  id="micIcon"
  class="buttonIcon"
>
🎙
</span>

<span id="micText">
LISTEN
</span>

</button>

PRESS BLUE TO LISTEN
</div>


<!-- =========================================
     DICTATION TEXTBOX
========================================= -->

<textarea
  id="heard"
  placeholder="Your transcription will appear here..."
></textarea>


<!-- =========================================
     READ BUTTON
========================================= -->

<button
  id="readBtn"
  class="mainButton"
  type="button"
>

<span
  id="readIcon"
  class="buttonIcon"
>
▶
</span>

<span id="readText">
READ
</span>

</button>


<!-- =========================================
     CLEAR + SAVE
========================================= -->

<div class="smallButtons">

<button
  id="clearBtn"
  class="smallButton"
  type="button"
>
CLEAR
</button>


<button
  id="saveBtn"
  class="smallButton"
  type="button"
>
💾 SAVE
</button>

</div>


<div id="result">
—
</div>



<script>

/*************************************************
 BACKEND
*************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/*************************************************
 ELEMENTS
*************************************************/

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");

const voiceGenderEl =
  document.getElementById("voiceGender");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/*************************************************
 STATE
*************************************************/

let recognition = null;

let listening = false;

let shouldRestart = false;

let saving = false;

let reading = false;


let finalText = "";

let interimText = "";

let lastFinalRaw = "";

let availableVoices = [];


/*************************************************
 SAVE DESTINATION
*************************************************/

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/*************************************************
 NORMALIZE TEXT
*************************************************/

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/*************************************************
 DUPLICATE PROTECTION
*************************************************/

function commitFinalTranscript(newText) {


  newText =
    normalizeText(newText);


  if (!newText) {
    return;
  }


  /*
    EXACT DUPLICATE
  */

  if (
    newText === lastFinalRaw
  ) {

    return;

  }


  /*
    PROGRESSIVELY LONGER RESULT

    Add only the new ending.
  */

  if (
    lastFinalRaw &&
    newText.startsWith(lastFinalRaw)
  ) {


    const extra =
      normalizeText(
        newText.slice(
          lastFinalRaw.length
        )
      );


    if (extra) {


      finalText +=
        (finalText ? " " : "") +
        extra;

    }


    lastFinalRaw =
      newText;


    return;

  }


  /*
    SHORTER DUPLICATE
  */

  if (
    lastFinalRaw &&
    lastFinalRaw.startsWith(newText)
  ) {

    return;

  }


  /*
    NEW PHRASE
  */

  finalText +=
    (finalText ? " " : "") +
    newText;


  lastFinalRaw =
    newText;

}


/*************************************************
 DISPLAY TRANSCRIPT
*************************************************/

function showTranscript() {


  let display =
    normalizeText(finalText);


  const temp =
    normalizeText(interimText);


  if (temp) {


    display +=
      (display ? " " : "") +
      temp;

  }


  heardEl.value =
    display;

}


/*************************************************
 CREATE SPEECH RECOGNITION
*************************************************/

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {


    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );


    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/*************************************************
 SPEECH RESULT
*************************************************/

  recognition.onresult =
    function(event) {


      let currentInterim =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const result =
          event.results[i];


        if (
          !result ||
          !result[0]
        ) {

          continue;

        }


        const transcript =
          normalizeText(
            result[0].transcript
          );


        if (!transcript) {

          continue;

        }


        if (
          result.isFinal
        ) {


          commitFinalTranscript(
            transcript
          );

        }


        else {


          if (
            currentInterim
          ) {


            currentInterim +=
              " ";

          }


          currentInterim +=
            transcript;

        }

      }


      /*
        REPLACE INTERIM TEXT.
        NEVER APPEND IT.
      */

      interimText =
        currentInterim;


      showTranscript();

    };


/*************************************************
 SPEECH ERROR
*************************************************/

  recognition.onerror =
    function(event) {


      /*
        Ignore normal abort after STOP.
      */

      if (
        event.error === "aborted" &&
        !shouldRestart
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;


      /*
        Serious errors stop recognition.
      */

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed" ||
        event.error === "audio-capture"
      ) {


        shouldRestart =
          false;


        listening =
          false;


        updateMicButton();

      }

    };


/*************************************************
 RECOGNITION ENDED
*************************************************/

  recognition.onend =
    function() {


      /*
        User stopped.

        DO NOT RESTART.
      */

      if (
        !shouldRestart ||
        !listening
      ) {


        interimText =
          "";


        showTranscript();


        return;

      }


      /*
        Chrome may stop during silence.

        Restart ONLY if the user still
        wants the microphone active.
      */

      setTimeout(

        function() {


          /*
            Check again to prevent a
            STOP / restart race.
          */

          if (
            !shouldRestart ||
            !listening
          ) {

            return;

          }


          try {


            lastFinalRaw =
              "";


            createRecognizer();


            recognition.start();

          }


          catch(error) {


            console.log(
              "Recognition restart:",
              error
            );

          }

        },

        250

      );

  };


  return true;

}


/*************************************************
 MIC BUTTON DISPLAY
*************************************************/

function updateMicButton() {


  if (
    listening
  ) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    statusEl.textContent =
      "LISTENING...";


    languageEl.disabled =
      true;

  }


  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;

  }

}


/*************************************************
 MIC BUTTON
*************************************************/

micBtn.addEventListener(
  "click",

  function() {


    /*********************************************
     START LISTENING
    *********************************************/

    if (
      !listening
    ) {


      /*
        Stop read-back first.
      */

      stopReading();


      /*
        Fresh dictation.
      */

      finalText =
        "";


      interimText =
        "";


      lastFinalRaw =
        "";


      heardEl.value =
        "";


      resultEl.textContent =
        "";


      shouldRestart =
        true;


      if (
        !createRecognizer()
      ) {


        shouldRestart =
          false;


        return;

      }


      try {


        /*
          Change state first.
        */

        listening =
          true;


        updateMicButton();


        /*
          Then start Chrome recognition.
        */

        recognition.start();

      }


      catch(error) {


        listening =
          false;


        shouldRestart =
          false;


        updateMicButton();


        resultEl.textContent =
          "Could not start microphone: " +
          error.message;

      }


      return;

    }


    /*********************************************
     STOP LISTENING
    *********************************************/


    /*
      FIRST prevent automatic restart.
    */

    shouldRestart =
      false;


    /*
      SECOND change app state.
    */

    listening =
      false;


    /*
      THIRD immediately change RED to BLUE.
    */

    updateMicButton();


    statusEl.textContent =
      "DICTATION READY";


    /*
      Remove temporary unconfirmed words.
    */

    interimText =
      "";


    showTranscript();


    /*
      LAST tell Chrome to stop.
    */

    try {


      if (
        recognition
      ) {


        recognition.stop();

      }

    }


    catch(error) {


      console.log(
        "Stop:",
        error
      );

    }

  }
);


/*************************************************
 MANUAL TEXT EDITING
*************************************************/

heardEl.addEventListener(
  "input",

  function() {


    if (
      !listening
    ) {


      finalText =
        heardEl.value;


      lastFinalRaw =
        "";

    }

  }
);


/*************************************************
 CLEAR
*************************************************/

clearBtn.addEventListener(
  "click",

  function() {


    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before clearing.";


      return;

    }


    stopReading();


    finalText =
      "";


    interimText =
      "";


    lastFinalRaw =
      "";


    heardEl.value =
      "";


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/*************************************************
 LOAD SPEECH VOICES
*************************************************/

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();

}


loadVoices();


if (
  "speechSynthesis"
  in window
) {


  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/*************************************************
 FIND READ VOICE
*************************************************/

function findVoice(
  language,
  gender
) {


  const lang =
    language.toLowerCase();


  const baseLang =
    lang.split("-")[0];


  const matches =
    availableVoices.filter(
      function(voice) {


        const voiceLanguage =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          voiceLanguage === lang ||
          voiceLanguage.startsWith(
            baseLang + "-"
          )
        );

      }
    );


  if (
    matches.length === 0
  ) {


    return null;

  }


  const femaleHints = [

    "female",
    "woman",
    "zira",
    "heera",
    "kalpana",
    "swara"

  ];


  const maleHints = [

    "male",
    "man",
    "david",
    "ravi",
    "hemant"

  ];


  const hints =
    gender === "male"
      ? maleHints
      : femaleHints;


  for (
    const voice of matches
  ) {


    const name =
      String(
        voice.name || ""
      ).toLowerCase();


    if (
      hints.some(
        function(hint) {


          return name.includes(
            hint
          );

        }
      )
    ) {


      return voice;

    }

  }


  return matches[0];

}


/*************************************************
 READ BUTTON DISPLAY
*************************************************/

function updateReadButton() {


  if (
    reading
  ) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }


  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/*************************************************
 STOP READING
*************************************************/

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {


    window.speechSynthesis.cancel();

  }


  reading =
    false;


  updateReadButton();

}


/*************************************************
 READ / STOP READING
*************************************************/

readBtn.addEventListener(
  "click",

  function() {


    /*********************************************
     STOP READING
    *********************************************/

    if (
      reading
    ) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    /*********************************************
     DON'T READ WHILE LISTENING
    *********************************************/

    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    const text =
      heardEl.value.trim();


    if (
      !text
    ) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    loadVoices();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      findVoice(
        languageEl.value,
        voiceGenderEl.value
      );


    if (
      selectedVoice
    ) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      1.0;


    utterance.pitch =
      1.0;


    utterance.volume =
      1.0;


    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading =
          false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

    };


    utterance.onerror =
      function(event) {


        reading =
          false;


        updateReadButton();


        if (
          event.error !==
          "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

    };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/*************************************************
 SAVE BUTTON
*************************************************/

saveBtn.addEventListener(
  "click",

  function() {


    if (
      listening
    ) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/*************************************************
 SAVE DICTATION
*************************************************/

function saveDictation() {


  if (
    saving
  ) {

    return;

  }


  /*
    Save exactly what is in textbox.
  */

  const text =
    heardEl.value.trim();


  if (
    !text
  ) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value ===
    "local"
  ) {


    saveLocal(
      text
    );


    return;

  }


  saveGoogleDrive(
    text
  );

}


/*************************************************
 SAVE LOCAL TXT
*************************************************/

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {


    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(
      a
    );


  a.click();


  a.remove();


  setTimeout(
    function() {


      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/*************************************************
 SAVE GOOGLE DRIVE
*************************************************/

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {

      method:
        "POST",

      body:
        data

    }
  )


  .then(
    function(response) {


      return response.json();

    }
  )


  .then(
    function(data) {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }


      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error ||
          "Unknown save error";

      }

    }
  )


  .catch(
    function(error) {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}

updateMicButton();

updateReadButton();

</script>
