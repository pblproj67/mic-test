}

body,

select,

    system-ui,

/* =========================================================

/* BLUE READY STATE */

/* RED ACTIVE STATE */

/* =========================================================

/* =========================================================
   REF-07 — DICTATION TEXTBOX
========================================================= */

#heard {
  width: 100%;

  height: 320px;

  padding: 16px;

  color: #fff;

  background: #101010;

  border: 2px solid #333;

  border-radius: 14px;

  font-size: 22px;

  line-height: 1.5;

  resize: none;

  overflow-y: scroll;

  scrollbar-width: auto;

  /*
    When microphone is OFF:
    normal selection/editing is allowed.
  */

  -webkit-user-select: text;
  user-select: text;

  -webkit-touch-callout: default;
}


/*
  WHILE LISTENING:

  No text selection.
  Tapping the box toggles
  LIVE VIEW / FROZEN VIEW.
*/

#heard.listeningLock {
  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;

  caret-color: transparent;

  cursor: pointer;
}


/*
  LIVE VIEW
*/

#heard.liveView {
  border-color: #16803a;
}


/*
  FROZEN VIEW
*/

}


/* =========================================================

.smallButtons {

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}

#clearBtn {

}

#saveBtn {
  background: #16803a;

  border-color: #16803a;
}


/* =========================================================
   REF-09 — RESULT
========================================================= */

#result {
  margin: 15px 0 30px;

  min-height: 24px;

  font-size: 17px;
  font-weight: bold;
}

.small {
  margin-top: 6px;

  font-size: 13px;

  color: #aaa;
}

</style>

===================================================== -->

<script>

/* =========================================================
   REF-19 — BACKEND
========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwxxrUK9g3fkAkXGiUg4xvvKke4NEUhMjRSwK-EAGzGPTmu4_IVfK7h6nnkuu1qvr_DmA/exec";


/* =========================================================
   REF-20 — ELEMENTS
========================================================= */

const micBtn =
  document.getElementById("micBtn");

const micIcon =
  document.getElementById("micIcon");

const micText =
  document.getElementById("micText");


const readBtn =
  document.getElementById("readBtn");

const readIcon =
  document.getElementById("readIcon");

const readText =
  document.getElementById("readText");


const voiceSelectEl =
  document.getElementById("voiceSelect");

const testVoiceBtn =
  document.getElementById("testVoiceBtn");


const statusEl =
  document.getElementById("status");

const heardEl =
  document.getElementById("heard");

const resultEl =
  document.getElementById("result");


const languageEl =
  document.getElementById("language");


const destinationEl =
  document.getElementById("destination");

const driveOptionsEl =
  document.getElementById("driveOptions");

const driveFormatEl =
  document.getElementById("driveFormat");

const fileNameEl =
  document.getElementById("fileName");

const folderEl =
  document.getElementById("folder");


const clearBtn =
  document.getElementById("clearBtn");

const saveBtn =
  document.getElementById("saveBtn");


/* =========================================================
   REF-21 — STATE
========================================================= */

let recognition = null;


/*
  TRUE while user wants microphone running.
*/

let listening = false;


/*
  TRUE when Chrome is actually inside
  a recognition session.
*/

let recognitionRunning = false;


/*
  User pressed STOP.
*/

let manualStop = false;


/*
  LIVE VIEW:

  true  = textbox updates and follows text
  false = textbox display remains frozen

  Recognition continues either way.
*/

let liveView = true;


let saving = false;

let reading = false;


/*
  Text permanently preserved across
  Chrome recognition restarts.
*/

let committedText = "";


/*
  Current Chrome recognition-session
  confirmed text.
*/

let sessionFinalText = "";


/*
  Current temporary / interim text.
*/

let sessionInterimText = "";


/*
  Available TTS voices.
*/

let availableVoices = [];


/* =========================================================
   REF-22 — SAVE DESTINATION UI
========================================================= */

destinationEl.addEventListener(
  "change",
  updateDestination
);


function updateDestination() {

  driveOptionsEl.style.display =
    destinationEl.value === "drive"
      ? "block"
      : "none";

}


updateDestination();


/* =========================================================
   REF-23 — NORMALIZE TEXT
========================================================= */

function normalizeText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   REF-24 — SMART TEXT MERGE

   Prevents repeated words across Chrome session restarts.

   Example:

   Existing:
   "Alexander sent his ambassador"

   New:
   "his ambassador to India"

   Result:
   "Alexander sent his ambassador to India"
========================================================= */

function mergeWithOverlap(base, addition) {

  base =
    normalizeText(base);


  addition =
    normalizeText(addition);


  if (!addition) {
    return base;
  }


  if (!base) {
    return addition;
  }


  /*
    Exact duplicate
  */

  if (base === addition) {
    return base;
  }


  /*
    Entire new phrase already contained
    at the end.
  */

  if (
    base.endsWith(addition)
  ) {

    return base;

  }


  const baseWords =
    base.split(" ");


  const addWords =
    addition.split(" ");


  /*
    Compare up to 20 words at the boundary.
  */

  const maxOverlap =
    Math.min(
      20,
      baseWords.length,
      addWords.length
    );


  for (
    let size = maxOverlap;
    size >= 1;
    size--
  ) {


    const endOfBase =
      baseWords
        .slice(
          baseWords.length - size
        )
        .join(" ")
        .toLowerCase();


    const startOfAddition =
      addWords
        .slice(
          0,
          size
        )
        .join(" ")
        .toLowerCase();


    if (
      endOfBase ===
      startOfAddition
    ) {


      const remainder =
        addWords
          .slice(size)
          .join(" ");


      if (!remainder) {
        return base;
      }


      return normalizeText(
        base +
        " " +
        remainder
      );

    }

  }


  /*
    No overlap.
    This is genuinely new speech.
  */

  return normalizeText(
    base +
    " " +
    addition
  );

}


/* =========================================================
   REF-25 — CURRENT FULL TRANSCRIPT
========================================================= */

function getCurrentTranscript(
  includeInterim = true
) {

  let text =
    committedText;


  text =
    mergeWithOverlap(
      text,
      sessionFinalText
    );


  if (
    includeInterim &&
    sessionInterimText
  ) {


    text =
      mergeWithOverlap(
        text,
        sessionInterimText
      );

  }


  return normalizeText(
    text
  );

}


/* =========================================================
   REF-26 — UPDATE TEXTBOX DISPLAY
========================================================= */

function refreshTranscriptDisplay(
  force = false
) {


  /*
    While frozen, recognition continues
    but textbox stays unchanged.
  */

  if (
    listening &&
    !liveView &&
    !force
  ) {

    return;

  }


  heardEl.value =
    getCurrentTranscript(true);


  /*
    Follow newest words only while
    LIVE VIEW is active.
  */

  if (
    listening &&
    liveView
  ) {


    heardEl.scrollTop =
      heardEl.scrollHeight;

  }

}


/* =========================================================
   REF-27 — TEXTBOX LIVE / FREEZE MODE
========================================================= */

function updateTextboxMode() {


  /*
    NOT LISTENING:

    Textbox is normal editable text.
  */

  if (!listening) {


    heardEl.readOnly =
      false;


    heardEl.classList.remove(
      "listeningLock"
    );


    heardEl.classList.remove(
      "liveView"
    );


    heardEl.classList.remove(
      "frozenView"
    );


    return;

  }


  /*
    LISTENING:

    Disable editing/selection.
  */

  heardEl.readOnly =
    true;


  heardEl.classList.add(
    "listeningLock"
  );


  if (liveView) {


    heardEl.classList.add(
      "liveView"
    );


    heardEl.classList.remove(
      "frozenView"
    );

  }

  else {


    heardEl.classList.remove(
      "liveView"
    );


    heardEl.classList.add(
      "frozenView"
    );

  }

}


/* =========================================================
   REF-28 — TAP TEXTBOX TO LIVE / FREEZE
========================================================= */

heardEl.addEventListener(
  "click",

  function(event) {


    if (!listening) {
      return;
    }


    /*
      Text selection is disabled while listening.

      A tap now means:
      LIVE <-> FREEZE
    */

    event.preventDefault();


    heardEl.blur();


    liveView =
      !liveView;


    updateTextboxMode();


    if (liveView) {


      /*
        Immediately catch up with everything
        recognized while display was frozen.
      */

      refreshTranscriptDisplay(true);


      heardEl.scrollTop =
        heardEl.scrollHeight;


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN — TAP TEXT TO RESUME";

    }

  }
);


/* =========================================================
   REF-29 — BUILD CURRENT CHROME SESSION TEXT

   IMPORTANT RELIABILITY CHANGE:

   Instead of incrementally appending each event,
   rebuild the complete current Chrome session
   from event.results every time.

   This prevents progressive-result repetition
   and avoids dropping revised phrases.
========================================================= */

function rebuildCurrentSession(results) {

  let finals = [];

  let interim = [];


  for (
    let i = 0;
    i < results.length;
    i++
  ) {


    const result =
      results[i];


    if (
      !result ||
      !result[0]
    ) {

      continue;

    }


    const text =
      normalizeText(
        result[0].transcript
      );


    if (!text) {
      continue;
    }


    if (
      result.isFinal
    ) {


      finals.push(text);

    }

    else {


      interim.push(text);

    }

  }


  /*
    Completely REPLACE current session values.

    Do not repeatedly append Chrome's
    changing interim hypotheses.
  */

  sessionFinalText =
    normalizeText(
      finals.join(" ")
    );


  sessionInterimText =
    normalizeText(
      interim.join(" ")
    );

}


/* =========================================================
   REF-30 — COMMIT CURRENT SESSION

   Used when Chrome ends recognition.

   We preserve BOTH:
   confirmed final speech
   and any last interim phrase.

   This favors NOT LOSING WORDS.
========================================================= */

function commitCurrentSession(
  includeInterim = true
) {


  let sessionText =
    sessionFinalText;


  if (
    includeInterim &&
    sessionInterimText
  ) {


    sessionText =
      mergeWithOverlap(
        sessionText,
        sessionInterimText
      );

  }


  committedText =
    mergeWithOverlap(
      committedText,
      sessionText
    );


  sessionFinalText =
    "";


  sessionInterimText =
    "";

}


/* =========================================================
   REF-31 — CREATE SPEECH RECOGNIZER
========================================================= */

function createRecognizer() {


  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SR) {


    alert(
      "Speech recognition is not supported. Use Chrome or Edge."
    );


    return false;

  }


  recognition =
    new SR();


  recognition.lang =
    languageEl.value;


  /*
    Let Chrome keep recognition active
    as long as it supports.
  */

  recognition.continuous =
    true;


  /*
    We keep interim enabled for live viewing,
    but interim is NOT repeatedly appended.
  */

  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


/* =========================================================
   REF-32 — RECOGNITION START
========================================================= */

  recognition.onstart =
    function() {


      recognitionRunning =
        true;


      if (
        listening &&
        liveView
      ) {


        statusEl.textContent =
          "LISTENING — LIVE VIEW";

      }

    };


/* =========================================================
   REF-33 — RECOGNITION RESULT
========================================================= */

  recognition.onresult =
    function(event) {


      /*
        Rebuild entire current Chrome
        recognition session.

        This is the key reliability change.
      */

      rebuildCurrentSession(
        event.results
      );


      /*
        Recognition continues even if
        textbox display is frozen.
      */

      refreshTranscriptDisplay();

    };


/* =========================================================
   REF-34 — RECOGNITION ERROR
========================================================= */

  recognition.onerror =
    function(event) {


      /*
        Normal manual STOP may generate
        aborted error.
      */

      if (
        event.error === "aborted" &&
        manualStop
      ) {

        return;

      }


      /*
        no-speech is not fatal.

        Chrome will normally end and
        we restart quickly.
      */

      if (
        event.error === "no-speech"
      ) {

        return;

      }


      resultEl.textContent =
        "MIC ERROR: " +
        event.error;


      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed" ||
        event.error === "audio-capture"
      ) {


        listening =
          false;


        manualStop =
          true;


        recognitionRunning =
          false;


        updateMicButton();


        updateTextboxMode();

      }

    };


/* =========================================================
   REF-35 — RECOGNITION ENDED

   Critical reliability behavior:

   1. Preserve current session.
   2. If user did NOT stop, restart quickly.
   3. Only 60ms restart gap.
========================================================= */

  recognition.onend =
    function() {


      recognitionRunning =
        false;


      /*
        Preserve everything Chrome heard
        before this recognition session ended.
      */

      commitCurrentSession(true);


      /*
        USER PRESSED STOP
      */

      if (
        manualStop ||
        !listening
      ) {


        refreshTranscriptDisplay(true);


        return;

      }


      /*
        CHROME STOPPED AUTOMATICALLY.

        Restart quickly to reduce the
        dead gap where words can be missed.
      */

      setTimeout(

        function() {


          if (
            !listening ||
            manualStop
          ) {

            return;

          }


          startRecognitionSession();

        },

        60

      );

  };


  return true;

}


/* =========================================================
   REF-36 — START RECOGNITION SESSION
========================================================= */

function startRecognitionSession() {


  if (
    !listening
  ) {

    return;

  }


  if (
    recognitionRunning
  ) {

    return;

  }


  if (
    !createRecognizer()
  ) {


    listening =
      false;


    updateMicButton();


    updateTextboxMode();


    return;

  }


  try {


    recognition.start();

  }


  catch(error) {


    console.log(
      "Recognition start:",
      error
    );

  }

}


/* =========================================================
   REF-37 — MIC BUTTON DISPLAY
========================================================= */

function updateMicButton() {


  if (listening) {


    micBtn.classList.add(
      "listening"
    );


    micIcon.textContent =
      "■";


    micText.textContent =
      "STOP LISTENING";


    if (liveView) {


      statusEl.textContent =
        "LISTENING — LIVE VIEW";

    }

    else {


      statusEl.textContent =
        "LISTENING — VIEW FROZEN";

    }


    languageEl.disabled =
      true;

  }

  else {


    micBtn.classList.remove(
      "listening"
    );


    micIcon.textContent =
      "🎙";


    micText.textContent =
      "LISTEN";


    languageEl.disabled =
      false;

  }

}


/* =========================================================
   REF-38 — MIC BUTTON START / STOP
========================================================= */

micBtn.addEventListener(
  "click",

  function() {


    /* -----------------------------------------------------
       START LISTENING
    ----------------------------------------------------- */

    if (!listening) {


      /*
        Speaker playback must stop before
        opening microphone.
      */

      stopReading();


      /*
        Fresh dictation session.
      */

      committedText =
        "";


      sessionFinalText =
        "";


      sessionInterimText =
        "";


      heardEl.value =
        "";


      heardEl.scrollTop =
        0;


      resultEl.textContent =
        "";


      /*
        LIVE VIEW defaults ON every time
        dictation starts.
      */

      liveView =
        true;


      manualStop =
        false;


      listening =
        true;


      updateMicButton();


      updateTextboxMode();


      startRecognitionSession();


      return;

    }


    /* -----------------------------------------------------
       STOP LISTENING
    ----------------------------------------------------- */


    /*
      Immediately tell all logic:
      USER HAS STOPPED.
    */

    manualStop =
      true;


    listening =
      false;


    /*
      Preserve everything currently available
      BEFORE shutting recognition down.
    */

    commitCurrentSession(true);


    /*
      Button changes RED -> BLUE immediately.
    */

    updateMicButton();


    /*
      Re-enable textbox editing / selection.
    */

    updateTextboxMode();


    /*
      Force full latest transcript into textbox,
      even if LIVE VIEW was frozen.
    */

    refreshTranscriptDisplay(true);


    statusEl.textContent =
      "DICTATION READY";


    try {


      if (recognition) {


        recognition.stop();

      }

    }


    catch(error) {


      console.log(
        "Stop recognition:",
        error
      );

    }

  }
);


/* =========================================================
   REF-39 — MANUAL TEXT EDITING
========================================================= */

heardEl.addEventListener(
  "input",

  function() {


    /*
      Editing is available only while
      microphone is stopped.
    */

    if (!listening) {


      committedText =
        heardEl.value;


      sessionFinalText =
        "";


      sessionInterimText =
        "";

    }

  }
);


/* =========================================================
   REF-40 — CLEAR
========================================================= */

clearBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before clearing.";


      return;

    }


    stopReading();


    committedText =
      "";


    sessionFinalText =
      "";


    sessionInterimText =
      "";


    heardEl.value =
      "";


    heardEl.scrollTop =
      0;


    resultEl.textContent =
      "Text cleared";


    statusEl.textContent =
      "PRESS BLUE TO LISTEN";

  }
);


/* =========================================================
   REF-41 — LOAD DEVICE TTS VOICES

   READ side only.
   Does NOT touch microphone.
========================================================= */

function loadVoices() {


  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  availableVoices =
    window.speechSynthesis
      .getVoices();


  const previousSelection =
    voiceSelectEl.value;


  voiceSelectEl.innerHTML =
    "";


  const selectedLanguage =
    languageEl.value.toLowerCase();


  const baseLanguage =
    selectedLanguage.split("-")[0];


  let matchingVoices =
    availableVoices.filter(
      function(voice) {


        const voiceLanguage =
          String(
            voice.lang || ""
          ).toLowerCase();


        return (
          voiceLanguage === selectedLanguage ||
          voiceLanguage.startsWith(
            baseLanguage + "-"
          )
        );

      }
    );


  /*
    If no matching language voices,
    show all available voices.
  */

  if (
    matchingVoices.length === 0
  ) {


    matchingVoices =
      availableVoices;

  }


  if (
    matchingVoices.length === 0
  ) {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Default device voice";


    voiceSelectEl.appendChild(
      option
    );


    return;

  }


  matchingVoices.forEach(
    function(voice) {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        availableVoices.indexOf(
          voice
        );


      let label =
        voice.name +
        " — " +
        voice.lang;


      if (
        voice.default
      ) {


        label +=
          " ★";

      }


      option.textContent =
        label;


      voiceSelectEl.appendChild(
        option
      );

    }
  );


  if (
    previousSelection &&
    [...voiceSelectEl.options]
      .some(
        option =>
          option.value ===
          previousSelection
      )
  ) {


    voiceSelectEl.value =
      previousSelection;

  }

}


/* =========================================================
   REF-42 — INITIAL VOICE LOAD
========================================================= */

loadVoices();


if (
  "speechSynthesis"
  in window
) {


  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


languageEl.addEventListener(
  "change",
  loadVoices
);


/* =========================================================
   REF-43 — SELECTED VOICE
========================================================= */

function getSelectedVoice() {


  const index =
    Number(
      voiceSelectEl.value
    );


  if (
    Number.isNaN(index) ||
    !availableVoices[index]
  ) {


    return null;

  }


  return availableVoices[index];

}


/* =========================================================
   REF-44 — TEST VOICE
========================================================= */

testVoiceBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before testing voice.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const language =
      languageEl.value;


    let sample =
      "Hello. This is a sample of this voice.";


    if (
      language === "gu-IN"
    ) {


      sample =
        "નમસ્તે. આ અવાજનો નમૂનો છે.";

    }


    else if (
      language === "hi-IN"
    ) {


      sample =
        "नमस्ते। यह आवाज़ का एक नमूना है।";

    }


    else if (
      language === "en-IN"
    ) {


      sample =
        "Hello. This is a sample of the selected voice.";

    }


    const utterance =
      new SpeechSynthesisUtterance(
        sample
      );


    utterance.lang =
      language;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-45 — READ BUTTON DISPLAY
========================================================= */

function updateReadButton() {


  if (reading) {


    readBtn.classList.add(
      "reading"
    );


    readIcon.textContent =
      "■";


    readText.textContent =
      "STOP READING";

  }

  else {


    readBtn.classList.remove(
      "reading"
    );


    readIcon.textContent =
      "▶";


    readText.textContent =
      "READ";

  }

}


/* =========================================================
   REF-46 — STOP READING
========================================================= */

function stopReading() {


  if (
    "speechSynthesis"
    in window
  ) {


    window.speechSynthesis.cancel();

  }


  reading =
    false;


  updateReadButton();

}


/* =========================================================
   REF-47 — READ BUTTON
========================================================= */

readBtn.addEventListener(
  "click",

  function() {


    /*
      STOP READING
    */

    if (reading) {


      stopReading();


      statusEl.textContent =
        heardEl.value.trim()
          ? "DICTATION READY"
          : "PRESS BLUE TO LISTEN";


      return;

    }


    /*
      Microphone always has priority.
    */

    if (listening) {


      resultEl.textContent =
        "Stop listening before reading.";


      return;

    }


    const text =
      heardEl.value.trim();


    if (!text) {


      resultEl.textContent =
        "Nothing to read.";


      return;

    }


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {


      resultEl.textContent =
        "Text-to-speech is not supported.";


      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      languageEl.value;


    const selectedVoice =
      getSelectedVoice();


    if (selectedVoice) {


      utterance.voice =
        selectedVoice;

    }


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    utterance.volume =
      1;


    reading =
      true;


    updateReadButton();


    statusEl.textContent =
      "READING...";


    utterance.onend =
      function() {


        reading =
          false;


        updateReadButton();


        statusEl.textContent =
          "DICTATION READY";

      };


    utterance.onerror =
      function(event) {


        reading =
          false;


        updateReadButton();


        if (
          event.error !== "canceled"
        ) {


          resultEl.textContent =
            "READ ERROR: " +
            event.error;

        }

      };


    window.speechSynthesis.speak(
      utterance
    );

  }
);


/* =========================================================
   REF-48 — SAVE BUTTON
========================================================= */

saveBtn.addEventListener(
  "click",

  function() {


    if (listening) {


      resultEl.textContent =
        "Stop listening before saving.";


      return;

    }


    stopReading();


    saveDictation();

  }
);


/* =========================================================
   REF-49 — SAVE DICTATION
========================================================= */

function saveDictation() {


  if (saving) {
    return;
  }


  const text =
    heardEl.value.trim();


  if (!text) {


    resultEl.textContent =
      "Nothing to save.";


    return;

  }


  if (
    destinationEl.value ===
    "local"
  ) {


    saveLocal(
      text
    );


    return;

  }


  saveGoogleDrive(
    text
  );

}


/* =========================================================
   REF-50 — LOCAL TXT
========================================================= */

function saveLocal(text) {


  let name =
    fileNameEl.value.trim() ||
    "Voice Dictation";


  if (
    !name
      .toLowerCase()
      .endsWith(".txt")
  ) {


    name +=
      ".txt";

  }


  const timestamp =
    new Date()
      .toLocaleString();


  const contents =
    timestamp +
    "\n\n" +
    text +
    "\n";


  const blob =
    new Blob(
      [contents],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    name;


  document.body
    .appendChild(
      a
    );


  a.click();


  a.remove();


  setTimeout(
    function() {


      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  statusEl.textContent =
    "SAVED LOCALLY";


  resultEl.textContent =
    "Downloaded: " +
    name;

}


/* =========================================================
   REF-51 — GOOGLE DRIVE SAVE
========================================================= */

function saveGoogleDrive(text) {


  saving =
    true;


  statusEl.textContent =
    "SAVING TO GOOGLE DRIVE...";


  const data =
    new URLSearchParams();


  data.append(
    "text",
    text
  );


  data.append(
    "format",
    driveFormatEl.value
  );


  data.append(
    "fileName",
    fileNameEl.value.trim()
  );


  data.append(
    "folder",
    folderEl.value.trim()
  );


  fetch(
    BACKEND_URL,
    {
      method: "POST",
      body: data
    }
  )


  .then(
    function(response) {

      return response.json();

    }
  )


  .then(
    function(data) {


      saving =
        false;


      if (
        data.success
      ) {


        statusEl.textContent =
          "SAVED";


        resultEl.textContent =
          "Saved to Google Drive: " +
          data.fileName;

      }

      else {


        statusEl.textContent =
          "SAVE ERROR";


        resultEl.textContent =
          data.error ||
          "Unknown save error";

      }

    }
  )


  .catch(
    function(error) {


      saving =
        false;


      statusEl.textContent =
        "CONNECTION ERROR";


      resultEl.textContent =
        error.message;

    }
  );

}


/* =========================================================
   REF-52 — INITIAL STATE
========================================================= */

updateMicButton();

updateReadButton();

updateTextboxMode();

</script>
